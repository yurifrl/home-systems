version: '3'
tasks:
  copy:
    desc: "Sync proxmox VM config files to the remote Proxmox host"
    cmds:
      - rsync -avz ./proxmox/ root@192.168.68.112:/etc/pve/qemu-server/

  workstation-seed:
    desc: "Seed/rotate the 1Password 'workstation' item (sections: kubeconfig docker tailscale github)"
    cmds:
      - ./scripts/workstation-seed-secrets.sh {{.CLI_ARGS}}

