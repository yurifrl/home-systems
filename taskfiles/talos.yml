version: '3'

# Ad-hoc talosctl helpers. Node provisioning, rendering, and secret injection
# live in nostos (see ../nostos/README.md); nostos/config.yaml is the source of
# truth for node IPs, types (metal/vm/host), and roles.

tasks:
  dashboard:
    desc: "Open talosctl dashboard against every LAN Talos node"
    cmds:
      - talosctl -n 192.168.68.100,192.168.68.90,192.168.68.91,192.168.68.104,192.168.68.107,192.168.68.114 dashboard
  apply:
    desc: "[deprecated] provisioning goes through nostos — use 'nostos apply <node>'"
    cmds:
      - 'echo "deprecated: use ''nostos apply <node>''" >&2'
      - exit 1
