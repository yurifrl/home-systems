apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-substrate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  # Server-side diff dry-runs the postgres StatefulSet, which the apiserver
  # rejects (volumeClaimTemplates validation) and breaks comparison+sync.
  # Client-side diff with the jqPathExpressions below is correct here.
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=false
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs + ValidatingAdmissionPolicy + PriorityClasses must land before
      # workloads; the chart has no dependency ordering, so waves would race.
      - ServerSideApply=true
  # volumeClaimTemplates is immutable and the apiserver fills volumeMode,
  # apiVersion and kind on the live STS, so without these the postgres STS is
  # permanently OutOfSync. Lives at spec level — syncPolicy.ignoreDifferences
  # is unknown to this Argo CRD and gets silently dropped on apply.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: postgres
      jqPathExpressions:
        - ".spec.volumeClaimTemplates[].spec.volumeMode"
        - ".spec.volumeClaimTemplates[].apiVersion"
        - ".spec.volumeClaimTemplates[].kind"
  sources:
    - repoURL: git@github.com:yurifrl/agents.git
      targetRevision: HEAD
      path: charts/agent-substrate
      helm:
        valueFiles:
          - values-my-cluster.yaml
