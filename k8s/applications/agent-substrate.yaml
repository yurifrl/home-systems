apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-substrate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs + ValidatingAdmissionPolicy + PriorityClasses must land before
      # workloads; the chart has no dependency ordering, so waves would race.
      - ServerSideApply=true
  sources:
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/agent-substrate
      helm:
        valueFiles:
          - values-talos.yaml
