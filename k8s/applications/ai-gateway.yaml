apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
  source:
    repoURL: https://github.com/yurifrl/home-systems.git
    targetRevision: HEAD
    path: k8s/charts/support
    helm:
      valuesObject:
        virtualServices:
          - name: ai-gateway
            hosts:
              - ai.syscd.live
            http:
              - match:
                  - uri:
                      prefix: /omni
                rewrite:
                  uri: /
                route:
                  - destination:
                      host: omniroute.omniroute.svc.cluster.local
                      port:
                        number: 20128
              - match:
                  - uri:
                      prefix: /lite
                rewrite:
                  uri: /
                route:
                  - destination:
                      host: litellm.litellm.svc.cluster.local
                      port:
                        number: 4000
              - route:
                  - destination:
                      host: litellm.litellm.svc.cluster.local
                      port:
                        number: 4000
