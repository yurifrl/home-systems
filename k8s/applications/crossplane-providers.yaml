apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane-providers
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    # After crossplane core (-2), before the GCP managed resources.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # Crossplane's apiserver defaulting fills runtimeConfigRef.apiVersion/kind
  # (DeploymentRuntimeConfig) on the live Provider; git declares only .name.
  # Without this the app flaps OutOfSync after every revision activation.
  ignoreDifferences:
    - group: pkg.crossplane.io
      kind: Provider
      jsonPointers:
        - /spec/runtimeConfigRef/apiVersion
        - /spec/runtimeConfigRef/kind
  source:
    repoURL: https://github.com/yurifrl/home-systems.git
    targetRevision: HEAD
    path: k8s/charts/crossplane-providers
