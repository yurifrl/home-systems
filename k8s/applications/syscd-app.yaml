                    - channelId: UC6k_GngLDtxbkUlZOq6_h5g
                      name: The McElroy Family
                    - channelId: UCvYwePdbWSEwUa-Pk02u3Zw
                      name: Questing Beast
                    - channelId: UCCXR2kCo7Lcw_BKwWxo09kw
                      name: Zee Bashew
                    - channelId: UCFfH-JnmTDr5izA35fHQe5g
                      name: Alex Hillman
                    - channelId: UCqB1bhMwGsW-yefBxYwFCCg
                      name: Tonbis AI Garage
                    - channelId: UCNSfV3L4jv7Kx22lxo0Sv-g
                      name: Cameron Gray
                    - channelId: UCbRP3c757lWg9M-U7TyEkXA
                      name: Theo - t3.gg
                    - channelId: UCrVLgIniVg6jW38uVqDRIiQ
                      name: Everything Smart Home
                    - channelId: UCJa14zeVf8p6clixTOIOVyQ
                      name: jakkuh
                    - channelId: UCxLYtICsUCWdr1YPrj5DtwA
                      name: Ordinary Things
                    - channelId: UCCJFWxm9fUtB4hPzNvmfcMA
                      name: James May’s Planet Gin
                    - channelId: UCkDSAQ_5-yx5hmuvUcsJL7A
                      name: Mr Sunday Movies
                    - channelId: UCODHrzPMGbNv67e84WDZhQQ
                      name: fern
          externalSecrets:
            - name: syscd-app
            # CNPG declarative role password must live in the `databases` ns
            # (the pg cluster's ns) as a basic-auth secret. postgres.yaml points
            # the `syscd` role's passwordSecret at this `syscd-db` secret.
            - name: syscd-db-roles
              namespace: databases
              targetName: syscd-db
              template:
                type: kubernetes.io/basic-auth
                data:
                  username: syscd
                  password: "{{ .password }}"
              data:
                - secretKey: password
                  key: syscd-app
                  property: DB_PASSWORD
          deployments:
            # Static web build served by busybox httpd on :8080.
            - name: syscd-app
              image:
                repository: ghcr.io/yurifrl/syscd-app
                tag: latest
                pullPolicy: Always
              # amd64-only image; pc01 is the only schedulable amd64 node.
              # ponytail: pin to pc01; build multi-arch images if HA matters.
              nodeSelector:
                kubernetes.io/hostname: pc01
              containerPort: 8080
              readinessProbe:
                httpGet:
                  path: /
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
            # Hono API (bun server/index.ts): budget/health/ourtube + auth.
            # Poller + retention run in-process; channels seeded from the
            # ourtube-channels ConfigMap via OT_CHANNELS_CONFIG_PATH.
            - name: syscd-api
              image:
                repository: ghcr.io/yurifrl/syscd-app-api
                tag: latest
                pullPolicy: Always
              nodeSelector:
                kubernetes.io/hostname: pc01
              containerPort: 3000
              readinessProbe:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              envFrom:
                - secretRef:
                    name: syscd-app
              env:
                - name: OT_CHANNELS_CONFIG_PATH
                  value: /config/channels.yaml
                - name: APP_BASE_URL
                  value: https://app.syscd.live
                - name: API_BASE_URL
                  value: https://api.syscd.live
              volumes:
                - name: channels
                  configMap:
                    name: ourtube-channels
              volumeMounts:
                - name: channels
                  mountPath: /config
                  readOnly: true
          services:
            - name: syscd-app
              port: 80
              targetPort: http
            - name: syscd-api
              port: 3000
              targetPort: http
          virtualServices:
            - name: syscd-app
              hosts:
                - app.syscd.live
                - app.syscd.tech
                - app.syscd.xyz
                - app.syscd.dev
              service:
                name: syscd-app
                namespace: syscd-app
                port: 80
            - name: syscd-api
              hosts:
                - api.syscd.live
              service:
                name: syscd-api
                namespace: syscd-app
                port: 3000
