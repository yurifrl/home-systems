apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syscd-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: syscd-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
  sources:
    # Support chart renders the Deployment + Service + istio VirtualService.
    # The app is the static web build of the syscd Expo app, served by busybox
    # httpd on :8080 (ghcr.io/yurifrl/syscd-app, built by syscd-app CI).
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support
      helm:
        valuesObject:
          configMaps:
            - name: ourtube-channels
              data:
                channels.yaml: |
                  channels:
                    - channelId: UCXuqSBlHAE6Xw-yeJA0Tunw
                      name: Linus Tech Tips
                    - channelId: UCrTNhL_yO3tPTdQ5XgmmWjA
                      name: RedLetterMedia
                    - channelId: UCiER8p540j2SosO7OX7E0VA
                      name: Legends of Avantris
                    - channelId: UCyRhIGDUKdIOw07Pd8pHxCw
                      name: Shut Up & Sit Down
                    - channelId: UCDjzWHhTShC59KtduL-jeig
                      name: Estranha História
                    - channelId: UCW7AGm8JSBEEew61dJIgl_A
                      name: Tom Cardy
                    - channelId: UC2J6g9iavgANTSKEemLFOTA
                      name: This Aged Great!
                    - channelId: UC1lIHn3KlcJimyxsVugP4uw
                      name: Aging Wheels
                    - channelId: UCGeIjGngCkErevSNHdZYD5Q
                      name: Expleened (Storymode)
                    - channelId: UC6ext5UAbrLT2e5y5BC6RTQ
                      name: The Adam Friedland Show
                    - channelId: UC_S45UpAYVuc0fYEcHN9BVQ
                      name: Boy Boy
                    - channelId: UC8Q7XEy86Q7T-3kNpNjYgwA
                      name: Incognito Mode
                    - channelId: UCejzv0MInydp0Isrza8e0tw
                      name: Jenna Phipps
                    - channelId: UCFhXFikryT4aFcLkLw2LBLA
                      name: NileRed
                    - channelId: UCR1D15p_vdP3HkrH8wgjQRw
                      name: Internet Historian
                    - channelId: UCRcgy6GzDeccI7dkbbBna3Q
                      name: LEMMiNO
                    - channelId: UCtU-oQXFKUMFvhunPrx7U-w
                      name: No Pun Included
                    - channelId: UC1ZBQ-F-yktYD4m5AzM6pww
                      name: Mustard
                    - channelId: UClt01z1wHHT7c5lKcU8pxRQ
                      name: hbomberguy
                    - channelId: UCG1h-Wqjtwz7uUANw6gazRw
                      name: Lindsay Ellis
                    - channelId: UCNvsIonJdJ5E4EXMa65VYpA
                      name: ContraPoints
                    - channelId: UCSc16oMxxlcJSb9SXkjwMjA
                      name: YMS
                    - channelId: UCrq3JYirgV-BLluzTF6X_7A
                      name: STRANGE ÆONS
                    - channelId: UCnCk_o6ySiM_ZzxubCv899Q
                      name: fig tree
                    - channelId: UC7-E5xhZBZdW-8d7V80mzfg
                      name: Jenny Nicholson
                    - channelId: UCyNtlmLB73-7gtlBz00XOQQ
                      name: Folding Ideas
                    - channelId: UC6me-RzbQFQ-kRyr6BlGZWg
                      name: Paul E.T.
                    - channelId: UCj1VqrHhDte54oLgPG4xpuQ
                      name: Stuff Made Here
                    - channelId: UCCJD5wGU6pLiCHKH2Sr_4fg
                      name: Quinns Quest
                    - channelId: UC2P1bJ-udK3UhVX2QvnkS9g
