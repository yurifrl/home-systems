apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ax
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: ax-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Ambient mesh: the istio ingress gateways reach ax-server through
        # ztunnel; also gives the tailnet VS path L4 identity.
        istio.io/dataplane-mode: ambient
  # ax-controller requires agent-substrate running (api.ate-system.svc) and
  # its ClusterTrustBundles; sync order is enforced by the substrate
  # application landing first (controller retries until the API answers).
  info:
    - name: prerequisite
      value: agent-substrate application must be healthy first
  sources:
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/ax
      helm:
        valueFiles:
          - values-talos.yaml
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support
      helm:
        valuesObject:
          global:
            domains:
              # Tailnet only (ax.syscd.tech via the tailscale gateway): the
              # ax-server HTTP API has no authentication, so it must not be
              # reachable on the public cloudflare-proxied domains.
              live: false
              tech: true
              xyz: false
              dev: false
          virtualServices:
            - name: ax
              service:
                name: ax-server
                namespace: ax-system
                port: 8080
