apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-management
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: user-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
  sources:
    # PRIVATE: real values (storage driver, ESO wiring) for the app chart.
    - repoURL: git@github.com:yurifrl/home-systems-values.git
      targetRevision: HEAD
      ref: values
    # App chart: lives in the PRIVATE values repo (this app is not public).
    # Two sources share the repoURL: the ref-only source above exposes
    # $values, this one renders the chart itself.
    - repoURL: git@github.com:yurifrl/home-systems-values.git
      targetRevision: HEAD
      path: user-management/chart
      helm:
        releaseName: user-management
        valueFiles:
          - $values/user-management/values.yaml
    # Cluster glue: ExternalSecrets (1Password) for the CNPG role password
    # and the private-ghcr pull secret.
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support
      helm:
        valuesObject:
          externalSecrets:
            # CNPG declarative role password must live in the `databases` ns
            # (the pg cluster's ns) as a basic-auth secret. postgres.yaml
            # points the `user_management` role's passwordSecret at
            # `user-management-db` — same pattern as litellm-db.
            - name: user-management-db-roles
              namespace: databases
              targetName: user-management-db
              template:
                type: kubernetes.io/basic-auth
                data:
                  username: user_management
                  password: "{{ .DB_PASSWORD }}"
              data:
                - secretKey: password
                  key: user-management
                  property: DB_PASSWORD
            # Private ghcr pulls: the shared dockerconfigjson from 1Password,
            # rendered in the app namespace (same ESO shape as
            # support-cluster's default-ns copy; consumed via
            # imagePullSecrets in the app values).
            - name: ghcr-image-pull-secret
              decodingStrategy: Auto
