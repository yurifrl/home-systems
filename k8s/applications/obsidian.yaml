apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obsidian
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: obsidian
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
  sources:
    # linuxserver Obsidian (desktop-in-browser via KasmVNC). An init container
    # clones the private vault repo (git@github.com:yurifrl/Obsidian.git) into
    # /config/vaults/Obsidian using the GITHUB_TOKEN synced from 1Password.
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support
      helm:
        valuesObject:
          persistentVolumeClaims:
            - name: obsidian-config
              storage: 10Gi
              storageClassName: longhorn-single
          # Pulls GITHUB_TOKEN from the 1Password "obsidian" item (Kubernetes
          # vault) into a k8s Secret named "obsidian".
          externalSecrets:
            - name: obsidian
              data:
                - secretKey: GITHUB_TOKEN
                  key: obsidian
                  property: GITHUB_TOKEN
                - secretKey: GITHUB_WEBHOOK_SECRET
                  key: obsidian
                  property: GITHUB_WEBHOOK_SECRET
          deployments:
            - name: obsidian
              # RWO volume (longhorn-single): tear down old pod before starting new one,
              # otherwise rollouts deadlock on Multi-Attach.
              strategy:
                type: Recreate
              # Electron's Chromium sandbox needs an unconfined seccomp profile.
              securityContext:
                seccompProfile:
                  type: Unconfined
              volumes:
                - name: config
                  persistentVolumeClaim:
                    claimName: obsidian-config
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 1Gi
              containers:
                - name: obsidian
                  image: lscr.io/linuxserver/obsidian:latest
                  imagePullPolicy: Always
                  ports:
                    - name: http
                      containerPort: 3000
                      protocol: TCP
                  env:
                    - name: PUID
                      value: "1000"
                    - name: PGID
                      value: "1000"
                    - name: TZ
                      value: America/Sao_Paulo
                  volumeMounts:
                    - name: config
                      mountPath: /config
                    - name: dshm
                      mountPath: /dev/shm
                  resources:
                    requests:
                      cpu: 100m
                      memory: 512Mi
                    limits:
                      memory: 2Gi
                # Expose the Local REST API plugin (HTTPS bound to
                # 127.0.0.1:27124 with a self-signed cert) on the pod network as
                # plain TCP: socat originates the TLS upstream (verify=0), so
                # in-cluster clients speak plain HTTP and avoid self-signed-cert
                # handling. Transport is still encrypted by istio ambient mTLS.
                - name: rest-api-proxy
                  image: alpine/socat:latest
                  args:
                    - TCP-LISTEN:27125,fork,reuseaddr
                    - OPENSSL:127.0.0.1:27124,verify=0
                  ports:
                    - name: rest-api
                      containerPort: 27125
                      protocol: TCP
                  resources:
                    requests:
                      cpu: 10m
                      memory: 16Mi
                    limits:
                      memory: 32Mi
          services:
            - name: obsidian
              port: 3000
            # Local REST API, proxied by the socat sidecar to the plugin.
            - name: obsidian-rest
              selector: obsidian
              port: 27124
              targetPort: 27125
          virtualServices:
            - name: obsidian
              service:
                name: obsidian
                namespace: obsidian
                port: 3000
            # Public endpoint GitHub posts Obsidian push webhooks to.
            - name: obsidian-repo-webhook
              domains:
                live: true
              service:
                name: obsidian-repo-webhook-eventsource-svc
                namespace: obsidian
                port: 12000
    # Vault git sync: WorkflowTemplate + CronWorkflow (and, once enabled, the
    # argo-events webhook pipeline) that replaced the in-pod vault-sync sidecar.
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/obsidian-sync
