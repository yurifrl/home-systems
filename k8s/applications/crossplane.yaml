apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crossplane
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  source:
    repoURL: https://charts.crossplane.io/stable
    chart: crossplane
    targetRevision: "2.3.4"
    helm:
      valuesObject:
        # Single-replica control plane: leader election is pointless here and its
        # lease renewal FLAPS whenever the (single, overloaded) apiserver is slow,
        # crashing crossplane core with "leader election lost" -> restart storm ->
        # more apiserver load -> lease lost again. Disable it.
        leaderElection: false
        # The in-cluster apiserver ClusterIP VIP (kube-proxy/Cilium) is unreliable
        # in this stretched two-LAN cluster: a freshly (re)started core cannot sync
        # its watch caches through the VIP and crashloops with "failed to wait for
        # CompositionRevision cache to sync". Point core straight at the
        # control-plane apiserver (same remedy as the gcp-storage-pinned provider
        # runtime config), bypassing the VIP.
        extraEnvVarsCrossplane:
          KUBERNETES_SERVICE_HOST: "192.168.68.91"
          KUBERNETES_SERVICE_PORT: "6443"
        # rbac-manager needs the SAME two remedies as core above: its lease
        # renewals through the flaky VIP crashed it with "leader election lost"
        # (700+ restarts over 3 days). While it is down, new ProviderRevisions
        # get no RBAC, which disables provider SafeStart and crashloops any
        # provider whose MRDs are intentionally inactive (2026-08-15 incident).
        rbacManager:
          leaderElection: false
          # Exception: pin this small, bounded singleton to the control plane.
          # It owns provider RBAC, and losing it disables SafeStart; its former
          # rpi01 location also reached the apiserver through the flaky two-LAN
          # VIP. It requests 100m CPU / 256Mi and is limited to 500m / 512Mi.
          #
          # POLICY: control-plane placement is NEVER the default. It requires
          # all of: control-plane recovery dependency, bounded requests/limits,
          # no heavy cluster-wide LIST/watch/reconcile loop, and an explicit
          # reason here. Providers, databases, telemetry, and normal workloads
          # stay off it because they can starve apiserver/etcd CPU or I/O.
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        extraEnvVarsRBACManager:
          KUBERNETES_SERVICE_HOST: "192.168.68.91"
          KUBERNETES_SERVICE_PORT: "6443"
        # Throttle core's reconcile loop. Core (not the providers) reconciles
        # ManagedResourceDefinitions; a hot no-op loop was PUTting MRDs at ~20/s,
        # pegging the apiserver and stalling ArgoCD. Lower the global reconcile
        # rate and stretch the sync interval.
        args:
          - --max-reconcile-rate=1
          - --sync-interval=30m
        # NOTE: the `default` ManagedResourceActivationPolicy (narrowed from the
        # ["*"] crossplane bootstraps) is NOT settable from this chart's values —
        # the deployment args are just ["core","start"]. It is owned as an explicit
        # manifest in k8s/charts/crossplane-providers (default-mrap.yaml), which
        # Argo server-side-applies and self-heals.
        resourcesCrossplane:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        resourcesRBACManager:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        metrics:
          enabled: true
        # Enable XFN (Composition Functions) for advanced composition logic
        xfn:
          enabled: true
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
