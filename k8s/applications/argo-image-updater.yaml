apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-image-updater
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      # Chart 1.2.4 -> appVersion v1.2.2 (CRD/ImageUpdater model).
      targetRevision: "1.3.2"
      helm:
        releaseName: argocd-image-updater
        valuesObject:
          crds:
            install: true
            keep: true
          # Chart hardcodes --metrics-bind-address=:{{ containerPorts.metrics }} before
          # run (the flag is supported by the image). Leader election, however, exits the
          # process ("Error: leader election lost" -> usage dump -> restart) whenever lease
          # renewal to the API server blips; with a single replica it adds no value.
          extraArgs:
            - "--leader-election=false"
