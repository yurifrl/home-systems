apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"  
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - chart: external-secrets
      repoURL: https://charts.external-secrets.io
      # Pinned to 2.14.0: the floating "*" moved this to 2.15.0 on 2026-11-10 11:23Z, and from
      # that minute the controller and cert-controller both crash-loop with "leader election lost"
      # (lease GET via 10.96.0.1 > 5s). 2.12-2.14 ran fine under the same ~3-core apiserver load.
      targetRevision: "2.14.0"
      helm:
        valuesObject:
          installCRDs: true
          replicaCount: 1
          leaderElect: true
          serviceMonitor:
            enabled: true
            interval: 1m
          webhook:
            serviceMonitor:
              enabled: true
              interval: 1m
          certController:
            serviceMonitor:
              enabled: true
              interval: 1m
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi 
