apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"  
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - chart: external-secrets
      repoURL: https://charts.external-secrets.io
      # Pinned (was floating "*", which silently jumped versions). NOTE: the
      # 2026-11-10 "leader election lost" crash loop was NOT caused by 2.15.0 —
      # 2.14.0 crashed identically. Root cause was APF queueing of lease traffic
      # in workload-low; fixed by the FlowSchema in
      # k8s/charts/support-cluster/templates/flowschema-leases.yaml.
      targetRevision: "2.15.0"
      helm:
        valuesObject:
          installCRDs: true
          replicaCount: 1
          leaderElect: true
          serviceMonitor:
            enabled: true
            interval: 1m
          webhook:
            serviceMonitor:
              enabled: true
              interval: 1m
          certController:
            serviceMonitor:
              enabled: true
              interval: 1m
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi 
