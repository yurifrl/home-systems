apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support
      helm:
        valuesObject:
          # Single shared Redis instance for every app in the cluster that
          # wants Redis (ax and mecatl today, more later).
          # No auth, no clustering, no Sentinel: cluster-internal only
          # (ClusterIP, no VirtualService), so a password buys nothing here
          # and would just be one more secret to rotate. Keep it simple.
          #
          # Two listeners: plaintext 6379 for unauthenticated consumers, and
          # TLS 6380 for clients that require a verified TLS endpoint (mecak8s
          # rejects plaintext redis and cannot do client certs, upstream ADR
          # 0233 -- so server-side TLS with --tls-auth-clients no).
          #
          # Persistence: --appendonly yes on a Longhorn-backed PVC (defaults
          # to the longhorn-ha StorageClass, 2 replicas) so the data survives
          # a pod restart AND a node loss - the StatefulSet has no
          # nodeSelector/affinity, so it can be (re)scheduled on any node.
          #
          # Database index registry: Redis gives 16 logical DBs (0-15) per
          # instance via SELECT/the URL path segment. Each consumer picks an
          # unused index below so they don't collide on the same instance.
          # Consumers without a db selector (mecak8s, ax-server) share db 0
          # and are isolated by their own key prefixes instead. Add a line
          # here when a consumer starts using Redis:
          #   0 - key-prefixed consumers: mecak8s (sessions/event log),
          #       ax-server (streams) -- no db flag upstream
          #   1, 2, 5 - harbor (core, jobservice, registry, trivy)
          #   3 - n8n (Bull queue)
          #   4 - firecrawl (queue and rate limits)
          #   6 - happy
          #   7 - litellm (router cache, rate limits, budgets)
          #   8 - argocd (cache; REDIS_SERVER/REDISDB via argocd-cmd-params)
          #
          # The TLS CA is a ClusterIssuer (redis-ca, CA secret in ns
          # cert-manager because ClusterIssuers resolve their CA secret from
          # cert-manager's --cluster-resource-namespace) so each consumer
          # namespace issues its own leaf Certificate and pins the same
          # ca.crt from it (cert-manager writes the issuing CA to ca.crt on
          # every issued secret) - mecatl does exactly that.
          certificates:
            - name: redis-ca
              namespace: cert-manager
              selfSignedCA: true
              clusterIssuer: true
            - name: redis-tls
              issuerRef:
                name: redis-ca
                kind: ClusterIssuer
              dnsNames:
                # First SAN must match the TLS clients' endpoint hostname
                # (mecak8s verifies it byte-exact): the redis-tls service.
                - redis-tls.redis.svc.cluster.local
                - redis-tls.redis.svc
                - redis-tls
          statefulSets:
            - name: redis
              replicas: 1
              containers:
                - name: redis
                  image: redis:7-alpine
                  args:
                    - redis-server
                    - --appendonly
                    - "yes"
                    - --port
                    - "6379"
                    - --tls-port
                    - "6380"
                    - --tls-cert-file
                    - /tls/tls.crt
                    - --tls-key-file
                    - /tls/tls.key
                    - --tls-ca-cert-file
                    - /tls/ca.crt
                    - --tls-auth-clients
                    - "no"
                  ports:
                    - name: redis
                      containerPort: 6379
                      protocol: TCP
                    - name: redis-tls
                      containerPort: 6380
                      protocol: TCP
                  volumeMounts:
                    - name: data
                      mountPath: /data
                    - name: tls
                      mountPath: /tls
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
              volumes:
                - name: tls
                  secret:
                    secretName: redis-tls
              volumeClaimTemplates:
                - name: data
                  accessModes:
                    - ReadWriteOnce
                  storage: 1Gi
          services:
            - name: redis
              port: 6379
              targetPort: 6379
            - name: redis-tls
              selector: redis
              port: 6380
              targetPort: 6380
