          statefulSets:
            # Dedicated TLS redis for mecak8s session state (snapshots + event
            # streams). Server-side TLS only -- mecak8s cannot do client certs
            # (upstream ADR 0233) -- so --tls-auth-clients no. ClusterIP only,
            # ambient mTLS on the wire; not exposed via VirtualService.
            - name: redis
              replicas: 1
              containers:
                - name: redis
                  image: redis:7-alpine
                  args:
                    - redis-server
                    - --port
                    - "0"
                    - --tls-port
                    - "6379"
                    - --tls-cert-file
                    - /tls/tls.crt
                    - --tls-key-file
                    - /tls/tls.key
                    - --tls-ca-cert-file
                    - /tls/ca.crt
                    - --tls-auth-clients
                    - "no"
                    - --appendonly
                    - "yes"
                  ports:
                    - name: redis
                      containerPort: 6379
                      protocol: TCP
                  volumeMounts:
                    - name: data
                      mountPath: /data
                    - name: tls
                      mountPath: /tls
                  resources:
                    requests:
                      cpu: 50m
                      memory: 64Mi
                    limits:
                      cpu: 500m
                      memory: 256Mi
              volumes:
                - name: tls
                  secret:
                    secretName: redis-tls
              volumeClaimTemplates:
                - name: data
                  accessModes:
                    - ReadWriteOnce
                  storage: 5Gi
          services:
            - name: redis
              port: 6379
              targetPort: 6379
          certificates:
            - name: redis-tls
              selfSignedCA: true
              dnsNames:
                # First SAN must match redis.endpoint (hostname verification).
                - redis.mecatl.svc.cluster.local
                - redis.mecatl.svc
                - redis.mecatl
          persistentVolumeClaims:
            # Agent workspace: real filesystem + shell for sessions, survives
            # pod/node loss (longhorn-ha = 2 replicas) and is backed up weekly.
            - name: mecatl-workspace
              accessModes:
                - ReadWriteOnce
              storage: 10Gi
          longhornBackups:
            - pvc: mecatl-workspace
          externalSecrets:
            - name: mecatl-openrouter
              data:
                - secretKey: OPENROUTER_API_KEY
                  key: mecatl
                  property: OPENROUTER_API_KEY
          virtualServices:
            - name: mecatl
              service:
                name: mecak8s
                namespace: mecatl
                port: 8080
              domains:
                live: false   # never publish the agent publicly
                xyz: false
                tech: false   # no tailnet DNS record published; dev is primary
                dev: true     # public DNS -> gateway LB; works from LAN,
                              # tailnet, and in-cluster pods
              http:
                # Login metadata discovery (RFC 9728) rides the HTTP listener;
                # everything else is gRPC. /healthz /readyz /drain stay
                # unrouted on purpose (mecak8s docs forbid publishing them).
                - match:
                    - uri:
                        prefix: /.well-known/
                  route:
                    - destination:
                        host: mecak8s.mecatl.svc.cluster.local
                        port:
                          number: 8081
                - route:
                    - destination:
                        host: mecak8s.mecatl.svc.cluster.local
                        port:
                          number: 8080
