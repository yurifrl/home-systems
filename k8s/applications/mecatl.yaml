apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mecatl
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: mecatl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
  sources:
    # ------------------------------------------------------------------
    # Mecatl agent harness (Stacklok) - mecak8s mode: stateless agent pods,
    # session state in Redis, single-writer per session via k8s Leases.
    # Remote coding-agent "workers": `mecatui login mecatl.syscd.tech` then
    # `mecatui connect mecatl.syscd.tech --tls` from the laptop; sessions are
    # spawned on connect and survive pod restarts via Redis.
    #
    # Secure posture required by the chart for a real LLM provider:
    #   - TLS-verified Redis (dedicated instance below; the shared cluster
    #     redis is plaintext and is rejected by mecak8s)
    #   - OIDC caller identity via dex (issuer compared byte-exact)
    #   - security.tlsTerminatedUpstream: istio gateways terminate TLS with
    #     the letsencrypt wildcard (syscd-tls); ambient mesh mTLS protects
    #     the bearer inside the cluster
    # Docs: https://mecatl.dev/docs/building/deployment/mecak8s
    # ------------------------------------------------------------------
    # Vendored from oci://ghcr.io/stacklok/mecatl/charts (mecak8s 0.0.38,
    # digest 63046697...). The OCI chart is PRIVATE on ghcr (anonymous pull
    # denied even with the repo registered in ArgoCD), so it ships in-tree;
    # the mecak8s container image it deploys is public, so cluster pulls work.
    - path: k8s/charts/mecatl
      repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      helm:
        releaseName: mecatl
        valuesObject:
          # Fixed short names: deployment/service `mecak8s` in ns mecatl.
          fullnameOverride: mecak8s
          # RWO workspace volume -> single replica (sessions still survive pod
          # loss: state lives in Redis, ownership in k8s Leases).
          replicaCount: 1
          # Server-assigned agent filesystem root (clients cannot pick another).
          workspace: /workspace
          extraVolumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: mecatl-workspace
          extraVolumeMounts:
            - name: workspace
              mountPath: /workspace
          redis:
            # Dedicated TLS-redis in this namespace (statefulSet below).
            # Hostname verification runs against this exact name -> the cert's
            # first SAN must be redis.mecatl.svc.cluster.local.
            endpoint: redis.mecatl.svc.cluster.local:6379
            credentialsSecret: redis-tls
            caKey: ca.crt
          security:
            # TLS terminated by the istio gateway (real LE wildcard cert);
            # OIDC still enforced here. In-pod TLS not needed with ambient.
            tlsTerminatedUpstream: true
          # RWO workspace PVC: a surge pod deadlocks on volume attach; Recreate
          # retires the old pod fully before starting the new one.
          strategy:
            type: Recreate
          oidc:
            enabled: true
            # Byte-exact issuer; dex.syscd.dev resolves from pods via public
            # DNS -> gateway LB (see dns-records). The LB IP is RFC1918, and
            # mecak8s refuses discovery URLs that resolve to private
            # addresses by default - admit it explicitly (HTTPS is kept;
            # cert chain is public CA (Let's Encrypt) - pinned via the
            # mecatl-dex-ca Secret below (roots only, not a secret).
            allowPrivateHTTPSIssuer: true
            caSecret: mecatl-dex-ca
            caKey: ca.crt
            issuer: https://dex.syscd.dev
            audience: mecatui
            # RFC 9728 login metadata -> enables `mecatui login`. Must match
            # the hostname clients actually use (mecatl.syscd.dev).
            resource: https://mecatl.syscd.dev
            clientID: mecatui
            scopes: [openid, profile, offline_access]
          # Pinned for GitOps (offline renders cannot generate a stable UUID).
          telemetry:
            installationID: 18f26f57-1e55-4eeb-9301-d049e7a7d5a7
          defaultProvider: openrouter
          # No model pinned: mecatl's provider default applies. Tune later.
          extraEnv:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mecatl-openrouter
                  key: OPENROUTER_API_KEY
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support
      helm:
        valuesObject:
          secrets:
            # Public Let's Encrypt roots pinned for mecak8s' OIDC validator
            # (allowPrivateHTTPSIssuer requires an explicit CA). Public data;
            # not eligible for 1Password.
            - name: mecatl-dex-ca
              type: Opaque
              stringData:
                ca.crt: |
                  -----BEGIN CERTIFICATE-----
