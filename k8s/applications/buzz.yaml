apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buzz
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: buzz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
  sources:
    # PRIVATE: real values (the GCS bucket name is private, so s3.bucket lives
    # here, not in this public repo). Merged over the OCI chart values below.
    - repoURL: git@github.com:yurifrl/home-systems-values.git
      targetRevision: HEAD
      ref: values
    # App: Buzz relay (single binary: WebSocket + REST + web UI). Only shipped
    # as an OCI Helm chart. ArgoCD >= 3.1 native OCI sources require the FULL
    # artifact path as repoURL (the repoURL/…/charts + chart: buzz split form
    # 403s on GHCR) and a placeholder path ".".
    - repoURL: oci://ghcr.io/block/buzz/charts/buzz
      path: .
      targetRevision: 0.1.8
      helm:
        releaseName: buzz
        valueFiles:
          - $values/buzz/values.yaml
        valuesObject:
          # Public wss:// URL clients connect to. Drives RELAY_URL, the default
          # media base URL, and (unused here) the chart's own ingress host.
          relayUrl: wss://buzz.syscd.live

          # 64-char lowercase-hex Nostr pubkey of the relay operator (owner).
          # This is the public half of the owner keypair generated for this
          # install; the private key (nsec) is stored in the 1Password "buzz"
          # item (OWNER_NSEC) — import it into a Nostr/Buzz client to log in as
          # owner. Replace with your own npub's hex if you already have a Nostr
          # identity you'd rather use.
          ownerPubkey: "c0d50085f361f163afcd9551969c5aa6aa0f5c2fbb5fa504d7822baae0c4f862"

          # Single replica: no Redis (buzz-pubsub) and no git-hook HMAC secret
          # needed. Huddle audio (single-pod-only until an SFU exists) stays
          # valid at 1 replica.
          replicaCount: 1

          # GitOps-safe secrets: everything sensitive comes from the
          # buzz-secrets Secret (ExternalSecret below), never chart autogen
          # (which regenerates on every `helm template`/ArgoCD sync).
          secrets:
            existingSecret: buzz-secrets

          # DATABASE_URL lives in buzz-secrets (points at the shared CNPG `pg`
          # cluster, db `buzz`, role `buzz`). Leave this empty.
          externalPostgresql:
            url: ""

          # S3-compatible object store for media + git state. Uses GCS via its
          # S3-interop (XML) API + HMAC creds — the same bucket+SA+HMACKey
          # pattern Crossplane already uses for Longhorn's GCS backup target.
          # Bucket, SA, IAM and HMAC key are declared in the private
          # home-systems-values repo (gcp/values.yaml); s3.bucket is set from
          # $values/buzz/values.yaml (private). BUZZ_S3_ACCESS_KEY /
          # BUZZ_S3_SECRET_KEY (the HMAC key id/secret) live in the 1Password
          # "buzz" item. 0.1.7 signs path-style, which storage.googleapis.com
          # accepts.
          s3:
            endpoint: "https://storage.googleapis.com"

          # Git ref/object state is object-store-backed (GCS), so this is only a
          # throwaway per-pod hydration cache. Use emptyDir instead of a
          # ReadWriteOnce Longhorn PVC: this cluster's Longhorn datapath is
          # flaky (volumes get stuck "not ready for workloads" on attach), and
          # nothing here needs to survive a restart.
          persistence:
            git:
              enabled: false

          # Networking is handled by the Istio VirtualService (support chart
          # below) + Cloudflare tunnel, not the chart's own ingress/HTTPRoute.
          ingress:
            enabled: false
          httproute:
            enabled: false

    # Cluster glue: ExternalSecrets (1Password) + Istio VirtualService.
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support
      helm:
        valuesObject:
          externalSecrets:
            # Relay secret bundle in the `buzz` namespace, from the 1Password
            # "buzz" item. WebSocket/relay identity + DB URL + S3 creds.
            - name: buzz-secrets
              key: buzz
              data:
                - secretKey: BUZZ_RELAY_PRIVATE_KEY
                  key: buzz
                  property: RELAY_PRIVATE_KEY
                - secretKey: DATABASE_URL
                  key: buzz
                  property: DATABASE_URL
                - secretKey: BUZZ_S3_ACCESS_KEY
                  key: buzz
                  property: S3_ACCESS_KEY
                - secretKey: BUZZ_S3_SECRET_KEY
                  key: buzz
                  property: S3_SECRET_KEY
            # CNPG role password for the `buzz` login role, in the databases
            # namespace. basic-auth so the operator's passwordSecret ref works.
            - name: buzz-db
              namespace: databases
              key: buzz
              template:
                type: kubernetes.io/basic-auth
                metadata:
                  labels:
                    cnpg.io/reload: "true"
              data:
                - secretKey: username
                  key: buzz
                  property: DB_USERNAME
                - secretKey: password
                  key: buzz
                  property: DB_PASSWORD
          virtualServices:
            - name: buzz
              hosts:
                - buzz.syscd.live
              service:
                name: buzz
                namespace: buzz
                port: 3000
