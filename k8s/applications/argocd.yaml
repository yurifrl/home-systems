apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: "10.3.3"
      helm:
        releaseName: argocd
        valueFiles:
          - $values/manifests/values/argocd.yaml
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support
      helm:
        valuesObject:
          services:
            # The server's webhook repo-cache client hardcodes
            # argocd-redis:6379 and chart 10.3.3 has no env path to repoint
            # it. This alias keeps the name resolvable on the shared redis
            # after redis.enabled=false deletes the bundled Service.
            - name: argocd-redis
              externalName: redis.redis.svc.cluster.local
