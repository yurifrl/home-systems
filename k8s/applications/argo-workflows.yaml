apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  sources:
    - path: k8s/charts/support-argo-workflows
      repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
    - path: k8s/charts/support
      repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      helm:
        valuesObject:
          externalSecrets:
            - name: argo-workflows
              decodingStrategy: Auto
          virtualServices:
            - name: argo-workflows
              domains:
                live: true
                tech: true
              service:
                name: argo-workflows-server
                namespace: argo-workflows
                port: 2746
            - name: home-systems-repo-webhook
              service:
                name: argo-workflows-server
                namespace: argo-workflows
                port: 12000
    - chart: argo-events
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: "2.4.24"
      helm:
        valuesObject:
          # Cluster-scoped controller so it reconciles EventBus/EventSource/
          # Sensor in other namespaces (e.g. obsidian). This is the chart
          # default; pinned here so an upstream change can't silently break it.
          controller:
            rbac:
              namespaced: false
    - chart: argo-workflows
      repoURL: https://argoproj.github.io/argo-helm
      targetRevision: "2.0.4"
      helm:
        valuesObject:
          crds:
            install: true
            keep: true
            # Render CRDs as plain manifests instead of a Helm pre-install hook
            # Job; ArgoCD applies CRDs before the CronWorkflow/WorkflowTemplate
            # CRs, avoiding the "sync tasks not valid" deadlock.
            full: false
          workflow:
            serviceAccount:
              create: true
            rbac:
              create: true
          controller:
            workflowNamespaces:
              - argo-workflows
              - obsidian
          useStaticCredentials: true
          server:
            extraArgs:
              - --auth-mode=server
              - --auth-mode=client
              - --loglevel=debug
            sso:
              enabled: false
