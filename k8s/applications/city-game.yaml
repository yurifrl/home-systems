apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: city-game
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: city-game
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
  source:
    # Chart lives in the app repo (like board-games): everything about the
    # deployment moves with the game code on every push.
    repoURL: https://github.com/yurifrl/city-game.git
    targetRevision: HEAD
    path: chart
