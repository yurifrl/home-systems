apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-space
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # DNS-only: manages the *.syscd.space wildcard CNAME. The connector runs on
    # the workstation VM (nixos cloudflared.nix), not here.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-space
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  sources:
    # PUBLIC: value-free chart (templates + placeholders).
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/apps-space
      helm:
        valueFiles:
          # Real zoneId/tunnelId come from the PRIVATE repo.
          - $values/apps-space/values.yaml
    # PRIVATE: holds the real values (registered as an ArgoCD repo credential).
    - repoURL: git@github.com:yurifrl/home-systems-values.git
      targetRevision: HEAD
      ref: values
