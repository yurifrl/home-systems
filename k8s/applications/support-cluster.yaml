apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: support-cluster
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: support-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      # 2026-10-15: kube-apiserver on macintel01 streams /openapi/v2 (22MB) at
      # ~1.4MB/s; ArgoCD's client-side validation timeout kills the fetch and
      # every sync dies with "failed to download openapi" (see
      # .agents/postmortems/2026-10-15-crossplane-provider-write-storm/PM.md).
      # Validate=false skips the client-side schema download; server-side
      # admission validation still applies.
      - Validate=false
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
  # 2026-10-15: VMRule CRD (upstream victoria-metrics-k8s-stack 0.90.2, chart
  # crds/) sets a schema default `record: ''` on rules. The API server stamps
  # it on every admission (operator status updates re-trigger it), no field
  # manager owns it, and git correctly renders no `record` for alert rules —
  # so all 17 VMRules diff permanently OutOfSync on that one orphaned field
  # and every sync op "succeeds" without ever reaching Synced. Mask the field:
  # git keeps rendering record only for recording rules, and a changed/renamed
  # record on recording rules is no longer flagged as drift (accepted tradeoff —
  # renaming a recording rule breaks its consumers immediately via missing
  # series, so the footgun is loud elsewhere).
  ignoreDifferences:
    - group: operator.victoriametrics.com
      kind: VMRule
      jqPathExpr: '.spec.groups[].rules[].record'
  sources:
    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support-cluster

    - repoURL: https://github.com/yurifrl/home-systems.git
      targetRevision: HEAD
      path: k8s/charts/support
      helm:
        valuesObject:
          virtualServices:
            - name: pyrra
              service:
                name: pyrra
                namespace: monitoring
                port: 9099
            - name: grafana
              service:
                name: vmks-grafana
                namespace: monitoring
                port: 80
            - name: prometheus
              service:
                name: vmsingle-vmks
                namespace: monitoring
                port: 8428
            - name: alertmanager
              service:
                name: vmalertmanager-vmks
                namespace: monitoring
                port: 9093
            - name: vmagent
              service:
                name: vmagent-vmks
                namespace: monitoring
                port: 8429
            - name: longhorn
              service:
                name: longhorn-frontend
                namespace: longhorn-system
                port: 80
