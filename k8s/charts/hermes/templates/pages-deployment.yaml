{{- if .Values.pages.enabled }}
{{- if not .Values.auth.gitLogin.enabled }}
{{- fail "pages.enabled=true requires auth.gitLogin.enabled=true" }}
{{- end }}
{{- $name := include "hermes-agent.pagesName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: pages
spec:
  replicas: {{ .Values.pages.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      annotations:
        rollme: {{ .Values.pages.restartChecksum | default "0" | quote }}
      labels:
        app: {{ $name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        - name: workdir
          emptyDir: {}
        - name: auth
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      initContainers:
        - name: git-login
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["hctl", "auth", "login"]
          env:
            - name: HOME
              value: /auth
          envFrom:
            - secretRef:
                name: {{ include "hermes-agent.secretName" . }}
          volumeMounts:
            - name: auth
              mountPath: /auth
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
        - name: repos-clone
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - hctl
            - repos
            - clone
            - --user={{ .Values.gitRepos.user }}
            - --repos=hermes-pages
            - --branch={{ .Values.gitRepos.branch }}
            - --dest={{ .Values.gitRepos.mountPath }}
          env:
            - name: HOME
              value: /auth
          envFrom:
            - secretRef:
                name: {{ include "hermes-agent.secretName" . }}
          volumeMounts:
            - name: auth
              mountPath: /auth
            - name: workdir
              mountPath: {{ .Values.gitRepos.mountPath }}
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: hermes-pages
          image: {{ .Values.pages.image }}
          command: ["httpd", "-f", "-v", "-p", {{ .Values.pages.port | quote }}, "-h", {{ .Values.pages.root | quote }}]
          ports:
            - name: pages
              containerPort: {{ .Values.pages.port }}
          volumeMounts:
            - name: workdir
              mountPath: {{ .Values.gitRepos.mountPath }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.pages.resources | nindent 12 }}
{{- end }}
