{{- if and .Values.dashboard.enabled (not .Values.dashboard.sidecar) }}
{{- if not .Values.sharedStorage.state.enabled }}
{{- fail "dashboard.enabled=true requires sharedStorage.state.enabled=true" }}
{{- end }}
{{- $name := include "hermes-agent.dashboardName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # No surge: the old pod holds the only schedulable slot on this small
      # cluster, so a surged pod can never schedule and the rollout stalls.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with (.Values.dashboard.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "hermes-agent.workdirColocationAffinity" . | nindent 8 }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "hermes-agent.stateClaimName" . }}
        - name: tmp
          emptyDir: {}
      containers:
        {{- include "hermes-agent.dashboardContainer" (dict "ctx" . "volume" "state") | nindent 8 }}
{{- end }}
