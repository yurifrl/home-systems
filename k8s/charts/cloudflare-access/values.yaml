# PUBLIC, value-free defaults for the global cloudflare-access chart. Real values
# (accountId + the reusable policy definitions, which include email allow-lists)
# live in the PRIVATE home-systems-values overlay (cloudflare-access/values.yaml),
# merged at sync time via $values. Placeholders only here -- this chart renders no
# resources until the private overlay supplies policies.

# Cloudflare account the reusable Access policies belong to.
accountId: "REPLACED_BY_PRIVATE_VALUES"

# Reusable, account-level Access policies to ADOPT (import) into crossplane. Each
# is a pre-existing Cloudflare policy; the MR binds to it via external-name
# (<accountId>/<id>) with deletionPolicy Orphan, and forProvider MUST mirror the
# live policy exactly (name/decision/include) or a reconcile would mutate a policy
# shared by other apps. Shape (real values in the private overlay):
#   - key: <k8s-name>        # metadata.name of the TrustAccessPolicy MR
#     id: <policy-uuid>      # existing Cloudflare Access policy id
#     name: <policy name>    # MUST match the live policy
#     decision: <allow|non_identity|deny|bypass>
#     sessionDuration: 24h
#     include: [ ... ]       # MUST mirror the live policy's include rules
policies: []
