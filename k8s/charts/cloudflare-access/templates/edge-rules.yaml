{{- range .Values.edgeRules }}
{{- $edge := . }}
{{- /* Free plan: 1 rate-limit rule per zone. No rateLimits -> render no
       ratelimit Ruleset at all (an empty-rules entrypoint PUT would evict
       every other rule in the phase). ratelimitExternalName adopts an
       existing phase entrypoint (upjet POST on an existing phase returns
       "already exists" and would otherwise wedge the MR). */ -}}
{{- if .rateLimits }}
---
apiVersion: cloudflare.upjet-cloudflare.upbound.io/v1alpha1
kind: Ruleset
metadata:
  name: {{ .name }}-ratelimit
  {{- if .ratelimitExternalName }}
  annotations:
    crossplane.io/external-name: {{ .ratelimitExternalName | quote }}
  {{- end }}
spec:
  deletionPolicy: {{ .deletionPolicy | default "Delete" }}
  providerConfigRef:
    name: default
  forProvider:
    zoneId: {{ .zoneId | quote }}
    name: {{ printf "%s rate limits" .name | quote }}
    kind: zone
    phase: http_ratelimit
    rules:
    {{- range .rateLimits }}
      - action: block
        enabled: true
        description: {{ .description | quote }}
        expression: {{ .expression | default (printf "(http.host eq %q and starts_with(http.request.uri.path, %q))" $edge.host .pathPrefix) | quote }}
        ratelimit:
          characteristics:
            - ip.src
            - cf.colo.id
          period: {{ .periodSeconds }}
          requestsPerPeriod: {{ .requestsPerPeriod }}
          mitigationTimeout: {{ .mitigationTimeoutSeconds }}
    {{- end }}
{{- end }}
{{- if .country }}
---
apiVersion: cloudflare.upjet-cloudflare.upbound.io/v1alpha1
kind: Ruleset
metadata:
  name: {{ .name }}-firewall
  {{- if .firewallExternalName }}
  annotations:
    crossplane.io/external-name: {{ .firewallExternalName | quote }}
  {{- end }}
spec:
  deletionPolicy: {{ .deletionPolicy | default "Delete" }}
  providerConfigRef:
    name: default
  forProvider:
    zoneId: {{ .zoneId | quote }}
    name: {{ printf "%s firewall" .name | quote }}
    kind: zone
    phase: http_request_firewall_custom
    rules:
      - action: block
        enabled: true
        description: {{ if .subdivision }}{{ printf "allow only %s-%s" .country .subdivision | quote }}{{ else }}{{ printf "allow only %s" .country | quote }}{{ end }}
        expression: {{ if .subdivision }}{{ printf "(http.host eq %q and (ip.geoip.country ne %q or ip.geoip.subdivision_1_iso_code ne %q))" .host .country .subdivision | quote }}{{ else }}{{ printf "(http.host eq %q and ip.geoip.country ne %q)" .host .country | quote }}{{ end }}
      - action: block
        enabled: true
        description: block high threat score
        expression: {{ printf "(http.host eq %q and cf.threat_score gt %v)" .host .threatScoreBlock | quote }}
{{- range .extraFirewallRules }}
      - action: block
        enabled: true
        description: {{ .description | quote }}
        expression: {{ .expression | quote }}
{{- end }}
{{- end }}
{{- end }}
