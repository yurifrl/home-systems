# Vault git sync as an Argo Workflow, replacing the old in-pod polling
# sidecar. Runs in the `obsidian` namespace and mounts the same
# obsidian-config PVC, so it co-locates (podAffinity) with the obsidian pod
# to share the RWO Longhorn volume on whatever node that pod runs. The
# spec-level mutex serializes the cron run against webhook-triggered runs so
# two git operations never race on the same working tree.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: obsidian-vault-sync
  namespace: obsidian
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  entrypoint: main
  synchronization:
    mutex:
      name: obsidian-vault-sync
  ttlStrategy:
    secondsAfterCompletion: 3600
  templates:
    # Run the git sync, then record the list of changed files as an annotation
    # on this Workflow. Downstream consumers (e.g. board-games) watch these
    # annotations and decide for themselves whether a change concerns them —
    # this template stays generic and knows nothing about them.
# NOTE: cluster object is synced by ArgoCD; manual kubectl edits will drift.
    - name: main
      steps:
        - - name: git-sync
            template: git-sync
        - - name: mark
            template: mark
            arguments:
              parameters:
                - name: changed
                  value: "{{steps.git-sync.outputs.parameters.changed}}"

    - name: git-sync
      outputs:
        parameters:
          - name: changed
            valueFrom:
              path: /tmp/changed
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: obsidian
              topologyKey: kubernetes.io/hostname
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: obsidian-config
      container:
        image: alpine/git:latest
        volumeMounts:
          - name: config
            mountPath: /config
        env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: obsidian
                key: GITHUB_TOKEN
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 256Mi
        command: ["sh", "-c"]
        args:
          - |
            set -e
            VAULT=/config/vaults/Obsidian
            git config --global --add safe.directory "$VAULT"
            # Identity must live in repo config, not per-command -c flags:
            # `pull --rebase` internally re-commits replayed history and
            # ignores -c, which killed rebases with "Committer identity
            # unknown" (live 2026-09-06 15:05Z).
            git config --global user.name "obsidian-sync"
            git config --global user.email "obsidian-sync@local"
            if [ ! -d "$VAULT/.git" ]; then
              mkdir -p "$VAULT"
              git clone "https://oauth2:${GITHUB_TOKEN}@github.com/yurifrl/Obsidian.git" "$VAULT"
              # Fresh clone: report every tracked file as "changed".
              git -C "$VAULT" -c core.quotePath=false ls-files | tr '\n' ';' > /tmp/changed
              exit 0
            fi
            # The obsidian-git plugin (which also drives git in this tree)
            # or a killed run can leave a stale index.lock wedging every
            # future run. Remove it only when older than 15 min: a live git
            # operation never holds the lock that long.
            LOCK="$VAULT/.git/index.lock"
            if [ -f "$LOCK" ] && [ -z "$(find "$LOCK" -mmin -15)" ]; then
              echo "removing stale git lock: $LOCK"
              rm -f "$LOCK"
            fi
            # A killed pull --rebase (or the plugin, which leaves
            # conflict-files-obsidian-git.md when ITS rebase dies) leaves
            # .git/rebase-merge behind; every later rebase then aborts with
            # "already a rebase-merge directory". The 5-min cron + Forbid
            # concurrency mean no rebase of OURS can be alive at run start,
            # so recover anything older than ~1 min. `rebase --abort`
            # restores the pre-rebase tip (local auto-commits survive); rm
            # only if git no longer recognizes the leftover.
            for D in rebase-merge rebase-apply; do
              R="$VAULT/.git/$D"
              if [ -d "$R" ] && [ -n "$(find "$R" -mmin +1)" ]; then
                echo "recovering stale rebase state: $R"
                git -C "$VAULT" rebase --abort >/dev/null 2>&1 || rm -fr "$R"
              fi
            done
            # Commit local edits FIRST, then rebase onto the remote. The old
            # pull-first order failed permanently once untracked local files
            # collided with incoming changes (--autostash only covers tracked
            # files), leaving the vault drifted for weeks.
            BEFORE=$(git -C "$VAULT" rev-parse HEAD)
            git -C "$VAULT" add -A
            if ! git -C "$VAULT" diff --cached --quiet; then
              git -C "$VAULT" \
                -c user.name=obsidian-sync \
                -c user.email=obsidian-sync@local \
                commit -m "auto: $(date -Iseconds)"
            fi
            # The tree can be left in detached HEAD (manual checkout, plugin
            # behavior). pull/push both fail forever there, so reattach: point
            # main at the current tip (keeping any auto-commits made while
            # detached) and replay them onto origin/main.
            BRANCH=$(git -C "$VAULT" rev-parse --abbrev-ref HEAD)
            if [ "$BRANCH" = "HEAD" ]; then
              echo "detached HEAD detected; reattaching to origin/main"
              git -C "$VAULT" checkout -B main
              git -C "$VAULT" rebase -X theirs origin/main
            fi
            # -X theirs: on conflict favor the replayed LOCAL commits (the
            # PVC is the working truth; origin is the backup). Without this
            # a single conflicting edit wedged the sync forever.
            git -C "$VAULT" pull --rebase -X theirs --autostash
            git -C "$VAULT" push
            AFTER=$(git -C "$VAULT" rev-parse HEAD)
            printf '%s' "$(echo "$CHANGED" | tr '\n' ';')" > /tmp/changed

    - name: mark
      inputs:
        parameters:
          - name: changed
      resource:
        action: patch
        mergeStrategy: merge
        manifest: |
          apiVersion: argoproj.io/v1alpha1
          kind: Workflow
          metadata:
            name: "{{workflow.name}}"
            annotations:
              changed-files: "{{inputs.parameters.changed}}"
