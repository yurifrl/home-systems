{{- $v := .Values.vms.workstation }}
{{- if and $v.enabled $v.cloudInit.enabled $v.cloudInit.render.enabled }}
{{- $r := $v.cloudInit.render }}
# Materialise the workstation login/join secrets from 1Password into a k8s Secret
# that the render CronJob consumes. Nothing is written to git; the values live only
# in 1Password and (transiently) in this cluster Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $r.secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef: {name: onepassword, kind: ClusterSecretStore}
  target:
    name: {{ $r.secretName }}
  data:
    - secretKey: root-password
      remoteRef: {key: {{ $r.onepasswordItem }}, property: ROOT_PASSWORD}
    - secretKey: yuri-password
      remoteRef: {key: {{ $r.onepasswordItem }}, property: YURI_WORKSTATION_PASSWORD}
    # Durable OAuth client (never expires). The render job exchanges it for a
    # short-lived access token and mints a fresh tagged auth key each run.
    - secretKey: ts-oauth-client-id
      remoteRef: {key: {{ $r.onepasswordItem }}, property: TS_OAUTH_CLIENT_ID}
    - secretKey: ts-oauth-client-secret
      remoteRef: {key: {{ $r.onepasswordItem }}, property: TS_OAUTH_CLIENT_SECRET}
{{- end }}
