{{- $v := .Values.vms.workstation }}
{{- if and $v.enabled $v.cloudInit.enabled }}
{{- $d := .Values.defaults }}
{{- $ci := $v.cloudInit }}
# cloud-init user-data snippet for the workstation VM. Seeds the 1Password
# Service-Account token (box-pulls-own-secrets, design.md §4) and runs the
# on-box bootstrap (files/workstation-bootstrap.sh, baked into the image) which
# self-pulls the Tailscale key, GitHub deploy key, kubeconfig and registry creds.
#
# The token value comes from the workstation-op-sa-token ExternalSecret via the
# PRIVATE values overlay (vms.workstation.cloudInit.opServiceAccountToken).
# NEVER commit a real token to the public chart; empty renders an empty token
# and the bootstrap no-ops until one is supplied.
apiVersion: virtualenvironmentfile.proxmoxbpg.crossplane.io/v1alpha1
kind: EnvironmentFile
metadata:
  name: workstation-cloud-init
  annotations:
    crossplane.io/external-name: {{ $ci.datastoreId }}:snippets/{{ $ci.userDataFileName }}
spec:
  deletionPolicy: {{ .Values.deletionPolicy }}
  providerConfigRef:
    name: {{ .Values.providerConfig.name }}
  forProvider:
    nodeName: {{ $d.nodeName }}
    contentType: snippets
    datastoreId: {{ $ci.datastoreId }}
    sourceRaw:
      - fileName: {{ $ci.userDataFileName }}
        data: |
          #cloud-config
          write_files:
            - path: /etc/workstation/op-token
              permissions: '0600'
              owner: root:root
              content: {{ $ci.opServiceAccountToken | quote }}
          runcmd:
            - [ /bin/sh, -c, "OP_SERVICE_ACCOUNT_TOKEN=$(cat /etc/workstation/op-token) /usr/local/bin/workstation-bootstrap.sh" ]
{{- end }}
