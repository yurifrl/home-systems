{{- $v := .Values.vms.workstation }}
{{- if and $v.enabled $v.cloudInit.enabled }}
{{- $d := .Values.defaults }}
{{- $ci := $v.cloudInit }}
# cloud-init user-data for the workstation VM (push model). Drops the secrets
# the box needs straight onto disk; NixOS does the rest (the tailscale service
# reads /etc/tailscale/authkey and joins as tag:workstation; k3s/docker/pi/herdr
# are declared in the image). No on-box `op`, no seed token.
#
# Values come from the PRIVATE overlay (home-systems-values/proxmox/values.yaml,
# vms.workstation.cloudInit.*), rendered from the 1Password `workstation` item
# via `task proxmox:workstation-seed`. bpg EnvironmentFile has no secretRef, so
# push = rendered cloud-init; keep these in the private overlay only.
apiVersion: virtualenvironmentfile.proxmoxbpg.crossplane.io/v1alpha1
kind: EnvironmentFile
metadata:
  name: workstation-cloud-init
  annotations:
    crossplane.io/external-name: {{ $ci.datastoreId }}:snippets/{{ $ci.userDataFileName }}
spec:
  deletionPolicy: {{ .Values.deletionPolicy }}
  providerConfigRef:
    name: {{ .Values.providerConfig.name }}
  forProvider:
    nodeName: {{ $d.nodeName }}
    contentType: snippets
    datastoreId: {{ $ci.datastoreId }}
    sourceRaw:
      - fileName: {{ $ci.userDataFileName }}
        data: |
          #cloud-config
          write_files:
            - path: /etc/tailscale/authkey
              permissions: '0600'
              owner: root:root
              content: {{ $ci.tailscaleAuthKey | quote }}
          {{- if $ci.kubeconfig }}
            - path: /root/.kube/config
              permissions: '0600'
              owner: root:root
              content: {{ $ci.kubeconfig | quote }}
          {{- end }}
          {{- if $ci.dockerConfigJson }}
            - path: /root/.docker/config.json
              permissions: '0600'
              owner: root:root
              content: {{ $ci.dockerConfigJson | quote }}
          {{- end }}
{{- end }}
