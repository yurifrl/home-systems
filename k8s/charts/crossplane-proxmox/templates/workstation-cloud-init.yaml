{{- $v := .Values.vms.workstation }}
{{- if and $v.enabled $v.cloudInit.enabled }}
{{- $d := .Values.defaults }}
{{- $ci := $v.cloudInit }}
# cloud-init user-data for the workstation VM (push model), rendered IN-CLUSTER.
#
# This EnvironmentFile is a STUB: git owns its structure, NOT its secret-bearing
# `data`. The workstation-cloud-init-render CronJob (workstation-cloud-init-
# render.yaml) reads the `workstation` 1Password item via an ExternalSecret,
# hashes the passwords, and patches .spec.forProvider.sourceRaw[0].data with the
# real cloud-config (Tailscale authkey + chpasswd for root/yuri-workstation).
# ArgoCD ignores that field (applications/crossplane-proxmox.yaml) so the job owns
# it and selfHeal won't revert it. Result: NO secret -- not even a hash -- in git.
apiVersion: virtualenvironmentfile.proxmoxbpg.crossplane.io/v1alpha1
kind: EnvironmentFile
metadata:
  name: {{ $ci.mrName }}
  annotations:
    crossplane.io/external-name: {{ $ci.datastoreId }}:snippets/{{ $ci.userDataFileName }}
spec:
  deletionPolicy: {{ .Values.deletionPolicy }}
  providerConfigRef:
    name: {{ .Values.providerConfig.name }}
  forProvider:
    nodeName: {{ $d.nodeName }}
    contentType: snippets
    datastoreId: {{ $ci.datastoreId }}
    sourceRaw:
      - fileName: {{ $ci.userDataFileName }}
        # Placeholder only; the render CronJob replaces this in-cluster. Kept
        # minimal + valid so the provider can create the snippet before first render.
        data: |
          #cloud-config
          # awaiting in-cluster render (workstation-cloud-init-render CronJob)
{{- end }}
