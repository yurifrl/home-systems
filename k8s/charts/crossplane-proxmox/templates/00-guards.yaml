{{- /*
  Render-time guards (produce no objects; fail the render on an invalid config).
  Enforces the shared-GPU invariant in the template, not in a script: you cannot
  deploy a state where more than one VM claims 0000:01:00.0 at once.
*/ -}}
{{- $t := .Values.vms.talosPc01 }}
{{- $w := .Values.vms.windows }}
{{- $g := .Values.vms.workstationGpu }}
{{- $claimers := list }}
{{- if and $t.enabled $t.started }}{{ $claimers = append $claimers "talos-pc01 (hostpci0)" }}{{ end }}
{{- if and $w.enabled $w.started $w.passthrough }}{{ $claimers = append $claimers "windows (passthrough)" }}{{ end }}
{{- if and $g.enabled $g.started }}{{ $claimers = append $claimers "workstation-gpu (hostpci0)" }}{{ end }}
{{- if gt (len $claimers) 1 }}
{{- fail (printf "GPU conflict: %s are all started. The GPU 0000:01:00.0 can serve only one VM at a time. Set started:false on all but one, or windows.passthrough:false (install variant)." (join ", " $claimers)) }}
{{- end }}
