{{- $v := .Values.vms.talosPc01 }}
{{- if $v.enabled }}
{{- $d := .Values.defaults }}
apiVersion: virtualenvironmentvm.proxmoxbpg.crossplane.io/v1alpha1
kind: EnvironmentVM
metadata:
  name: {{ $v.name }}
  annotations:
    # bpg provider imports/owns a VM by its bare numeric id (it Atoi's this).
    crossplane.io/external-name: {{ $v.vmId | quote }}
    # TEMP 2026-10-15: provider hot-loops per-VM status-write conflicts
    # (~1.5 resourceVersion bumps/s across the 3 VMs -> macintel01 control plane
    # at 100% CPU, API slow). v1.21.0 upgrade did NOT fix it (still upjet
    # v2.2.0; unpause re-tested 2026-10-15, storm reproduced). Unpause once the
    # provider ships past the async-callback conflict bug.
    crossplane.io/paused: "true"
spec:
  deletionPolicy: {{ .Values.deletionPolicy }}
  providerConfigRef:
    name: {{ .Values.providerConfig.name }}
  forProvider:
    nodeName: {{ $d.nodeName }}
    vmId: {{ $v.vmId }}
    name: {{ $v.name }}
    machine: {{ $v.machine }}
    scsiHardware: {{ $v.scsiHardware }}
    onBoot: {{ $v.onBoot }}
    started: {{ if hasKey $v "started" }}{{ $v.started }}{{ else }}{{ .Values.started }}{{ end }}
    bootOrder:
      {{- range $v.bootOrder }}
      - {{ . }}
      {{- end }}
    agent:
      # qemu-guest-agent disabled (2026-09-20): Talos metal image ships no agent
      # extension, and bpg >=0.109 blocks refresh waiting for agent-published
      # network interfaces -> ReconcileError "refresh failed" on every poll.
      - enabled: {{ if hasKey $v "agentEnabled" }}{{ $v.agentEnabled }}{{ else }}true{{ end }}
    operatingSystem:
      - type: {{ $v.osType }}
    cpu:
      - cores: {{ $v.cpu.cores }}
        sockets: {{ $v.cpu.sockets }}
        type: {{ $v.cpu.type | quote }}
    memory:
      - dedicated: {{ $v.memoryMiB }}
        {{- if $v.floatingMiB }}
        floating: {{ $v.floatingMiB }}   # balloon floor: min guaranteed; VM balloons between floating..dedicated
        {{- end }}
    smbios:
      - uuid: {{ $v.smbiosUuid }}
    vga:
      - type: {{ $v.vga }}
    networkDevice:
      - bridge: {{ $d.bridge }}
        model: virtio
        macAddress: {{ $v.netMac }}
        firewall: true
    disk:
      - datastoreId: {{ $d.datastoreId }}
        interface: {{ $v.disk.interface }}
        size: {{ $v.disk.sizeGiB }}
    cdrom:
      - enabled: true
        interface: {{ $v.cdrom.interface }}
        fileId: {{ $v.cdrom.fileId }}
    hostpci:
      {{- range $v.hostpci }}
      - device: {{ .device }}
        id: {{ .id | quote }}
        pcie: {{ .pcie | default false }}
      {{- end }}
{{- end }}
