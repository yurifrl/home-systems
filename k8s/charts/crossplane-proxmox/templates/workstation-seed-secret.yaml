{{- if .Values.workstationSeed.enabled }}
{{- $s := .Values.workstationSeed }}
# box-pulls-own-secrets (design.md §4): the ONE seed secret for the NixOS
# workstation dev VM -- a 1Password Service-Account token. Delivered to the box
# at provision time; the on-box bootstrap (files/workstation-bootstrap.sh) then
# uses `op` + this token to self-pull everything else (Tailscale auth key,
# GitHub deploy key, cluster kubeconfig, registry creds).
#
# Materialised from 1Password via the same "onepassword" ClusterSecretStore
# every other ExternalSecret here uses (vault "kubernetes"). This Secret is the
# material the workstation EnvironmentVM's cloud-init injects as
# OP_SERVICE_ACCOUNT_TOKEN -- wiring it into the VM is the (blocked) VM task;
# here we only materialise it.
#
# Seed-token scope (keep MINIMAL): the 1Password Service Account must be
# read-only and granted access to ONLY the vault holding the workstation items
# (the "kubernetes" vault the onepassword store already reads). Never grant it
# tenant-wide vault access -- one vault, read-only, nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.secretName }}
  namespace: {{ $s.secretNamespace | default .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $s.refreshInterval | default "1h" }}
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ $s.secretName }}
  data:
    - secretKey: {{ $s.secretKey }}
      remoteRef:
        key: {{ $s.onepasswordItem }}
        property: {{ $s.onepasswordProperty }}
{{- end }}
