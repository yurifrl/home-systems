{{- /*
ISO install media as Crossplane managed resources (EnvironmentDownloadFile).
Satisfies the bpg provider's create-time ISO-existence check declaratively.
*/ -}}
{{- $iso := .Values.isos }}
{{- $d := .Values.defaults }}
{{- range $key, $img := (dict "talos" $iso.talos "virtioWin" $iso.virtioWin "win11" $iso.win11) }}
{{- if $img.enabled }}
apiVersion: virtualenvironmentdownloadfile.proxmoxbpg.crossplane.io/v1alpha1
kind: EnvironmentDownloadFile
metadata:
  name: iso-{{ $img.fileName | lower | replace "_" "-" | replace "." "-" }}
  annotations:
    crossplane.io/external-name: {{ $iso.datastoreId }}:iso/{{ $img.fileName }}
spec:
  deletionPolicy: {{ $.Values.deletionPolicy }}
  providerConfigRef:
    name: {{ $.Values.providerConfig.name }}
  forProvider:
    nodeName: {{ $d.nodeName }}
    contentType: iso
    datastoreId: {{ $iso.datastoreId }}
    fileName: {{ $img.fileName }}
    url: {{ $img.url | quote }}
    overwrite: false
    verify: false
---
{{- end }}
{{- end }}
{{- $ws := .Values.vms.workstation }}
{{- if and $ws.enabled $ws.image.url }}
# NixOS workstation boot image (qcow2) pulled onto local:import for VM disk
# import. Published by the nixos CI build-image action to the same GCS bucket as
# gatus/foundry: workstation-<version>.qcow2.bz2 (versioned image; public, AllUsers:R).
# .qcow2.bz2 => decompressed to fileName by the provider (decompressionAlgorithm).
apiVersion: virtualenvironmentdownloadfile.proxmoxbpg.crossplane.io/v1alpha1
kind: EnvironmentDownloadFile
metadata:
  name: import-{{ $ws.image.fileName | lower | replace "_" "-" | replace "." "-" }}
  annotations:
    crossplane.io/external-name: {{ $iso.datastoreId }}:import/{{ $ws.image.fileName }}
spec:
  deletionPolicy: {{ $.Values.deletionPolicy }}
  providerConfigRef:
    name: {{ $.Values.providerConfig.name }}
  forProvider:
    nodeName: {{ $d.nodeName }}
    contentType: import
    datastoreId: {{ $iso.datastoreId }}
    fileName: {{ $ws.image.fileName }}
    url: {{ $ws.image.url | quote }}
    {{- with $ws.image.decompressionAlgorithm }}
    decompressionAlgorithm: {{ . }}
    {{- end }}
    overwrite: false
    verify: false
{{- end }}
