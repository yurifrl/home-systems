# PUBLIC, value-free defaults. Real values live in the PRIVATE home-systems-values
# repo (apps-space/values.yaml), merged at sync time via $values (see
# k8s/applications/apps-space.yaml). Placeholders only here.
#
# This chart is now DNS-ONLY. It manages just the proxied wildcard
# *.syscd.space CNAME -> the syscd-apps cloudflared tunnel. The tunnel
# CONNECTOR runs on the workstation VM itself (nixos modules/workstation/
# cloudflared.nix), next to the apps, dialing localhost -- not in-cluster.
# So there is no cloudflared Deployment / ESO credential here: the cluster
# only owns the DNS, the VM owns the connector and the per-app routing.

# Zone id for syscd.space (real value in the private overlay).
zoneId: "REPLACED_BY_PRIVATE_VALUES"
domain: syscd.space

# The dedicated syscd-apps tunnel the wildcard points at. Adding an app is a
# one-line ingress edit in the VM's cloudflared.nix; the wildcard already
# resolves every *.syscd.space name to this tunnel, so DNS never changes.
tunnelId: "00000000-0000-0000-0000-000000000000"

deletionPolicy: Delete
