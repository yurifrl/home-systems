# Dedicated in-cluster cloudflared for *.syscd.space. Isolated from the main
# nixos-1 tunnel on purpose: this only fronts workstation dev apps, so it can be
# edited/restarted freely without risking any *.syscd.live production service.
#
# Routing: <app>.syscd.space -> http://<workstationHost>:<port> on the workstation
# VM over the LAN (cluster nodes and the VM share L2). protocol: http2 (not QUIC)
# to avoid the edge-unreachable failure mode documented for the main tunnel.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-apps-space
data:
  config.yaml: |
    tunnel: {{ .Values.tunnelId }}
    credentials-file: /creds/credentials.json
    no-autoupdate: true
    protocol: http2
    metrics: 0.0.0.0:2000
    ingress:
    {{- range .Values.apps }}
      - hostname: {{ printf "%s.%s" .name $.Values.domain | quote }}
        service: {{ printf "http://%s:%v" $.Values.workstationHost .port | quote }}
    {{- end }}
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-apps-space
  labels:
    app: cloudflared-apps-space
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-apps-space
  template:
    metadata:
      labels:
        app: cloudflared-apps-space
      annotations:
        # Roll the pod when the ingress list changes.
        checksum/config: {{ .Values.apps | toYaml | sha256sum }}
    spec:
      # cloudflared only makes outbound conns (to the CF edge and to the
      # workstation LAN IP). Default DNS (node resolv.conf), not CoreDNS: routing
      # the edge lookup via cluster DNS over cilium caused tunnel drops for the
      # main tunnel (argotunnel.com i/o timeout).
      dnsPolicy: Default
      containers:
        - name: cloudflared
          image: {{ .Values.image }}
          args: ["tunnel", "--config", "/config/config.yaml", "run"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: creds
              mountPath: /creds
              readOnly: true
          ports:
            - name: metrics
              containerPort: 2000
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: cloudflared-apps-space
        - name: creds
          secret:
            secretName: {{ .Values.tunnelSecret.secretName }}
