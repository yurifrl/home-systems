# Materialise the dedicated apps-tunnel credentials.json from 1Password into a
# k8s Secret that the cloudflared Deployment mounts. In-cluster ESO reads
# 1Password via the onepassword Connect token (no biometric, unlike a laptop op
# CLI), so nothing secret ever lands in git or on the workstation box.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.tunnelSecret.secretName }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: {{ .Values.tunnelSecret.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.tunnelSecret.onepasswordItem }}
