apiVersion: v2
name: apps-space
description: >-
  Wildcard *.syscd.space -> workstation dev VM. A dedicated in-cluster cloudflared
  (isolated from the main nixos-1 SPOF tunnel) proxies <app>.syscd.space to a port
  on the workstation VM, plus the crossplane-managed wildcard DNS record. Add a new
  app = one entry in .Values.apps (private overlay); the wildcard DNS already covers
  every subdomain.
type: application
version: 0.1.0
appVersion: "1.0.0"
