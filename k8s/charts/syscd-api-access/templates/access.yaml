# Cloudflare Access application for api.syscd.live with a BYPASS policy.
#
# The syscd API authenticates every request on its own (Google session cookie +
# AUTH_ALLOWED_EMAILS allowlist; see server/authz.ts in syscd-app). CF Access in
# front of it would 302 every request to an interactive login that a browser
# fetch() from app.syscd.live cannot complete -> the app can never reach the API.
#
# A specific-hostname Access app overrides the broader *.syscd.live wildcard, so
# this bypass/everyone rule lets requests through to the origin, which does the
# real gating. This mirrors the org's existing per-host "Bypass" apps for
# API/socket/webhook endpoints that can't do interactive login.
apiVersion: zero.upjet-cloudflare.upbound.io/v1alpha1
kind: TrustAccessApplication
metadata:
  name: syscd-api
spec:
  deletionPolicy: {{ .Values.deletionPolicy }}
  providerConfigRef:
    name: default
  forProvider:
    accountId: {{ .Values.accountId | quote }}
    name: syscd-api
    domain: {{ .Values.domain | quote }}
    type: self_hosted
    sessionDuration: {{ .Values.sessionDuration | quote }}
    appLauncherVisible: false
    autoRedirectToIdentity: false
    policies:
      - name: bypass
        decision: bypass
        precedence: 1
        include:
          - everyone: {}
