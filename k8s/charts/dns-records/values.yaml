# external-dns ServiceAccounts that use the crd source without crd.create and
# therefore need DNSEndpoint read RBAC granted here (the cloudflare instance
# has crd.create=true and is covered by the bitnami chart already).
dnsEndpointReaders:
  - tailscale-external-dns
  - syscd-dev-external-dns

# Static Cloudflare DNS records, managed by external-dns via DNSEndpoint CRs.
# Migrated from terraform/cloudflare/dns.tf. Not secret -- public on purpose.
#
# Which external-dns instance manages each record is decided by that instance's
# domainFilters (see k8s/applications/external-dns.yaml):
#   - cloudflare instance (proxied) -> syscd.live, syscd.xyz, monaddaydream.com
#   - tailscale instance (not proxied) -> syscd.tech
# The per-record `proxied` below is also set explicitly via annotation.
records:
  - name: up-syscd-tech
    dnsName: up.syscd.tech
    target: digitalocean-nixos-01.tailcecc0.ts.net
    proxied: false
    ttl: 300

  - name: up-syscd-live
    dnsName: up.syscd.live
    target: 3b90d790-0a11-46ae-9421-d195cc828947.cfargotunnel.com
    proxied: true

  - name: wildcard-syscd-xyz
    dnsName: "*.syscd.xyz"
    target: b31e4822-8b42-44fa-b6ca-7feb86a56ec8.cfargotunnel.com
    proxied: true

  - name: yagp-monaddaydream
    dnsName: yagp.monaddaydream.com
    target: b31e4822-8b42-44fa-b6ca-7feb86a56ec8.cfargotunnel.com
    proxied: true

  - name: bg-monaddaydream
    dnsName: bg.monaddaydream.com
    target: b31e4822-8b42-44fa-b6ca-7feb86a56ec8.cfargotunnel.com
    proxied: true

  - name: foundry-syscd-live
    dnsName: foundry.syscd.live
    target: 8bc2858c-a6a4-474f-9287-5af2c1928578.cfargotunnel.com
    proxied: true

  - name: rpg-syscd-live
    dnsName: rpg.syscd.live
    target: 8bc2858c-a6a4-474f-9287-5af2c1928578.cfargotunnel.com
    proxied: true

  - name: obs-syscd-live
    dnsName: obs.syscd.live
    target: 248f4b51-d33d-4896-89c1-acb748c54330.cfargotunnel.com
    proxied: true

  - name: jogosdetabuleirodoyuri-com-br
    dnsName: jogosdetabuleirodoyuri.com.br
    target: b31e4822-8b42-44fa-b6ca-7feb86a56ec8.cfargotunnel.com
    proxied: true

  # dex.syscd.dev / mecatl.syscd.dev: RETIRED. They were unproxied A records
  # to the gateway LB, reachable from the LAN only -- the gap that forced the
  # dex/mecatl move to the CF-fronted *.syscd.live routes. external-dns
  # prunes the A + heritage TXT records on sync (owner match).

  # yurifrl.dev -> GitHub Pages (repo yurifrl/yurifrl.github.io, CNAME file
  # holds "yurifrl.dev"). Published by the syscd-dev external-dns instance
  # (crd-only, unproxied). Must stay DNS-only: GitHub needs to see its own IPs
  # to issue the Let's Encrypt cert. IPs: https://docs.github.com/en/pages/configuring-a-custom-domain-for-your-github-pages-site/managing-a-custom-domain-for-your-github-pages-site
  - name: yurifrl-dev-a
    dnsName: yurifrl.dev
    recordType: A
    targets:
      - 185.199.108.153
      - 185.199.109.153
      - 185.199.110.153
      - 185.199.111.153
    proxied: false
    ttl: 300

  - name: yurifrl-dev-aaaa
    dnsName: yurifrl.dev
    recordType: AAAA
    targets:
      - 2606:50c0:8000::153
      - 2606:50c0:8001::153
      - 2606:50c0:8002::153
      - 2606:50c0:8003::153
    proxied: false
    ttl: 300

  - name: www-yurifrl-dev
    dnsName: www.yurifrl.dev
    target: yurifrl.github.io
    proxied: false
    ttl: 300

  # GitHub Pages domain verification (github.com/settings/pages -> Add a domain).
  # Fill in the challenge name/value GitHub shows, then uncomment.
  # - name: yurifrl-dev-gh-pages-challenge
  #   dnsName: _github-pages-challenge-yurifrl.yurifrl.dev
  #   recordType: TXT
  #   target: "<value-from-github>"
  #   proxied: false
