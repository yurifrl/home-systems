# PUBLIC, value-free defaults. Real values live in the PRIVATE
# home-systems-values repo (herdr-phone/values.yaml), merged at sync time via
# $values (see k8s/applications/herdr-phone.yaml). Placeholders only here.
#
# This chart is now ONLY the Cloudflare Access application protecting
# herdr.syscd.space. Routing + wildcard DNS live in the apps-space chart; herdr
# is one entry in its apps map (name: herdr -> the workstation herdr-phone LAN
# bridge port). The relay on the box (external mode) re-validates this app's JWT.
accountId: "REPLACED_BY_PRIVATE_VALUES"
domain: herdr.syscd.space
sessionDuration: 24h
deletionPolicy: Delete

# Access allow-list (OR logic); real emails come from the private repo.
allowedEmails: []
