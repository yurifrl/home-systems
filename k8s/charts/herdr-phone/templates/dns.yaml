# Proxied CNAME: herdr.syscd.live -> the workstation VM's cloudflared tunnel
# (moved from the Mac; tunnelId = the workstation's own tunnel, set via the
# private overlay). A specific record beats the *.syscd.live wildcard.
apiVersion: dns.upjet-cloudflare.upbound.io/v1alpha1
kind: Record
metadata:
  name: herdr-syscd-live
spec:
  deletionPolicy: {{ .Values.deletionPolicy }}
  providerConfigRef:
    name: default
  forProvider:
    zoneId: {{ .Values.zoneId | quote }}
    name: {{ .Values.domain | quote }}
    type: CNAME
    content: {{ printf "%s.cfargotunnel.com" .Values.tunnelId | quote }}
    proxied: true
    ttl: 1
