# Default values for ax.
# Deploys google/ax: ax-server (direct task executor) and Redis, into the
# Helm release namespace.
# ax-server requires a running agent-substrate (api.ate-system.svc) and its
# podcert cluster trust bundles; deploy agent-substrate first (sync-wave 0).

ax:
  # -- The ax build version. Stamps the server image tag and appVersion
  # expectations. The mirror-ate-images workflow (ko build) pushes exactly
  # this tag; it must exist or pods stay ImagePullBackOff.
  version: "92d297e"

replicas:
  server: 1

# -- Redis for ax-server's streams controller. By default the chart deploys
# its own ax-redis Deployment in the release namespace (requirepass off,
# emptyDir).
# Set local.enabled=false and address to reuse an existing instance -- the
# home talos cluster points ax-server at the shared cluster redis
# (redis.redis.svc.cluster.local:6379, db 0 of the shared index registry).
redis:
  local:
    enabled: true
  # -- Connection string handed to ax-server's --redis-addr. Ignored when
  # local.enabled=true, which pins the bundled instance's in-cluster DNS
  # name instead.
  address: ""

images:
  # -- ko-built image, published to public ghcr by the build-images workflow
  # (there are no upstream ax images; upstream manifests reference
  # ko://github.com/google/ax/cmd/ax-server).
  server:
    repository: ghcr.io/yurifrl/ax/ax-server
    # Built from upstream release tag v0.3.1, digest-pinned: substrate
    # requires actor images pinned by digest (snapshots depend on immutable
    # images).
    tag: "v0.3.1"
  # -- Official upstream redis, not ko-built.
  redis:
    repository: docker.io/library/redis
    tag: "7-alpine"
substrate:
  # -- Control-plane endpoint ax-server connects to (gRPC over TLS).
  endpoint: api.ate-system.svc.cluster.local:443
  # -- TLS server name (SNI/hostname verification) and the ServiceAccount
  # token audience for ax-server's substrate connection.
  authority: api.ate-system.svc
  # -- Path of the cluster trust bundle mounted for verifying the substrate
  # control plane. Served by agent-substrate's podcert servicedns signer.
  caFile: /run/servicedns-ca/trust-bundle.pem

template:
  # -- ActorTemplate ax-server fetches from substrate for each task.
  name: default-template
  # -- Substrate atespace holding task ActorTemplates (a substrate
  # concept, unrelated to the Kubernetes release namespace). Tasks run in
  # the `default` atespace; ax-server reads its model-key Secret from the
  # Kubernetes namespace matching this atespace.
  atespace: default

snapshots:
  # -- REQUIRED. Bucket ax-server records task snapshots into, forwarded to
  # substrate ActorTemplates. On EKS use s3:// (substrate's ategcs parses
  # any scheme and ATE_STORAGE_BACKEND=s3 serves it); a trailing slash keeps
  # name concatenation unambiguous. Render fails when unset because the
  # upstream default (a Google dev gs:// bucket) is meaningless off-GKE.
  bucket: ""

env:
  # -- atenet-router ingress for task sockets.
  atenetRouterAddr: atenet-router.ate-system.svc.cluster.local:80

# -- Model-provider API key, provisioned via External Secrets Operator from
# 1Password. ax-server resolves the K8s Secret `gemini-api-secret` (fixed
# ax contract, not configurable upstream) / key `GEMINI_API_KEY` in the
# task atespace's Kubernetes namespace — NOT the release namespace — and
# injects it into every ActorTemplate it creates for a task. The 1Password
# item must contain a field named GEMINI_API_KEY; by repo convention the
# item name equals the ExternalSecret name (see obs/, hermes/).
externalSecret:
  enabled: true
  # -- ExternalSecret name.
  name: ax-gemini-api-secret
  # -- Upstream 1Password item + field holding the model-provider key.
  # Defaults to the shared `litellm` item (the same item litellm proxies
  # Gemini from) so the key is stored exactly once.
  item: litellm
  property: GEMINI_API_KEY
  secretStore:
    # -- ESO store holding the 1Password provider; ClusterSecretStore in
    # the ESO namespace is the repo-wide default.
    kind: ClusterSecretStore
    name: onepassword
  # -- Namespace of the materialized K8s Secret: the atespace namespace
  # ax-server reads secrets from (the substrate `default` atespace maps to
  # the Kubernetes `default` namespace here).
  namespace: default
  # -- ESO refresh interval for the upstream item.
  refreshInterval: 1h
  target:
    # -- K8s Secret name ax-server reads. Fixed by ax's secret contract
    # (internal/controller/reconciler.go geminiSecretName); change only
    # together with an ax version that renames it.
    name: gemini-api-secret
    creationPolicy: Owner
    deletionPolicy: Retain

# -- ghcr.io/yurifrl/ax/* is public: no pull Secret, no imagePullSecrets.
# registry.* only builds one when a private registry needs it.
registry:
  server: ghcr.io
  username: yurifrl
  password: ""

# -- imagePullSecrets attached to every ax pod spec (kind profile sets
# [{name: ax-registry}]).
imagePullSecrets: []

# -- Pod nodeSelector for all ax workloads. Images are linux/amd64-only
# (ko single-arch builds); the home talos cluster is mixed-arch.
nodeSelector:
  kubernetes.io/arch: amd64
