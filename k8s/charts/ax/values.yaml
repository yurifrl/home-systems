# Default values for ax.
# Deploys google/ax: ax-server (direct executor), ax-redis in ax-system.
# ax-server requires a running agent-substrate (api.ate-system.svc) and its
# podcert cluster trust bundles; deploy agent-substrate first (sync-wave 0).

ax:
  # -- The ax build version. Stamps the server image tag and appVersion
  # expectations. The mirror-ate-images workflow (ko build) pushes exactly
  # this tag; it must exist or pods stay ImagePullBackOff.
  version: "92d297e"

replicas:
  server: 1

images:
  # -- ko-built image, published to public ghcr by the mirror-ate-images
  # workflow (there are no upstream ax images; upstream manifests reference
  # ko://github.com/google/ax/cmd/ax-server).
  server:
    repository: ghcr.io/yurifrl/ax/ax-server
    # 92d297e: main-HEAD ax, built for substrate's v0.4 actor schema (the
    # Redis-streams controller shipped through c5c1ac5 was incompatible with
    # 16ccb13's renamed snapshot_config field). Substrate requires actor
    # images pinned by digest (snapshots depend on immutable images).
    tag: "92d297e@sha256:5734e79fa6277ad19343603c385f003faa245fb05eeef5d0396713ca39758f9a"
  # -- Official upstream redis, not ko-built.
  redis:
    repository: docker.io/library/redis
    tag: "7-alpine"
substrate:
  # -- Control-plane endpoint ax-server connects to (gRPC over TLS).
  endpoint: api.ate-system.svc.cluster.local:443
  # -- TLS server name (SNI/hostname verification) and the ServiceAccount
  # token audience for ax-server's substrate connection.
  authority: api.ate-system.svc
  # -- Path of the cluster trust bundle mounted for verifying the substrate
  # control plane. Served by agent-substrate's podcert servicedns signer.
  caFile: /run/servicedns-ca/trust-bundle.pem

template:
  # -- ActorTemplate ax-server fetches from substrate for each task.
  name: default-template
  atespace: ax-system

snapshots:
  # -- REQUIRED. Bucket ax-server records task snapshots into, forwarded to
  # substrate ActorTemplates. On EKS use s3:// (substrate's ategcs parses
  # any scheme and ATE_STORAGE_BACKEND=s3 serves it); a trailing slash keeps
  # name concatenation unambiguous. Render fails when unset because the
  # upstream default (a Google dev gs:// bucket) is meaningless off-GKE.
  bucket: ""

env:
  # -- atenet-router ingress for task sockets.
  atenetRouterAddr: atenet-router.ate-system.svc.cluster.local:80

# -- ghcr.io/yurifrl/ax/* is public: no pull Secret, no imagePullSecrets.
# registry.* only builds one when a private registry needs it.
registry:
  server: ghcr.io
  username: yurifrl
  password: ""

# -- imagePullSecrets attached to every ax pod spec (kind profile sets
# [{name: ax-registry}]).
imagePullSecrets: []

# -- Pod nodeSelector for all ax workloads. Images are linux/amd64-only
# (ko single-arch builds); the home talos cluster is mixed-arch.
nodeSelector:
  kubernetes.io/arch: amd64
