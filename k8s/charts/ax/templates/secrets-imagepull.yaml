# Pull credentials for nodes that need auth to a private registry (kind has
# no node IAM): a dockerconfigjson Secret in ax-system. Created only when
# registry.password is set (pass a registry token at install time; never
# persist it in values). With the default public ghcr images this is unused.
{{- if .Values.registry.password }}
{{- $auth := b64enc (printf "%s:%s" .Values.registry.username .Values.registry.password) }}
{{- $cfg := dict "auths" (dict .Values.registry.server (dict "auth" $auth)) }}
apiVersion: v1
kind: Secret
metadata:
  name: ax-registry
  namespace: ax-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | toJson | b64enc }}
{{- end }}
