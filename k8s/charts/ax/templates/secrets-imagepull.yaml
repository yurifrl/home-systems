# Private-registry pull credentials for the kind profile: kind nodes have no
# node IAM role, so ECR pulls need a dockerconfigjson Secret in ax-system.
# Created only when registry.password is set (pass a 12h ECR token at install
# time; never persist it in values). EKS ignores all of this: node IAM
# authenticates and imagePullSecrets is [].
{{- if .Values.registry.password }}
{{- $auth := b64enc (printf "%s:%s" .Values.registry.username .Values.registry.password) }}
{{- $cfg := dict "auths" (dict .Values.registry.server (dict "auth" $auth)) }}
apiVersion: v1
kind: Secret
metadata:
  name: ax-registry
  namespace: ax-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | toJson | b64enc }}
{{- end }}
