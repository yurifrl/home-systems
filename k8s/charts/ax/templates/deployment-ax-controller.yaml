apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-controller
  namespace: ax-system
  labels:
    app.kubernetes.io/name: ax-controller
    app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
spec:
  replicas: {{ .Values.replicas.controller }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-controller
        app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
    spec:
      serviceAccountName: ax-controller
      nodeSelector:
        {{- include "ax.nodeSelector" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ .Values.images.controller.repository }}:{{ .Values.images.controller.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - "--redis-addr=ax-redis.ax-system.svc.cluster.local:6379"
            - "--substrate-endpoint={{ .Values.substrate.endpoint }}"
            - "--substrate-authority={{ .Values.substrate.authority }}"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file={{ .Values.substrate.caFile }}"
            - "--template={{ .Values.template.name }}"
            - "--template-atespace={{ .Values.template.atespace }}"
          env:
            - name: ATENET_ROUTER_ADDR
              value: {{ .Values.env.atenetRouterAddr | quote }}
            - name: AX_SNAPSHOTS_BUCKET
              value: {{ required "snapshots.bucket must be set (s3://bucket/prefix/ on EKS)" .Values.snapshots.bucket | quote }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
      volumes:
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.substrate.authority }}
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
