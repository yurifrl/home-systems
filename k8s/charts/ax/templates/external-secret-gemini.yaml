# Model-provider API key for ax-server's per-task ActorTemplate injection.
# ax-server resolves the secret `gemini-api-secret` / key `GEMINI_API_KEY`
# (fixed contract, internal/controller/reconciler.go) in the task atespace's
# Kubernetes namespace and injects it into every ActorTemplate env. The
# atespace namespace is NOT the release namespace, so it is a value here.
# The upstream 1Password item carries one field named GEMINI_API_KEY.
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.name | required "externalSecret.name is required" }}
  namespace: {{ .Values.externalSecret.namespace | required "externalSecret.namespace is required (the atespace namespace ax reads secrets from)" }}
  labels:
    app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStore.kind }}
    name: {{ .Values.externalSecret.secretStore.name | required "externalSecret.secretStore.name is required" }}
  target:
    name: {{ .Values.externalSecret.target.name | required "externalSecret.target.name is required (gemini-api-secret unless ax's secret contract changes)" }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy }}
    deletionPolicy: {{ .Values.externalSecret.target.deletionPolicy }}
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.name | quote }}
{{- end }}
