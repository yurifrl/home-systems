apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
spec:
  replicas: {{ .Values.replicas.server }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-server
        app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
    spec:
      # ax-server executes tasks directly (the Redis-streams controller was
      # removed upstream): it talks to Substrate to create ActorTemplates and
      # actors, so it carries the same substrate identity as the old
      # ax-controller — SA audience token for the ate API, servicedns CA, and
      # the snapshot bucket for golden snapshots.
      serviceAccountName: ax-server
      nodeSelector:
        {{- include "ax.nodeSelector" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ax-server
          image: {{ .Values.images.server.repository }}:{{ .Values.images.server.tag }}
          imagePullPolicy: IfNotPresent
          args:
            - "--addr=:8080"
            {{- if .Values.redis.local.enabled }}
            - "--redis-addr=ax-redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
            {{- else }}
            - "--redis-addr={{ required "redis.address must be set when redis.local.enabled=false" .Values.redis.address }}"
            {{- end }}
            - "--substrate-endpoint={{ .Values.substrate.endpoint }}"
            - "--substrate-authority={{ .Values.substrate.authority }}"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file={{ .Values.substrate.caFile }}"
            - "--template={{ .Values.template.name }}"
            - "--template-atespace={{ .Values.template.atespace }}"
          env:
            - name: ATENET_ROUTER_ADDR
              value: {{ .Values.env.atenetRouterAddr | quote }}
            - name: AX_SNAPSHOTS_BUCKET
              value: {{ required "snapshots.bucket must be set (s3://bucket/prefix/ on EKS)" .Values.snapshots.bucket | quote }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
      volumes:
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.substrate.authority }}
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
---
apiVersion: v1
kind: Service
metadata:
  name: ax-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: {{ include "ax.partOf" . }}
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: ax-server
