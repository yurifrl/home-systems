suite: ax
templates:
  - external-secret-gemini.yaml
tests:
  - it: renders the ExternalSecret into the atespace namespace with the fixed target name
    release:
      namespace: ax-system
    set:
      snapshots.bucket: s3://ate-snapshots/ax-env/
    asserts:
      - equal:
          path: metadata.name
          value: ax-gemini-api-secret
      - equal:
          path: metadata.namespace
          value: default
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.secretStoreRef.name
          value: onepassword
      - equal:
          path: spec.target.name
          value: gemini-api-secret
      - equal:
          path: spec.target.creationPolicy
          value: Owner
      - equal:
          path: spec.data[0].secretKey
          value: GEMINI_API_KEY
      - equal:
          path: spec.data[0].remoteRef.key
          value: litellm
      - equal:
          path: spec.data[0].remoteRef.property
          value: GEMINI_API_KEY
  - it: honors overrides for store, item and target
    release:
      namespace: ax-system
    set:
      snapshots.bucket: s3://ate-snapshots/ax-env/
      externalSecret.name: custom-ax-key
      externalSecret.namespace: default
      externalSecret.item: my-providers
      externalSecret.property: GEMINI_KEY
      externalSecret.secretStore.name: vault
      externalSecret.secretStore.kind: SecretStore
      externalSecret.target.name: my-gemini
    asserts:
      - equal:
          path: metadata.name
          value: custom-ax-key
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
      - equal:
          path: spec.secretStoreRef.name
          value: vault
      - equal:
          path: spec.target.name
          value: my-gemini
      - equal:
          path: spec.data[0].remoteRef.key
          value: my-providers
      - equal:
          path: spec.data[0].remoteRef.property
          value: GEMINI_KEY
  - it: renders nothing when externalSecret is disabled
    set:
      snapshots.bucket: s3://ate-snapshots/ax-env/
      externalSecret.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: fails closed when the ExternalSecret is enabled without a name
    set:
      snapshots.bucket: s3://ate-snapshots/ax-env/
      externalSecret.name: ""
    asserts:
      - failedTemplate:
          errorPattern: "externalSecret.name is required"
  - it: fails closed when the upstream 1Password item is not set
    set:
      snapshots.bucket: s3://ate-snapshots/ax-env/
      externalSecret.item: ""
    asserts:
      - failedTemplate:
          errorPattern: "externalSecret.item is required"
