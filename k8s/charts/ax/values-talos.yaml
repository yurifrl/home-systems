# home talos-default profile. ko-built images mirrored to public
# ghcr.io/yurifrl/ax/*; redis is the official upstream image. No pull secret.
# Everything stays on amd64 (ko single-arch builds) via the chart's default
# nodeSelector.

images:
  server:
    repository: ghcr.io/yurifrl/ax/ax-server
  redis:
    repository: docker.io/library/redis

# Shared cluster redis (ns redis, db 0 of the index registry in
# k8s/applications/redis.yaml) instead of a bundled ax-redis Deployment.
redis:
  local:
    enabled: false
  address: redis.redis.svc.cluster.local:6379

snapshots:
  # rustfs (agent-substrate) hosts the bucket; ateom workers read/write
  # snapshots with its static credentials.
  bucket: "s3://ate-snapshots/"

# Public images: no registry Secret.
registry:
  password: ""
imagePullSecrets: []
