{{- range .Values.deployments | default (list) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace | default .namespace }}
spec:
  replicas: {{ .replicas | default 1 }}
  {{- with .strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
      {{- if or .podAnnotations .rollOnConfigChange }}
      annotations:
        {{- with .podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .rollOnConfigChange }}
        checksum/config: {{ $.Values.configMaps | default (list) | toYaml | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      nodeSelector: {{ toYaml .nodeSelector | nindent 8 }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes: {{ toYaml .volumes | nindent 8 }}
      hostAliases: {{ toYaml .hostAliases | nindent 8 }}
      {{- with .securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      {{- if .containers }}
        {{- toYaml .containers | nindent 8 }}
      {{- else }}
        - name: {{ .name }}
          {{- /* Flat `imageTags` map (from a values FILE source, e.g. ArgoCD
             $values) pins per-Deployment tags: Helm deep-merges maps across
             value sources but REPLACES lists, so the pin file must be a map
             keyed by Deployment name. Absent map or key → the declared tag
             (usually `latest`). */ -}}
          {{- $tag := .image.tag }}
          {{- $tags := $.Values.imageTags | default (dict) }}
          {{- if hasKey $tags .name }}
            {{- $tag = index $tags .name }}
          {{- end }}
          image: "{{ .image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ .image.pullPolicy | default "Always" }}
          {{- if .containerPort }}
          ports:
            - name: http
              containerPort: {{ .containerPort }}
              protocol: TCP
          {{- end }}
          livenessProbe: {{ toYaml .livenessProbe | nindent 12 }}
          readinessProbe: {{ toYaml .readinessProbe | nindent 12 }}
          env: {{ toYaml .env | nindent 12 }}
          envFrom: {{ toYaml .envFrom | nindent 12 }}
          volumeMounts: {{ toYaml .volumeMounts | nindent 12 }}
          resources: {{ toYaml .resources | nindent 12 }}
      {{- end }}
{{- end }}