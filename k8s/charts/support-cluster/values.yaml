# Global monitoring stack provider: "victoriametrics" or "prometheus-operator"
# This determines whether VMServiceScrape (VictoriaMetrics) or ServiceMonitor (Prometheus Operator) resources are used
monitoringProvider: victoriametrics

# Global, account-level Cloudflare Access policies (reusable, shared across apps).
# Disabled here; the PRIVATE overlay ($values/support-cluster/values.yaml) turns
# it on and supplies accountId + the real policy definitions (which include email
# allow-lists -- never committed to this public chart). Each policy is an EXISTING
# reusable policy ADOPTED via external-name; forProvider must mirror the live one.
cloudflareAccess:
  enabled: false
  accountId: "REPLACED_BY_PRIVATE_VALUES"
  # Shape (real values in the private overlay):
  #   - key: <k8s-name>       # metadata.name of the TrustAccessPolicy MR
  #     id: <policy-uuid>     # existing Cloudflare Access policy id
  #     name: <policy name>   # MUST match the live policy
  #     decision: <allow|non_identity|deny|bypass>
  #     sessionDuration: 24h
  #     include: [ ... ]      # MUST mirror the live policy's include rules
  policies: []

# Feature flags for enabling different components
features:
  serviceLevelObjectives: false 
  prometheusRules: false
  alertmanager: true
  tailscale: true
  defaultServiceAccountWithImagePullSecret: true
  defaultLimitRange: true
  # In-cluster GCP billing exporter (Pub/Sub -> Prometheus gauge). Pairs with the
  # crossplane-gcp `billing` block that creates the budgets/topic/subscription.
  billingExporter: true

# In-cluster GCP billing exporter config (requires features.billingExporter).
billingExporter:
  image: ghcr.io/yurifrl/billing-exporter:latest
  gcpProject: syscd-443112
  subscription: billing-budget-alerts-exporter
  # k8s Secret (from crossplane serviceAccountKeys) holding the GCP SA key JSON.
  # The upbound ServiceAccountKey connection secret exposes the JSON under
  # `private_key` (not `creds`).
  credentialsSecret: billing-exporter-gcs-key
  credentialsKey: private_key
  # Alert when spend crosses this fraction of a budget's limit.
  alertThreshold: 0.9
  # Weekly Discord spend summary (Mondays 12:00 UTC ~ 09:00 BRT).
  weeklySchedule: "0 12 * * 1"

# Namespaces to create default ServiceAccount with image pull secret
# Requires features.defaultServiceAccountWithImagePullSecret: true
serviceAccountsWithImagePullSecret: []
  # - namespace: my-namespace

# Default requests/limits for containers that don't set their own (one
# LimitRange per listed namespace). Requests stop the scheduler from
# overcommitting nodes; the limit caps runaway pods. Heavy apps should still
# set their own resources — LimitRange only fills the gaps, it never overrides.
# Requires features.defaultLimitRange: true
limitRanges:
  default:            # ceiling if a container sets no limit (generous, to avoid OOMing heavy apps)
    memory: 1Gi
  defaultRequest:     # reserved for scheduling if a container sets no request
    # 50m/128Mi = the common VPA target across the app fleet (2026-07-02 metrics)
    cpu: 50m
    memory: 128Mi
  # App namespaces only. Infra/system namespaces (kube-system, longhorn-system,
  # monitoring, cnpg-system, databases, supabase, istio-system, crossplane-system,
  # etc.) are omitted — their pods need bespoke sizing.
  namespaces:
    - agents
    - bind9
    - board-games
    - camofox
    - cloudflare-tunnel
    - dolt
    - edge
    - external-dns
    - gha-runner
    - hermes
    - home-assistant
    - litellm
    - mosquitto
    - obs
    - obsidian
    - ourtube
    - syscd-app
    - zigbee2mqtt


# Disable NIC TX checksum offload on Proxmox/virtio VM nodes where it corrupts
# VXLAN-encapsulated TCP/UDP (cross-node pod traffic silently dropped; ICMP
# survives, node looks healthy). Confirmed root cause on pc01 2026-07-05. The
# setting reverts on reboot/link-reset, so a DaemonSet re-applies it in a loop.
# nodeSelector scopes it to affected nodes only (offload-off costs throughput on
# nodes that don't need it). Add more Proxmox/UTM virtio nodes here as needed.
nicOffloadFix:
  enabled: true
  image: nicolaka/netshoot:v0.16
  reapplySeconds: 60
  nodeSelector:
    kubernetes.io/hostname: pc01

# node-reaper: when a worker dies hard it stays NotReady forever and its pods
# hang in Terminating (StatefulSets never self-heal). This CronJob applies the
# native `node.kubernetes.io/out-of-service:NoExecute` taint to any worker that
# has been NotReady longer than notReadySeconds, which force-reschedules its
# pods onto healthy nodes, then removes the taint once the node is Ready again.
# It never reboots or deletes the node. No BMC fencing exists on this hardware,
# so it trusts the Ready condition + timeout (a partitioned-but-alive node looks
# the same as a dead one — the timeout is the only mitigation). image needs
# kubectl + jq (alpine/k8s bundles both).
nodeReaper:
  enabled: true
  image: alpine/k8s:1.36.2
  schedule: "*/5 * * * *"
  notReadySeconds: 900

# Tailscale
tailscale:
  connectors:
    - hostname: tailscale-1
      advertiseRoutes:
        - 10.244.0.0/16
        - 192.168.50.0/24
        - 10.0.0.0/16
        - 10.1.0.0/16
        - 10.69.0.0/16