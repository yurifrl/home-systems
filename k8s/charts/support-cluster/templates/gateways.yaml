# Argo tunnel domain
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: cloudflare
  namespace: istio-system
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "*.syscd.live"
    external-dns.alpha.kubernetes.io/target: "b31e4822-8b42-44fa-b6ca-7feb86a56ec8.cfargotunnel.com"
spec:
  selector:
    istio: gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.syscd.live"
        - "*.syscd.xyz"
        - "*.monaddaydream.com"
        - "jogosdetabuleirodoyuri.com.br"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "*.syscd.live"
        - "*.syscd.xyz"
        - "*.monaddaydream.com"
      tls:
        mode: SIMPLE
        credentialName: gateway-public-tls
---
# Tailscale domain
# https://medium.com/@mattiaforc/zero-trust-kubernetes-ingress-with-tailscale-operator-cert-manager-and-external-dns-8f42272f8647
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: tailscale
  namespace: istio-system
  # DNS for *.syscd.tech is published by external-dns (service source) from the
  # istio-system/istio-gateway Service annotations (public A -> LB IP), not here.
spec:
  selector:
    istio: gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.syscd.tech"
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "*.syscd.tech"
      tls:
        mode: SIMPLE
        credentialName: syscd-tls
    # Plaintext h2c listener for the ax CLI: it dials insecure gRPC and strips
    # https:// (github.com/google/ax cmd/ax/main.go getAXClient), so TLS
    # termination breaks its HTTP/2 preface. Scoped to exactly ax.syscd.tech —
    # the ax-server API is unauthenticated and must not sit on *.syscd.tech.
    # Use: export AX_SERVER=http://ax.syscd.tech:18080
    - port:
        number: 18080
        name: http2-plain
        protocol: HTTP2
      hosts:
        - "ax.syscd.tech"
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: dev
  namespace: istio-system
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "*.syscd.dev"
spec:
  selector:
    istio: gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.syscd.dev"
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "*.syscd.dev"
      tls:
        mode: SIMPLE
        credentialName: syscd-tls