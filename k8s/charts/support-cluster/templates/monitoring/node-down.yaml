# Node-down alert — fires when a Kubernetes node has been NotReady for >5m.
# Complements crashloop and pod-readiness alerts: those catch pods failing on a
# healthy node; this catches the node itself dying (hardware, network partition,
# kubelet hang). A node going NotReady on a Talos cluster almost always means
# the machine needs physical attention.
#
# Uses kube_node_status_condition from kube-state-metrics (bundled with vmks).
# Evaluated by VMAlert (selectAllByDefault); severity=critical routes to Discord
# via the VMAlertmanagerConfig in this chart.
#
# NOTE: if kube-state-metrics itself stops exporting (pod down, liveness
# restart-loop, cross-site node can't reach the apiserver), both alerts below
# go silent — max_over_time(...)==0 matches nothing when the series is absent.
# KubeNodeMetricsAbsent covers that blind spot (2026-10-12→14 pc01 gap:
# KSM restart-looping on rpi01 made node alerts dead for 3 days). The watchdog
# (victoriametrics-watchdog.yaml) only covers vmsingle/vmagent, NOT KSM.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: node-down-rules
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: node.rules
      rules:
        - alert: KubeNodeNotReady
          expr: |
            max by (node) (
              max_over_time(kube_node_status_condition{condition="Ready",status="true"}[10m])
            ) == 0
          for: 5m
          labels:
            severity: critical
            environment: production
            service: node-health
          annotations:
            summary: "Node {{ `{{ $labels.node }}` }} is NotReady"
            description: "Node {{ `{{ $labels.node }}` }} has been NotReady for >5m. The node may have crashed, lost network, or the kubelet is hung. Check physical hardware and network connectivity."

        - alert: KubeNodeUnreachable
          expr: |
            max by (node) (
              max_over_time(kube_node_status_condition{condition="Ready",status="unknown"}[10m])
            ) == 1
          labels:
            severity: critical
            environment: production
            service: node-health
          annotations:
            summary: "Node {{ `{{ $labels.node }}` }} is Unreachable"
            description: "Node {{ `{{ $labels.node }}` }} has been Unreachable for >5m. The node-controller has stopped receiving heartbeats — likely a network partition or kubelet crash."

        # tk-pqp synthetic-fire test 2026-10-15: selector never matches (no
        # series carries tk_pqp_synthetic), so absent()=1 immediately — the
        # alert exercises its real for:10m wait and delivery path. REVERTED in
        # the next commit after fire+delivery evidence.
        - alert: KubeNodeMetricsAbsent
          expr: absent(kube_node_info{tk_pqp_synthetic="2026-10-15"})
          for: 10m
          labels:
            severity: critical
            environment: production
            service: node-health
          annotations:
            summary: "Node inventory absent — kube-state-metrics is not exporting node conditions"
            description: "No kube_node_status_condition samples for 10m: kube-state-metrics is down or not exporting. KubeNodeNotReady and KubeNodeUnreachable are blind until this clears. This was the 2026-10-12→14 gap (KSM restart-looping on rpi01) that left the pc01 wedge invisible to node alerts."
