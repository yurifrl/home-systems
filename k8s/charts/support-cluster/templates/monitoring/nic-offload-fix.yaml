# Guards the durable fix for the pc01 virtio VXLAN TX checksum-offload incident.
# If the nic-offload-fix DaemonSet stops running on a targeted node, that node
# will corrupt cross-node pod traffic again on its next reboot (offloads default
# back on). This is the residual detection gap — the raw datapath fault produced
# ZERO Hubble/BPF drops (kernel-level), so it can't be paged on directly.
# Runbook: .agents/postmortems/2026-07-05-pc01-vxlan-tx-checksum-offload/PM.md
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: nic-offload-fix-rules
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: nic-offload-fix.rules
      rules:
        - alert: NicOffloadFixNotRunning
          expr: |
            # Suppressed while any node is NotReady: when a node is down, the
            # KubeNodeNotReady alert is the actionable signal, and the DS pods
            # on it count as unavailable — that paging is pure fallout. The
            # tradeoff is a real DS regression on an UP node stays silent until
            # every node is Ready again.
            # The unless-clause is a value-filtered count of NotReady nodes:
            # kube-state-metrics emits one Ready series per node and `== 0`
            # keeps only nodes whose Ready series reads 0. A bare
            # status!="true" label filter is WRONG here: it matches series
            # existence, and KSM emits true/false/unknown per condition over
            # two scrape paths — 14-28 non-true series even when every node is
            # healthy — so that form suppresses invariantly and the alert is
            # dead (this exact bug shipped once; do not "simplify" it back).
            # on() is also load-bearing: count() returns a zero-label vector
            # and unless matches on exact label sets, so a plain
            # `unless count(...)` never suppresses anything.
            kube_daemonset_status_number_unavailable{daemonset="nic-offload-fix", namespace="support-cluster"} > 0
            unless on() count(kube_node_status_condition{condition="Ready",status="true"} == 0) > 0
          for: 15m
          labels:
            severity: critical
            environment: production
            service: nic-offload-fix
          annotations:
            summary: "nic-offload-fix DaemonSet not running on a targeted node"
            description: "The nic-offload-fix DaemonSet is unavailable on {{ `{{ $value }}` }} node(s). Those Proxmox/virtio VM nodes will corrupt cross-node pod traffic (VXLAN TX checksum offload) on their next reboot. Check `ethtool -k <iface> | grep tx-checksum-ip-generic` on the node. Runbook: .agents/postmortems/2026-07-05-pc01-vxlan-tx-checksum-offload/PM.md"
