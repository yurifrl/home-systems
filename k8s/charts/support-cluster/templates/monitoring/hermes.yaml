# Hermes-down alert. The hermes agent runs as the single StatefulSet pod
# hermes-0. Fire when the StatefulSet has zero ready replicas for >10m —
# one signal that catches the whole failure class: stuck Init on an
# unmountable RWO volume (the 35h outage on 2026-08-04), CrashLoopBackOff,
# or unschedulable. max() collapses KSM's duplicate scrape series (both the
# kube-state-metrics and kubernetes-services-annotations jobs export it) into
# a single alert.
#
# Depends on kube-state-metrics. severity=critical + environment=production
# routes to Discord via the VMAlertmanagerConfig in this chart.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: hermes-rules
  namespace: monitoring
  labels:
    prometheus: k8s
    role: alert-rules
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: hermes.rules
      rules:
        - alert: HermesDown
          expr: max(kube_statefulset_status_replicas_ready{namespace="hermes",statefulset="hermes"}) < 1
          for: 10m
          labels:
            severity: critical
            environment: production
            service: hermes
          annotations:
            summary: "Hermes is down"
            description: "The hermes StatefulSet (namespace hermes) has had zero ready replicas for >10m. hermes-0 is not Running — stuck Init on a volume mount, CrashLoopBackOff, or unschedulable."
