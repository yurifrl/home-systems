# https://docs.victoriametrics.com/operator/resources/vmalertmanagerconfig
# VMAlertmanager (k8s/applications/victoria-metrics-k8s-stack.yaml) selects this
# CR via selectAllByDefault and merges it into the generated alertmanager config.
# Namespace matching is disabled on the VMAlertmanager so alerts from any
# namespace can route here.
{{- if .Values.features.alertmanager }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    role: alert-rules
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  route:
    receiver: discord
    group_by:
      - alertname
      - severity
      - slo
      - environment
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
    routes:
      - receiver: discord
        matchers:
          - 'severity="critical"'
          - 'environment="production"'
        continue: false
      # 2026-10-15 (tk-fah): warning alerts previously delivered only via this
      # route's fallback receiver (implicit); disk.yaml/longhorn-backup.yaml
      # fire severity=warning and deserve an explicit matcher. Without the
      # explicit route a future catch-all sibling config could silently reroute
      # warnings to blackhole.
      - receiver: discord
        matchers:
          - 'severity="warning"'
          - 'environment="production"'
        continue: false
  inhibit_rules:
    # A node that goes Unreachable (kubelet heartbeats lost) almost always also
    # turns NotReady — page the NotReady alert, not both. Field shape verified
    # against the live CRD (vmalertmanagerconfigs.operator.victoriametrics.com
    # v1beta1): spec.inhibit_rules[].source_matchers/target_matchers/equal.
    - source_matchers:
        - 'alertname="KubeNodeNotReady"'
      target_matchers:
        - 'alertname="KubeNodeUnreachable"'
      equal:
        - node
  receivers:
    - name: discord
      discord_configs:
        - webhook_url_secret:
            name: alertmanager-discord
            key: webhook-url
          title: "{{`{{ .CommonLabels.alertname }}`}}"
          message: |
            {{`{{ range .Alerts }}`}}{{`{{ .Annotations.summary }}`}}{{`{{ if .Annotations.description }}`}} — {{`{{ .Annotations.description }}`}}{{`{{ end }}`}}
            {{`{{ end }}`}}
          send_resolved: true
    - name: "null"
{{- end }}
