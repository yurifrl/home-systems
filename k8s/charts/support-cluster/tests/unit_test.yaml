suite: test support-cluster chart
templates:
  - tailscale/connector.yaml
  - monitoring/cloudflare-tunnel.yaml
  - monitoring/victoriametrics-watchdog.yaml
  - monitoring/nic-offload-fix.yaml
  - monitoring/zigbee2mqtt.yaml
  - alertmanagerconfig.yaml
tests:
  - it: should render connector correctly
    template: tailscale/connector.yaml
    values:
      - ../test.yaml
    asserts:
      - isKind:
          of: Connector
      - equal:
          path: spec.hostname
          value: tailscale-1
      - equal:
          path: spec.subnetRouter.advertiseRoutes[0]
          value: "10.244.0.0/16"
      - contains:
          path: spec.tags
          content: tag:k8s

  - it: should not treat missing Cloudflare metrics as a tunnel outage
    template: monitoring/cloudflare-tunnel.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: spec.groups[0].rules[0].expr
          value: sum(cloudflared_tunnel_ha_connections) == 0

  - it: should render the independent VictoriaMetrics watchdog as a looping Deployment
    template: monitoring/victoriametrics-watchdog.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "sleep 60"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "vmalertmanager-vmks:9093/api/v2/alerts"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'vm_free_disk_space_bytes/'

  - it: should suppress NicOffloadFixNotRunning while any node is NotReady
    template: monitoring/nic-offload-fix.yaml
    asserts:
      - isKind:
          of: VMRule
      - matchRegex:
          path: spec.groups[0].rules[0].expr
          pattern: 'unless on\(\) count\(kube_node_status_condition\{condition="Ready",status="true"\} == 0\) > 0'
      - equal:
          path: spec.groups[0].rules[0].for
          value: 15m

  - it: should page only on sustained Zigbee2MQTT outages
    template: monitoring/zigbee2mqtt.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: VMRule
      - equal:
          path: spec.groups[0].rules[0].for
          value: 15m

  - it: should inhibit KubeNodeUnreachable when KubeNodeNotReady fires for the same node
    template: alertmanagerconfig.yaml
    values:
      - ../test.yaml
    asserts:
      - isKind:
          of: VMAlertmanagerConfig
      - equal:
          path: spec.inhibit_rules[0].source_matchers
          value:
            - 'alertname="KubeNodeNotReady"'
      - equal:
          path: spec.inhibit_rules[0].target_matchers
          value:
            - 'alertname="KubeNodeUnreachable"'
      - equal:
          path: spec.inhibit_rules[0].equal
          value:
            - node
