# Pin provider runtime pods to a CPU arch via a shared DeploymentRuntimeConfig.
# Several community images (e.g. wildbitca cloudflare) are amd64-only and
# ImagePullBackOff on the lone arm64 node; every Provider below references this.
runtimeConfigName: amd64-only
runtimeArch: amd64

# Dedicated runtime config for providers that need a stable API path. Point them
# directly at the control-plane apiserver (bypass the kube-proxy Service VIP) but
# let them float across healthy amd64 workers -- NOT pinned to one node, so a
# single node failure can't take the conversion webhook down and jam every app.
pinnedRuntimeConfig:
  name: gcp-storage-pinned
  apiserverHost: "192.168.68.91"
  apiserverPort: "6443"

# Crossplane provider packages to install (Crossplane v2.3.3; cluster-scoped MRs).
providers:
  - name: provider-gcp-storage
    package: xpkg.upbound.io/upbound/provider-gcp-storage:v2.5.4
    # A missing conversion webhook stalls every ArgoCD application.
    runtimeConfig: gcp-storage-pinned
  - name: provider-gcp-cloudplatform
    package: xpkg.upbound.io/upbound/provider-gcp-cloudplatform:v2.5.4
  - name: provider-gcp-iam
    package: xpkg.upbound.io/upbound/provider-gcp-iam:v2.5.4
    # Conversion webhook (v1beta1<->v1beta2 WorkloadIdentityPoolProvider) must be
    # served for the crossplane-gcp app to sync. A fresh pod can't bootstrap its
    # manager through the kube-proxy VIP in this stretched cluster, so it never
    # registers /convert. Pin to the direct-apiserver path like storage.
    runtimeConfig: gcp-storage-pinned
  # Compute provider for the assets CDN (LB + Cloud CDN + Cloud Armor). Its MRDs
  # install INACTIVE (default MRAP no longer activates '*'); only the ~8 CRDs in
  # the computeCdnActivations MRAP below become CRDs, avoiding the apiserver
  # overload that forced this provider's earlier removal. Unpinned — runs on any
  # healthy worker.
  - name: provider-gcp-compute
    package: xpkg.upbound.io/upbound/provider-gcp-compute:v2.5.4
  # Cloudflare DNS + Rulesets (WAF/rate-limit/geo) for the assets CDN, so the
  # DNS record + rate-limit/geo rules reconcile from git once the API token is
  # present. Same wildbitca family as provider-cloudflare-zero. MRD-scoped by
  # the cloudflare-cdn MRAP so only Record + Ruleset CRDs activate.
  - name: provider-cloudflare-dns
    package: xpkg.upbound.io/wildbitca/provider-cloudflare-dns:v0.2.6
  - name: provider-cloudflare-cloudflare
    package: xpkg.upbound.io/wildbitca/provider-cloudflare-cloudflare:v0.2.6
  # Proxmox VE provider (Upjet-generated wrapper around bpg/terraform-provider-proxmox).
  # Community provider; manages QEMU VMs as cluster-scoped managed resources
  # (group virtualenvironmentvm.proxmoxbpg.crossplane.io). Used by the
  # crossplane-proxmox chart to replicate the proxmox/ VM configs.
  - name: provider-proxmox-bpg
    package: xpkg.upbound.io/valkiriaaquaticamendi/provider-proxmox-bpg:v1.15.0
  # Cloudflare Zero Trust (Upjet, Cloudflare TF v5). Consumed by a private app
  # to manage Access App + Service Token + Policy.
  - name: provider-cloudflare-zero
    package: xpkg.upbound.io/wildbitca/provider-cloudflare-zero:v0.2.6
  # --- Billing spend system (budgets -> Pub/Sub -> Cloud Function -> Discord) ---
  # NOTE: the upbound GCP provider has NO native Budget resource (google_billing_budget
  # is unmapped in provider-upjet-gcp v2.5.x). Budgets are created out-of-band /
  # via provider-terraform (TBD). The topic/functions/secretmanager below ARE native.
  - name: provider-gcp-pubsub
    package: xpkg.upbound.io/upbound/provider-gcp-pubsub:v2.5.4
  - name: provider-gcp-cloudfunctions2
    package: xpkg.upbound.io/upbound/provider-gcp-cloudfunctions2:v2.5.4
  # Secret Manager holds the Discord webhook (fed from 1Password via ESO ->
  # SecretManagerSecretVersion.secretDataSecretRef), so no secret lands in git.
  - name: provider-gcp-secretmanager
    package: xpkg.upbound.io/upbound/provider-gcp-secretmanager:v2.5.4
  # Certificate Manager: DNS-authorized managed TLS cert for the assets CDN LB.
  # Classic LB-authorized certs can't validate behind the Cloudflare proxy;
  # DNS authorization validates via a zone CNAME and auto-renews. MRDs install
  # Inactive; only the certificatemanager glob in defaultActivations goes live.
  - name: provider-gcp-certificatemanager
    package: xpkg.upbound.io/upbound/provider-gcp-certificatemanager:v2.5.4

# ExternalSecret that materialises the GCP service-account key JSON used by the
# ProviderConfig. The 1Password item must expose a field whose value is the raw
# SA key JSON, surfaced under the secret key `creds`.
gcpCredentials:
  enabled: true
  # k8s Secret name consumed by the ProviderConfig credentials.secretRef.
  secretName: gcp-creds
  # 1Password item key (ClusterSecretStore "onepassword").
  onepasswordKey: crossplane-gcp
  # Key inside the synced Secret holding the SA key JSON.
  credentialsKey: creds

# The `default` MRAP activate list. Replaces crossplane core's ["*"].
#
# HARD RULE: NEVER use a family glob ("*.<group>") here. A glob activates every
# MRD in the family; upjet/upbound providers ship hundreds of MRDs per family,
# so one glob can create 90-190 CRDs. With ~500 provider MRDs that blew the
# aggregated openapi/v2 doc to 37 MB / 19 s to serve, which timed out ArgoCD's
# cluster-cache sync and stalled EVERY Application with a ComparisonError.
# Crossplane also forbids flipping an MRD back to Inactive once Active, so a
# glob's damage cannot be undone by narrowing later -- the stale CRDs must be
# deleted by hand. List ONLY the specific plurals actually consumed by charts.
# Add a plural here only when a chart starts using that exact kind.
defaultActivations:
  - "bucketiammembers.storage.gcp.upbound.io"
  - "bucketiampolicies.storage.gcp.upbound.io"
  - "buckets.storage.gcp.upbound.io"
  - "certificatemapentries.certificatemanager.gcp.upbound.io"
  - "certificatemaps.certificatemanager.gcp.upbound.io"
  - "certificates.certificatemanager.gcp.upbound.io"
  - "dnsauthorizations.certificatemanager.gcp.upbound.io"
  - "environmentdownloadfiles.virtualenvironmentdownloadfile.proxmoxbpg.crossplane.io"
  - "environmentdownloadfiles.virtualenvironmentdownloadfile.proxmoxbpg.m.crossplane.io"
  - "environmentfiles.virtualenvironmentfile.proxmoxbpg.crossplane.io"
  - "environmentfiles.virtualenvironmentfile.proxmoxbpg.m.crossplane.io"
  - "environmentvms.virtualenvironmentvm.proxmoxbpg.crossplane.io"
  - "environmentvms.virtualenvironmentvm.proxmoxbpg.m.crossplane.io"
  - "folderiammembers.cloudplatform.gcp.m.upbound.io"
  - "folderiammembers.cloudplatform.gcp.upbound.io"
  - "folders.cloudplatform.gcp.m.upbound.io"
  - "folders.cloudplatform.gcp.upbound.io"
  - "functions.cloudfunctions2.gcp.upbound.io"
  - "hmackeys.storage.gcp.upbound.io"
  - "objectaccesscontrols.storage.gcp.m.upbound.io"
  - "organizationiamauditconfigs.cloudplatform.gcp.m.upbound.io"
