  - "projectusageexportbuckets.cloudplatform.gcp.upbound.io"
  - "secretiammembers.secretmanager.gcp.upbound.io"
  - "secrets.secretmanager.gcp.upbound.io"
  - "secretversions.secretmanager.gcp.upbound.io"
  - "serviceaccountiammembers.cloudplatform.gcp.m.upbound.io"
  - "serviceaccountiammembers.cloudplatform.gcp.upbound.io"
  - "serviceaccountkeys.cloudplatform.gcp.m.upbound.io"
  - "serviceaccountkeys.cloudplatform.gcp.upbound.io"
