{{- /*
  Pin Crossplane provider RUNTIME pods to a CPU arch. Several community provider
  images (e.g. wildbitca cloudflare) are amd64-only and ImagePullBackOff if they
  land on the lone arm64 node. Each Provider references this via runtimeConfigRef.
*/ -}}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Values.runtimeConfigName }}
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: {{ .Values.runtimeArch }}
          # Keep provider runtime pods OFF the control-plane node. The provider
          # LIST/watch load is heavy (they pegged the sole 8-CPU CP macintel01 at
          # ~104%, starving kube-apiserver and firing ControlPlaneAPIUnreachable +
          # NodeCPUCritical). Schedule them on amd64 WORKERS (pc01/dell01) instead.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          # containers is a required field on the DeploymentRuntimeConfig pod
          # template; the name is the strategic-merge key. nodeSelector pins arch;
          # HOME=/tmp gives the uid-2000 runtime a writable home so providers that
          # shell out over SSH (proxmox-bpg snippet upload) can create ~/.ssh.
          containers:
            - name: package-runtime
              # Throttle apiserver load. Default upjet providers poll external
              # APIs every 1m and reconcile at rate 10 -> constant status PUT/PATCH
              # + LIST/watch churn that pegged the control-plane apiserver and
              # timed out ArgoCD's openapi sync. 10m poll + rate 1 cuts it ~10x.
              args:
                - --poll-interval=10m
                - --max-reconcile-rate=1
              env:
                - name: HOME
                  value: /tmp
