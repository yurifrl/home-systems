{{- /*
  Pin Crossplane provider RUNTIME pods to a CPU arch. Several community provider
  images (e.g. wildbitca cloudflare) are amd64-only and ImagePullBackOff if they
  land on the lone arm64 node. Each Provider references this via runtimeConfigRef.
*/ -}}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .Values.runtimeConfigName }}
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: {{ .Values.runtimeArch }}
          # No affinity beyond the arch selector: pods float across ALL healthy
          # amd64 nodes (pc01 + macintel01), wherever the scheduler finds room.
          # 2026-09-20: dell01 went NotReady/cordoned, leaving 5.9GB pc01 as the
          # only schedulable amd64 worker; the Talos 1.13.3 userspace OOM
          # handler kill-spree there took every conversion webhook down and
          # jammed every ArgoCD app. macintel01 runs workloads by design (no
          # taint; kubelet reservations protect system pods) with ~25GB free.
          # The old control-plane exclusion dates from the pre-throttle
          # LIST/watch pegging; the args throttle below bounds that load now.
          # containers is a required field on the DeploymentRuntimeConfig pod
          # template; the name is the strategic-merge key. nodeSelector pins arch;
          # HOME=/tmp gives the uid-2000 runtime a writable home so providers that
          # shell out over SSH (proxmox-bpg snippet upload) can create ~/.ssh.
          containers:
            - name: package-runtime
              # Throttle apiserver load. Upjet/upbound providers default to poll
              # 10m + reconcile-rate 10; across 12 providers that drove constant
              # status PUT/PATCH + LIST/watch churn that pegged the control-plane
              # apiserver and timed out ArgoCD's openapi sync. NOTE the flag is
              # --poll (a Go duration), NOT --poll-interval (that name crashes the
              # provider). --max-reconcile-rate is an int and also caps
              # MaxConcurrentReconciles.
              args:
                - --poll=1h
                - --max-reconcile-rate=2
                - --sync=1h
              env:
                - name: HOME
                  value: /tmp
              # Memory request makes the pod BURSTABLE. Without any requests the
              # provider is BestEffort, and Talos's OOMController sweeps every
              # besteffort cgroup on the node when a single kernel OOM fires --
              # all 12 providers restart together, replay their watch caches,
              # spike memory again, and the node enters an OOM death spiral
              # (91 OOM kills in minutes on pc01, 5.4GB node).
              # Limit caps runaway memory AND exempts the pod from Talos's
              # userspace OOM ranking: cgroups with memory.max set score 0 and
              # are skipped by the handler (the kernel memcg OOM still applies
              # at hard pressure). 1Gi is ~5x observed provider usage.
              resources:
                requests:
                  memory: 256Mi
                limits:
                  memory: 1Gi
