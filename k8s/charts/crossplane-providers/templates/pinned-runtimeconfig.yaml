{{- /*
  provider-gcp-storage's startup is fragile in this stretched (two-LAN) cluster:
  its SafeStart RBAC precheck and CRD-gate watch go through the kube-proxy Service
  VIP (10.96.0.1), which load-balances across control-plane backends on both LANs.
  A worker can only reach the same-LAN apiserver, so ~2/3 of VIP connections time
  out and the provider crashloops -> its conversion webhook has no endpoint ->
  every ArgoCD app gets stuck sync=Unknown (cluster cache can't list the CRDs).

  Point it directly at the control-plane apiserver (KUBERNETES_SERVICE_HOST) so it
  has a stable connection without the Service VIP. The direct-apiserver IP is on
  the shared 192.168.68.x LAN that all amd64 workers sit on, so it works from any
  of them.

  Do NOT hostname-pin these providers. These images are amd64-only, so pin to
  arch only and let the pods float across ALL healthy amd64 nodes (pc01 +
  macintel01). A hostname pin (e.g. pc01) is a single point of failure: when
  that node's containerd breaks the conversion webhook loses its endpoint and
  every ArgoCD app jams with ComparisonError. Arch-pin lets the scheduler
  reschedule the webhook onto a surviving amd64 node.
*/ -}}
{{- with .Values.pinnedRuntimeConfig }}
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ .name }}
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          # No affinity beyond the arch selector: pods float across ALL healthy
          # amd64 nodes (pc01 + macintel01). 2026-09-20: with dell01
          # NotReady/cordoned, excluding the control-plane left 5.9GB pc01 as
          # the only schedulable amd64 worker, where the Talos 1.13.3 userspace
          # OOM handler kill-spree took every conversion webhook down. The
          # webhook must survive any single amd64 node failing -- let the
          # scheduler place it wherever there is room.
          containers:
            - name: package-runtime
              # Same apiserver-load throttle as the shared runtime config.
              # --poll is a duration (NOT --poll-interval); --max-reconcile-rate int.
              args:
                - --poll=1h
                - --max-reconcile-rate=2
                - --sync=1h
              env:
                - name: KUBERNETES_SERVICE_HOST
                  value: {{ .apiserverHost | quote }}
                - name: KUBERNETES_SERVICE_PORT
                  value: {{ .apiserverPort | quote }}
              # Limit exempts the pod from Talos's userspace OOM ranking
              # (memory.max set -> score 0, handler skips it) and caps balloons
              # during big reconciles. Same rationale as amd64-only config.
              resources:
                requests:
                  memory: 512Mi
                limits:
                  memory: 1Gi
{{- end }}
