# home talos-default profile (k8s 1.32, Longhorn storage, mixed amd64/arm64).
# Mirrors the kind profile shape: rustfs object store with static creds
# (no cloud IAM), in-chart OTLP collector + jaeger (the repo's `monitoring`
# namespace stack is Prometheus, no OTLP receiver), small PostgreSQL sizing.
# Image distribution: ghcr.io/yurifrl/ate/<name> (public), mirrored from the
# ECR build registry; no pull secret needed.

# 16ccb13: main-HEAD substrate. a0b680d's podcertcontroller writes
# ClusterTrustBundles via certificates.k8s.io/v1beta1, which k8s 1.37
# no longer serves (v1 only) — every bundle create 404s.
substrate:
  version: "16ccb13"

images:
  ateapi:
    repository: ghcr.io/yurifrl/ate/ateapi
    tag: "16ccb13"
  atecontroller:
    repository: ghcr.io/yurifrl/ate/atecontroller
    tag: "16ccb13"
  atelet:
    repository: ghcr.io/yurifrl/ate/atelet
    tag: "16ccb13"
  podcert:
    repository: ghcr.io/yurifrl/ate/podcertcontroller
    tag: "16ccb13"
  snapshotPlugin:
    repository: ghcr.io/yurifrl/ate/snapshot-plugin
    tag: "16ccb13"
  agentgateway:
    repository: ghcr.io/yurifrl/ate/agentgateway
  postgres:
    repository: ghcr.io/yurifrl/ate/postgres
  rustfs:
    repository: ghcr.io/yurifrl/ate/rustfs
  awscli:
    repository: ghcr.io/yurifrl/ate/aws-cli
  otelcollector:
    repository: ghcr.io/yurifrl/ate/otel-collector-contrib
  jaeger:
    repository: ghcr.io/yurifrl/ate/jaeger

# ghcr.io/yurifrl/ate/* is public: no pull Secret, no imagePullSecrets.
imagePullSecrets: []

postgres:
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      # dell01 (sole amd64 worker, 6Gi allocatable) runs crossplane + istio
      # at ~97% of allocatable; a 256Mi request cannot schedule. Limit stays 2Gi.
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 2Gi

storage:
  backend: s3
  rustfs:
    enabled: true
    storage: 5Gi

otel:
  # In-chart collector + jaeger: the home cluster's monitoring stack has no
  # OTLP receiver, and `observability` namespace does not exist on talos.
  exporterOtlpEndpoint: "http://opentelemetry-collector.otel-system.svc:4317"
  exporterOtlpAddress: "http://opentelemetry-collector.otel-system.svc:4317"
  collector:
    enabled: true
  extraEnv:
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_METRIC_EXPORT_TIMEOUT: "10000"
    OTEL_LOGS_EXPORTER: otlp

ateapi:
  authentication:
    # kube-apiserver mints SA tokens with this issuer here (talos advertises
    # its LB endpoint, not the in-cluster default the chart assumes); ax's
    # controller is the only client authenticating with SA JWTs.
    issuer: https://api.k8s.lan:6443
    # The issuer is kube-apiserver itself, reachable only via the LAN DNS name
    # (no cluster-internal resolution), so discovery uses the pod's own
    # projected service-account CA + token.
    inClusterDiscovery: true
  # api.k8s.lan resolves only via LAN /etc/hosts on the host; pods get DNS from
  # CoreDNS, whose upstreams don't serve the .lan zone. Pin the LB VIP.
  hostAliases:
  - ip: 192.168.68.91
    hostnames: [api.k8s.lan]

atelet:
  # Actor images pull from public ghcr.io anonymously — no GCP auth, no
  # localhost registry replacement (talos has no sidecar registry).
  extraArgs: []
  # 16ccb13: storage/snapshot handling moved to the node snapshot-plugin
  # sidecar; both containers share the /var/lib/ate hostPath and atecontroller
  # hardcodes that path for worker pod volumes (nodepath.BasePath).
  snapshotPlugin: true
