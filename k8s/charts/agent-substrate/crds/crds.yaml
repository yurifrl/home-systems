                description: ReadyReplicas is the number of ready worker pods.
                format: int32
                minimum: 0
                type: integer
              replicas:
                description: Replicas is the total number of worker pods.
                format: int32
                minimum: 0
                type: integer
              selector:
                description: Selector is the label selector for the worker pods.
                type: string
            type: object
        required:
