# Default values for agent-substrate.
# This chart deploys the ate-system substrate: ate-api-server, ate-controller,
# atelet (DaemonSet), atenet-router and agentgateway on an EKS cluster.
# It replaces `ate-setup deploy ate-system` (kustomize + ko) with ArgoCD-managed Helm.

# -- The substrate build version. Stamps the ate.dev/substrate-version label
# on the atelet DaemonSet and its pods, names the DaemonSet (atelet-<suffix>,
# see versionSuffix helper) and is the default image tag. Bumping this value
# triggers an atelet DS rollout. Scheduling pins nodes via the generic
# ate.dev/substrate: "true" node label instead — no per-node re-labeling on
# version bumps.
substrate:
  version: "16ccb13"

images:
  ateapi:
    # -- ate-api-server image (ko build of substrate/cmd/ateapi).
    # Built from pinned source by the mirror-ate-images GitHub workflow.
    repository: ghcr.io/yurifrl/ate/ateapi
    tag: "16ccb13"
  atecontroller:
    repository: ghcr.io/yurifrl/ate/atecontroller
    tag: "16ccb13"
  atelet:
    repository: ghcr.io/yurifrl/ate/atelet
    tag: "16ccb13"
  podcert:
    # -- podcertificate-controller (publishes the podidentity/servicedns
    # ClusterTrustBundles the atelet/ate-controller projected volumes use).
    repository: ghcr.io/yurifrl/ate/podcertcontroller
    tag: "16ccb13"
  snapshotPlugin:
    # -- 16ccb13 control-snapshot plugin sidecar served next to ate-api-server.
    repository: ghcr.io/yurifrl/ate/snapshot-plugin
    tag: "16ccb13"
  ateomGvisor:
    # -- ateom worker image (workerpool-gvisor.yaml): the sandboxed worker
    # runtime actors boot on. ko build of substrate/cmd/ateom-gvisor; without
    # a WorkerPool the substrate scheduler has no placement capacity and
    # every actor create fails with "no worker has room for the actor".
    repository: ghcr.io/yurifrl/ate/ateom-gvisor
    tag: "16ccb13"
  # -- atenet-router runs the agentgateway image (see values.images.agentgateway);
  # there is no separate atenet server image in the cluster manifests.
  agentgateway:
    # -- Official upstream agentgateway image (ghcr.io/agentgateway), as pinned
    # by substrate's ate-install manifests (the image atenet-router runs).
    repository: ghcr.io/agentgateway/agentgateway
    tag: "v0.0.0-alpha.9f9744cf"
  # -- atenet-egress runs the digest-pinned 16ccb13 image (see
  # values.images.agentgatewayEgress), which pairs with the new-style egress
  # configmap: its internal dynamicCa bind mints MITM leaves signed by the
  # egress-mitm-ca-pool secret, the mode the running atelet (16ccb13) requires.
  agentgatewayEgress:
    repository: cr.agentgateway.dev/agentgateway
    tag: "v0.0.0-alpha.955d56fa@sha256:fc64f1093a5f7fd32c9cc58d2b53f0a5d5781f7960e3a1ac0a59db4f6a39850f"
  postgres:
    # -- Bundled PostgreSQL (see postgres.bundled): official upstream image,
    # digest-pinned (multi-arch: amd64 + arm64).
    repository: docker.io/library/postgres
    tag: "18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15"
  rustfs:
    # -- S3-compatible object store for local clusters
    # (storage.rustfs.enabled): official upstream image, digest-pinned.
    repository: docker.io/rustfs/rustfs
    tag: "1.0.0-beta.3@sha256:378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358"
  awscli:
    # -- Bucket-bootstrap Job image (rustfs.yaml): official upstream image,
    # digest-pinned.
    repository: docker.io/amazon/aws-cli
    tag: "2.17.0@sha256:643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73"
  otelcollector:
    # -- In-cluster OTLP collector (otel.collector.enabled): official upstream
    # image, digest-pinned (kind/otel-collector.yaml).
    repository: docker.io/otel/opentelemetry-collector-contrib
    tag: "0.157.0@sha256:f2f01157055a9b2aab9df7118e1f1c9abf345e99b23bc7a2bc791db374a7d0f6"
  jaeger:
    # -- Jaeger all-in-one trace store + UI (otel.collector.enabled): official
    # upstream image, digest-pinned.
    repository: docker.io/jaegertracing/all-in-one
    tag: "1.55@sha256:f6b5d09073f14f76873d300f565a6691d815e81bea8e07e1dc3ff67e0596dd4e"

ateapi:
  authentication:
    # -- JWT issuer the api-server trusts for Kubernetes service-account tokens
    # (ate-api-authentication ConfigMap). In-cluster default; on GKE set
    # https://container.googleapis.com/v1/projects/<p>/locations/<l>/clusters/<c>.
    issuer: https://kubernetes.default.svc
    # -- Inject the pod's own projected service-account CA+token into the OIDC
    # discovery client even for a non-default issuer, when that issuer is
    # kube-apiserver itself but not publicly resolvable (talos, self-hosted).
    inClusterDiscovery: false
  # -- hostAliases entries for the ate-api-server pod, needed when the trusted
  # issuer hostname only resolves from outside the cluster (e.g. a LAN DNS
  # name like api.k8s.lan that cluster CoreDNS upstreams don't serve).
  hostAliases: []
  # -- iss claim of minted actor JWTs (ATE_API_ACTOR_JWT_ISSUER). 16ccb13's
  # default is the in-cluster ate-idp-server URL; that server is not part of
  # this chart, so MintActorJWT still works (api-server signs from its local
  # pool) but relying parties cannot yet resolve the issuer.
  actorJwtIssuer: https://idp.ate-system.svc

# -- ghcr.io/yurifrl/ate/* is public: no pull Secret, no imagePullSecrets.
# registry.* only builds one when a private registry needs it.
imagePullSecrets: []

registry:
  # -- Only used to build the ate-registry pull Secret (see
  # imagePullSecrets) when registry.password is set; never persisted.
  server: ghcr.io
  username: yurifrl
  # -- Token for a PRIVATE registry. Empty creates no Secret.
  password: ""

postgres:
  # -- Deploy the bundled PostgreSQL StatefulSet. ate-setup's default deploy
  # does the same for ate-system; set false when pointing the DSN at RDS or
  # an external server.
  bundled: true
  # -- Full DSN override; empty uses the bundled server's default. Rendered
  # into the ate-api-server-secret-envvars Secret (optional envFrom source).
  connectionString: ""
  # -- ate-api-server rejects an empty schema. 16ccb13's postgressetup creates
  # the substrate schema; only change when the setup.sql in postgres.yaml was
  # edited to match.
  schema: substrate
  # -- Roles ATE_API_POSTGRES_READ_WRITE_ROLE / ATE_API_POSTGRES_OWNER_ROLE
  # assert. Must match the identities setup.sql creates (fixed constants at
  # 16ccb13: postgressetup.ReadWriteRole/OwnerRole).
  readWriteRole: substrate_readwrite
  ownerRole: substrate_owner
  # -- Headroom so WAL churn cannot fill the volume (full pg_wal = PANIC).
  # Substrate base is 500Gi; local clusters override to 1Gi.
  storage: 500Gi
  # -- Pod nodeSelector override. Upstream postgres is multi-arch; default
  # `{}` lets it schedule on any untainted node (amd64-only pin can strand it
  # when ko-built workloads fill the only amd64 node).
  nodeSelector: {}
  # -- Upstream sizing sustains control-plane activation load. Local clusters
  # override (kind overlay: 250m/1Gi requests, 2cpu limits).
  resources:
    requests:
      cpu: "2"
      memory: "1Gi"
    limits:
      cpu: "16"
      memory: "2Gi"

atelet:
  # -- Pass GCP credentials for pulling actor images from GCR/Artifact Registry.
  # MUST be false here: the workload/actor images are public ghcr, and atelet's
  # in-process go-containerregistry pulls are anonymous for non-GCP registries.
  gcpAuthForImagePulls: false
  # -- Extra atelet CLI args appended verbatim. The kind profile mirrors the
  # upstream kind overlay: --log-level=debug and
  # --localhost-registry-replacement=kind-registry:5000.
  extraArgs: []

storage:
  # -- Object-store backend for Actor data/snapshots. On EKS: s3
  # (atelet + ate-api-server read AWS credentials from the pod/node IRSA).
  backend: s3
  rustfs:
    # -- Deploy the in-cluster S3-compatible store + inject static AWS
    # credentials into ate-api-server/atelet. Local clusters only.
    enabled: false
    endpoint: "http://rustfs.ate-system.svc:9000"
    accessKey: "rustfsadmin"
    secretKey: "rustfsadmin"
    region: "us-east-1"
    # -- Pod nodeSelector override; upstream rustfs is multi-arch.
    nodeSelector: {}
    storage: 1Gi

otel:
  # -- OTLP endpoint for ate-otel-config (ate-api-server, ate-controller,
  # atelet). Point at the cluster collector; empty string disables export
  # only if the collector isn't deployed.
  exporterOtlpEndpoint: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  # -- OTLP exporter address used by atenet-router directly.
  exporterOtlpAddress: "http://opentelemetry-collector.observability.svc.cluster.local:4317"
  # -- Deploy the in-cluster collector + jaeger (kind profile, see
  # templates/otel-collector.yaml). EKS keeps false: the pre-existing
  # observability-namespace collector receives exports.
  collector:
    enabled: false
  # -- Additional data keys merged into the ate-otel-config ConfigMap. The
  # kind profile sets OTEL_METRIC_EXPORT_INTERVAL, OTEL_METRIC_EXPORT_TIMEOUT
  # (both 10000) and OTEL_LOGS_EXPORTER=otlp, mirroring the upstream overlay.
  extraEnv: {}

podMonitoring:
  # -- Deploy PodMonitoring CR (Google-managed K8s operator CRD) for
  # atenet-router /stats/prometheus scraping. Enable only if the
  # gke-managed-prometheus operator runs on the cluster.
  enabled: false

# ate-system CRDs. Version-coupled to the controllers (ate-setup always
# upgrades them together), so they are rendered as normal resources and
# upgraded by ArgoCD ServerSideApply on every sync.
crds:
  install: true

# Cluster-wide SandboxConfigs + the fail-closed asset validation policy.
sandbox:
  gvisor:
    # -- Apply the cluster-wide gvisor SandboxConfig (name: gvisor-default).
    enabled: true
    pauseImage: "registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"
    assets:
      amd64:
        gvisor:
          url: "gs://gvisor/releases/nightly/2026-09-02/x86_64/gvisor.tar.zstd"
          sha256: "d547d81401461fd1c679c5c4fa0a6c2b8ef7dc3c22ce23c9e25dcc4c69cfd06f"
      arm64:
        gvisor:
          url: "gs://gvisor/releases/nightly/2026-09-02/aarch64/gvisor.tar.zstd"
          sha256: "a64916f9813ce7e4841a30480a599337f7dda07b421c6bf0123db2212aa7d1df"
  microvm:
    # -- Apply the microvm (cloud-hypervisor/kata) SandboxConfig. Opt-in:
    # requires the kata asset set staged in the cluster bucket first.
    enabled: false
    pauseImage: "registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4"
    bucket: "ate-cluster-bucket" # -- cluster object-store bucket holding kata-assets/
    assets:
      arm64:
        cloud-hypervisor:
          url: "kata-assets/cloud-hypervisor"
          sha256: "f192b510eea1c710cbc439d716bb0573c223fc463dbe3e6523788a2b7ef62850"
        virtiofsd:
          url: "kata-assets/virtiofsd"
          sha256: "3aa9240045d2261930ef04138fe05cf288f94c867e63e5d0845758bac5e3d458"
        kata-kernel:
          url: "kata-assets/vmlinux"
          sha256: "4960f6cf781274eaa445fc9f88bb8c5ce951649278bc9caa13afb1e99cfe80e6"
        kata-image:
          url: "kata-assets/rootfs.img"
          sha256: "7e3bdd500eb92de17c377bd84f8ed57e50d6bb68c7ec08c88f5e1916cd49f30d"
      amd64:
        cloud-hypervisor:
          url: "kata-assets/cloud-hypervisor"
          sha256: "448af3d4e59b22c2987f7df94c213ad40fb53a10d437e42b5ee6c4fce7c29ecc"
        virtiofsd:
          url: "kata-assets/virtiofsd"
          sha256: "15b2e72a78cc08a9bd8a6943e89fb69c88cb3cbeb63069efceade835342ac7d4"
        kata-kernel:
          url: "kata-assets/vmlinux"
          sha256: "8e9dbc3a6e4c26adb089d23d31201edebce905c7f3e31aa67b32bdd41df1b86f"
        kata-image:
          url: "kata-assets/rootfs.img"
          sha256: "96497f64da1de9c7473fef46c3d29ddd0805d334731cf9d903a21a5b2c33cefb"

# The gvisor WorkerPool (templates/workerpool-gvisor.yaml): substrate worker
# capacity for actors. spec.sandboxClasses (the LIST field) is what the
# controller mirrors onto Worker.sandbox_class — the scheduler rejects actors
# with "no worker has room" when it is empty. The singular legacy
# spec.sandboxClass field is ignored by the controller.
workers:
  gvisor:
    # -- Deploy the gvisor WorkerPool so actors have placement capacity.
    enabled: true
    # -- Worker pod count. Each worker reports node capacity to the substrate
    # scheduler.
    replicas: 1

# Fail-closed ValidatingAdmissionPolicy enforcing per-sandbox-class asset
# requirements (requires k8s >= 1.30; EKS 1.31 OK).
validatingAdmissionPolicy:
  enabled: true

# -- Pod nodeSelector for every workload. Images are linux/amd64-only (ko
# single-arch builds); mixed-arch clusters need arch pinning. Override with
# {} on single-arch clusters.
nodeSelector:
  kubernetes.io/arch: amd64
