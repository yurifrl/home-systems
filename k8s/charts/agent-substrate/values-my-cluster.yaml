# my-cluster profile (Apple container k8s 1.35, single arm64 node, 3 CPU /
# 6 GB; the amd64-only ko images run via Rosetta in the node VM). Same shape
# as the kind/talos local profiles: rustfs object store with static creds,
# in-chart OTLP collector + jaeger, small PostgreSQL.
# nodeSelector MUST be empty: the default amd64 pin would strand every pod on
# the arm64-only node (helpers honor an explicit {} via hasKey).
nodeSelector: {}

atelet:
  # v0.5.0: snapshot/object-store handling lives in the node objectstore-plugin
  # sidecar (shared /var/lib/ate hostPath; atecontroller hardcodes the worker
  # volume path). Required with the rustfs s3 backend.
  objectStorePlugin: true
  extraArgs:
    # Registry traffic resolves inside the guest network namespace, where
    # 127.0.0.1 is the sandbox loopback; the worker host's 127.0.0.1:5000
    # (Apple container registry proxy) is rewritten so actors can pull.
    - --localhost-registry-replacement=127.0.0.1:5000

# Cluster substrate is Talos (amd64 dell01 is the only ate.dev/substrate node):
# gVisor assets must match the node architecture for real. The older aarch64
# under `amd64` mapping was for the retired Apple Container substrate and
# shipped an arm64 runsc to amd64 nodes (runsc exec format error) plus an
# arm64 pause image (failed to load /pause: exec format error).
# ate-api-authentication ConfigMap matches the hand-patched live value
# (kubernetes.default.svc.cluster.local); chart default lacks the
# .cluster.local suffix and is overridden here to avoid SSA conflicts.
ateapi:
  authentication:
    issuer: https://kubernetes.default.svc.cluster.local
sandbox:
  gvisor:
    pauseImage: "127.0.0.1:5000/pause:3.10.2@sha256:412c4a7219cb8a299a37337f3d87810c5340095322e15594a1637785adad0f17"
    assets:
      amd64:
        gvisor:
          url: "gs://gvisor/releases/nightly/2026-10-10/x86_64/gvisor.tar.zstd"
          sha256: "4ae7fab988c3647d2a835d6c3c70c6a99021c562db97827592562b6c51c3e88c"
      arm64:
        gvisor:
          url: "gs://gvisor/releases/nightly/2026-10-10/aarch64/gvisor.tar.zstd"
          sha256: "aaf414f06eea7960238e43165c691f0a36cefc0593fb141e011e96211c7b6f57"

postgres:
  storage: 2Gi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

storage:
  backend: s3
  rustfs:
    enabled: true
    storage: 2Gi

otel:
  # The in-chart collector deploys into the chart-hardcoded otel-system
  # namespace (templates/otel-collector.yaml).
  exporterOtlpEndpoint: "http://opentelemetry-collector.otel-system.svc:4317"
  exporterOtlpAddress: "http://opentelemetry-collector.otel-system.svc:4317"
  collector:
    enabled: true
  extraEnv:
    OTEL_METRIC_EXPORT_INTERVAL: "10000"
    OTEL_METRIC_EXPORT_TIMEOUT: "10000"
    OTEL_LOGS_EXPORTER: otlp

ateapi:
  authentication:
    # kind (my-cluster): kube-apiserver's in-cluster DNS name has the
    # .cluster.local suffix (the talos profile's bare
    # https://kubernetes.default.svc also resolves in-cluster, so both work).
    issuer: https://kubernetes.default.svc.cluster.local
