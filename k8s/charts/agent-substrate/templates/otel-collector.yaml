# Kind-profile observability: in-cluster OTel collector (substrate_* counts,
# otelcol_* self-metrics, traces to jaeger) plus jaeger all-in-one. Ported
# verbatim from manifests/ate-install/kind/otel-collector.yaml. Disabled by
# default: EKS exports to the pre-existing collector in the observability
# namespace via otel.exporterOtlpEndpoint instead.
{{- if .Values.otel.collector.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: otel-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-collector-config
  namespace: otel-system
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:

      # The count connector below sends deltas, and the Prometheus exporter
      # reads the new start timestamp of each batch as a reset. Without
      # deltatocumulative the counts do not accumulate and each scrape shows
      # only the last batch.
      #
      # max_streams bounds the memory. A stream is for each process and
      # count, and not for each service, because serverboot gives each
      # process its own service.instance.id. Above the limit new streams drop
      # with no log line and the totals become too low.
      deltatocumulative:
        max_streams: 10000

    connectors:
      count:
        spans:
          substrate_spans:
            description: Spans received, by emitting service.
            attributes:
              # service.name resolves from the resource; the Prometheus
              # exporter writes the key as service_name.
              - key: service.name
                default_value: unknown
        datapoints:
          substrate_datapoints:
            description: Metric datapoints received, by emitting service.
            attributes:
              - key: service.name
                default_value: unknown
        logs:
          substrate_actor_state_changes:
            description: Actor state change events received, by state.
            attributes:
              - key: service.name
                default_value: unknown
              # No default: drops workload logs, which have no such key.
              - key: ate.actor.state

    exporters:
      otlp/jaeger:
        endpoint: jaeger.otel-system.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger, debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        traces/count:
          receivers: [otlp]
          exporters: [count]
        metrics/count:
          receivers: [otlp]
          exporters: [count]
        logs/count:
          receivers: [otlp]
          exporters: [count]
        metrics/count-out:
          receivers: [count]
          processors: [deltatocumulative]
          exporters: [prometheus]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-collector
  namespace: otel-system
  labels:
    app: opentelemetry-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry-collector
  template:
    metadata:
      labels:
        app: opentelemetry-collector
    spec:
      nodeSelector:
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: otel-collector
        image: {{ .Values.images.otelcollector.repository }}:{{ .Values.images.otelcollector.tag }}
        args:
        - --config=/conf/otel-collector-config.yaml
        volumeMounts:
        - name: config
          mountPath: /conf
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: prom
          containerPort: 8889
        - name: self
          containerPort: 8888
      volumes:
      - name: config
        configMap:
          name: opentelemetry-collector-config
          items:
          - key: otel-collector-config.yaml
            path: otel-collector-config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-collector
  namespace: otel-system
spec:
  type: ClusterIP
  selector:
    app: opentelemetry-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: prom
    port: 8889
    targetPort: 8889
  - name: self
    port: 8888
    targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: otel-system
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      nodeSelector:
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: jaeger
        image: {{ .Values.images.jaeger.repository }}:{{ .Values.images.jaeger.tag }}
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: query
          containerPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: otel-system
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: query
    port: 16686
    targetPort: 16686
{{- end }}
