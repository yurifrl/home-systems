apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: atelet
  name: atelet
  namespace: ate-system
spec:
  selector:
    matchLabels:
      app: atelet
  template:
    metadata:
      annotations:
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: atelet
    spec:
      {{- if .Values.atelet.objectStorePlugin }}
      # Node object-store plugin (native sidecar): moves snapshots and sandbox
      # assets between this node and object storage over a pod-local Unix
      # socket. Starts before atelet so the socket exists when it connects.
      # Mirrors manifests/ate-install/kind/atelet at v0.5.0.
      initContainers:
      - name: objectstore-plugin
        image: {{ .Values.images.objectStorePlugin.repository }}:{{ .Values.images.objectStorePlugin.tag }}
        restartPolicy: Always
        args:
        - node
        - --socket=/run/objectstore-plugin/node.sock
        - --root=/var/lib/ate
        - --asset-staging-dir=/var/lib/objectstore-plugin/asset-staging
        - --asset-staging-capacity=8Gi
        # The plugin listens on a Unix socket; the image has no shell, so the
        # binary checks itself.
        startupProbe:
          exec:
            command:
            - /ko-app/objectstore-plugin
            - healthcheck
            - --socket=/run/objectstore-plugin/node.sock
          periodSeconds: 2
          failureThreshold: 30
        # Reads/writes under the /var/lib/ate hostPath as root, like atelet.
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        env:
        # Object storage for snapshot transfers and sandbox assets. atelet
        # itself no longer reads these and exits if ATE_STORAGE_BACKEND is set.
        - name: ATE_STORAGE_BACKEND
          value: {{ .Values.storage.backend }}
        {{- if .Values.storage.rustfs.enabled }}
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.storage.rustfs.accessKey | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.storage.rustfs.secretKey | quote }}
        - name: AWS_REGION
          value: {{ .Values.storage.rustfs.region | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ .Values.storage.rustfs.endpoint | quote }}
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        {{- end }}
        envFrom:
        - configMapRef:
            name: ate-otel-config
        volumeMounts:
        - name: run-ateom
          mountPath: /var/lib/ate
        - name: objectstore-plugin
          mountPath: /run/objectstore-plugin
        - name: asset-staging
          mountPath: /var/lib/objectstore-plugin/asset-staging
      {{- end }}
      containers:
      - args:
        - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --drain-delay=0s
        - --drain-timeout=5m
        {{- if .Values.atelet.objectStorePlugin }}
        # v0.5.0: snapshot/object-store work lives in the node plugin sidecar.
        - --objectstore-plugin-socket=/run/objectstore-plugin/node.sock
        {{- end }}
        {{- range .Values.atelet.extraArgs }}
        - {{ . | quote }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME),service.instance.id=$(POD_UID)
        {{- if not .Values.atelet.objectStorePlugin }}
        - name: ATE_STORAGE_BACKEND
          value: {{ .Values.storage.backend }}
        {{- if .Values.storage.rustfs.enabled }}
        # Local-cluster object store (see rustfs.yaml): static creds instead of IRSA.
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.storage.rustfs.accessKey | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.storage.rustfs.secretKey | quote }}
        - name: AWS_REGION
          value: {{ .Values.storage.rustfs.region | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ .Values.storage.rustfs.endpoint | quote }}
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        {{- end }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: {{ .Values.images.atelet.repository }}:{{ .Values.images.atelet.tag }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        name: atelet
        ports:
        - containerPort: 8085
          hostPort: 8085
          name: grpc
        - containerPort: 9090
          name: prometheus
          protocol: TCP
        - containerPort: 9091
          name: health
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/ate
          name: run-ateom
        {{- if .Values.atelet.objectStorePlugin }}
        - mountPath: /run/objectstore-plugin
          name: objectstore-plugin
        {{- end }}
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns-ca
          readOnly: true
        - mountPath: /var/lib/kubelet/plugins
          name: kubelet-plugins
        - mountPath: /var/lib/kubelet/device-plugins
          name: device-plugins
        - mountPath: /host/dev
          name: host-dev
          readOnly: true
      nodeSelector:
        # Generic capability marker set once per node (nostos machineconfig);
        # never a version, so image-tag bumps roll out without re-labeling nodes.
        ate.dev/substrate: "true"
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      priorityClassName: ate-node-critical
      serviceAccountName: atelet
      terminationGracePeriodSeconds: 330
      tolerations:
      - effect: NoSchedule
        key: ate.dev/sandboxClass
        operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/ate
          type: DirectoryOrCreate
        name: run-ateom
      {{- if .Values.atelet.objectStorePlugin }}
      - name: objectstore-plugin
        emptyDir: {}
      # Holds asset downloads until verified; plugin caps usage at
      # --asset-staging-capacity, +1Gi slack for filesystem overhead.
      - name: asset-staging
        emptyDir:
          sizeLimit: 9Gi
      {{- end }}
      - hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
        name: kubelet-plugins
      - hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
        name: device-plugins
      - hostPath:
          path: /dev
          type: Directory
        name: host-dev
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
