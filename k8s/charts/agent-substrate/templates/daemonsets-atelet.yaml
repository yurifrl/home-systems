apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: atelet
    ate.dev/substrate-version: {{ .Values.substrate.version }}
  name: atelet-{{ include "agent-substrate.versionSuffix" . }}
  namespace: ate-system
spec:
  selector:
    matchLabels:
      app: atelet
      ate.dev/substrate-version: {{ .Values.substrate.version }}
  template:
    metadata:
      annotations:
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: atelet
        ate.dev/substrate-version: {{ .Values.substrate.version }}
    spec:
      containers:
      - args:
        - --gcp-auth-for-image-pulls={{ .Values.atelet.gcpAuthForImagePulls }}
        - --grpc-server-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --client-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --drain-delay=0s
        - --drain-timeout=5m
        {{- range .Values.atelet.extraArgs }}
        - {{ . | quote }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME),service.instance.id=$(POD_UID)
        - name: ATE_STORAGE_BACKEND
          value: {{ .Values.storage.backend }}
        {{- if .Values.storage.rustfs.enabled }}
        # Local-cluster object store (see rustfs.yaml): static creds instead of IRSA.
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.storage.rustfs.accessKey | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.storage.rustfs.secretKey | quote }}
        - name: AWS_REGION
          value: {{ .Values.storage.rustfs.region | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ .Values.storage.rustfs.endpoint | quote }}
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        {{- end }}
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: {{ .Values.images.atelet.repository }}:{{ .Values.images.atelet.tag }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        name: atelet
        ports:
        - containerPort: 8085
          hostPort: 8085
          name: grpc
        - containerPort: 9090
          hostPort: 9090
          name: prometheus
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/ateom-gvisor
          name: run-ateom
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns-ca
          readOnly: true
        - mountPath: /var/lib/kubelet/plugins
          name: kubelet-plugins
        - mountPath: /var/lib/kubelet/device-plugins
          name: device-plugins
        - mountPath: /host/dev
          name: host-dev
          readOnly: true
      nodeSelector:
        ate.dev/substrate-version: {{ .Values.substrate.version }}
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      priorityClassName: ate-node-critical
      serviceAccountName: atelet
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 330
      tolerations:
      - effect: NoSchedule
        key: ate.dev/sandboxClass
        operator: Exists
      volumes:
      - hostPath:
          path: /var/lib/ateom-gvisor
          type: DirectoryOrCreate
        name: run-ateom
      - hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
        name: kubelet-plugins
      - hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
        name: device-plugins
      - hostPath:
          path: /dev
          type: Directory
        name: host-dev
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
