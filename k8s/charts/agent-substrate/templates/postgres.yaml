{{- if .Values.postgres.bundled }}
# Bundled PostgreSQL for ate-api-server, ported from substrate's
# manifests/ate-install/postgres/postgres.yaml at 16ccb13. The serving
# certificate comes from the servicedns podCertificate projection; client
# certificates authenticate by CN against the fixed per-user identities
# created by the embedded setup.sql (substrate_owner_user /
# substrate_readwrite_user). ate-api-server connects with sslmode=verify-full
# per-user mTLS DSNs (see secrets-ateapi-envvars.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: ate-system
data:
  postgresql.conf: |
    listen_addresses = '*'
    ssl = on
    ssl_cert_file = '/run/servicedns.podcert.ate.dev/credential-bundle.pem'
    ssl_key_file = '/run/servicedns.podcert.ate.dev/credential-bundle.pem'
    ssl_ca_file = '/run/postgres.podcert.ate.dev/trust-bundle.pem'
    hba_file = '/etc/postgresql/pg_hba.conf'
  pg_hba.conf: |
    # Local socket access is limited to processes in this pod and is used by
    # health checks, the workload's idempotent database bootstrap, and the
    # tls-reloader sidecar's configuration reloads.
    local all all trust
    # The setup user is local-only; application pods never receive it.
    hostssl all postgres all reject
    # Client certificate CNs must match the requested database username.
    hostssl atepg substrate_owner_user,substrate_readwrite_user all cert
  # Parameterized identity setup from pkg/postgressetup/setup.sql at
  # 16ccb13, run idempotently by the postgres container's postStart hook
  # (ate-setup's setupBundledPostgres equivalent: same SQL, same psql
  # variable defaults for passwordless bundled installs).
  setup.sql: |
    SELECT
        set_config('agent_substrate.setup_schema', :'substrate_schema', true) AS schema,
        set_config('agent_substrate.setup_owner_role', :'substrate_owner_role', true) AS owner_role,
        set_config('agent_substrate.setup_owner_user', :'substrate_owner_user', true) AS owner_user,
        set_config('agent_substrate.setup_owner_password', :'substrate_owner_password', true) AS owner_password,
        set_config('agent_substrate.setup_readwrite_role', :'substrate_readwrite_role', true) AS readwrite_role,
        set_config('agent_substrate.setup_readwrite_user', :'substrate_readwrite_user', true) AS readwrite_user,
        set_config('agent_substrate.setup_readwrite_password', :'substrate_readwrite_password', true) AS readwrite_password
    \gset

    DO $setup$
    DECLARE
        schema_name text := current_setting('agent_substrate.setup_schema');
        owner_role text := current_setting('agent_substrate.setup_owner_role');
        owner_user text := current_setting('agent_substrate.setup_owner_user');
        owner_password text := NULLIF(current_setting('agent_substrate.setup_owner_password'), '');
        readwrite_role text := current_setting('agent_substrate.setup_readwrite_role');
        readwrite_user text := current_setting('agent_substrate.setup_readwrite_user');
        readwrite_password text := NULLIF(current_setting('agent_substrate.setup_readwrite_password'), '');
        managed record;
        role_attrs record;
        schema_owner text;
    BEGIN
        PERFORM pg_advisory_xact_lock(hashtextextended('agent-substrate:setup:' || schema_name, 0));

        FOR managed IN SELECT * FROM (VALUES
            (owner_role, false, NULL::text),
            (readwrite_role, false, NULL::text),
            (owner_user, true, owner_password),
            (readwrite_user, true, readwrite_password)
        ) AS roles(name, can_login, password) LOOP
            SELECT rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolinherit
              INTO role_attrs FROM pg_roles WHERE rolname = managed.name;
            IF NOT FOUND THEN
                IF managed.can_login THEN
                    EXECUTE format('CREATE ROLE %I LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION', managed.name);
                ELSE
                    EXECUTE format('CREATE ROLE %I NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION', managed.name);
                END IF;
            ELSIF role_attrs.rolcanlogin <> managed.can_login OR role_attrs.rolsuper
               OR role_attrs.rolcreatedb OR role_attrs.rolcreaterole OR role_attrs.rolreplication
               OR (managed.can_login AND role_attrs.rolinherit) THEN
                RAISE EXCEPTION 'managed PostgreSQL role "%" conflicts with the required attributes', managed.name;
            END IF;
            IF managed.can_login THEN
                EXECUTE format('ALTER ROLE %I PASSWORD %L', managed.name, managed.password);
            END IF;
        END LOOP;

        EXECUTE format('GRANT %I TO %I', owner_role, owner_user);
        EXECUTE format('GRANT %I TO %I', readwrite_role, readwrite_user);

        SELECT pg_get_userbyid(nspowner) INTO schema_owner FROM pg_namespace WHERE nspname = schema_name;
        IF NOT FOUND THEN
            EXECUTE format('CREATE SCHEMA %I AUTHORIZATION %I', schema_name, owner_role);
        ELSIF schema_owner <> owner_role THEN
            RAISE EXCEPTION 'PostgreSQL schema "%" is owned by "%", not "%"', schema_name, schema_owner, owner_role;
        END IF;

        REVOKE CREATE ON SCHEMA public FROM PUBLIC;
        EXECUTE format('REVOKE ALL ON SCHEMA %I FROM PUBLIC', schema_name);
        EXECUTE format('GRANT USAGE ON SCHEMA %I TO %I', schema_name, readwrite_role);
        EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO %I', owner_role, schema_name, readwrite_role);
        EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO %I', owner_role, schema_name, readwrite_role);
        EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT EXECUTE ON ROUTINES TO %I', owner_role, schema_name, readwrite_role);
        EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA %I GRANT USAGE ON TYPES TO %I', owner_role, schema_name, readwrite_role);
    END
    $setup$;
  reload-tls.sh: |
    # PostgreSQL opens ssl_cert_file, ssl_key_file and ssl_ca_file at startup
    # and on SIGHUP, and nowhere else. The kubelet replaces the projected pod
    # certificate in place about 30 minutes before it expires, so without this
    # loop the server keeps presenting the certificate it booted with until it
    # expires about a day later and every client stops trusting it.
    set -eu

    # As PID 1 this shell only sees SIGTERM if a handler is installed, and only
    # acts on it between commands, so the sleep below runs in the background
    # and is waited on. Without both halves the pod takes the full termination
    # grace period to go away.
    trap 'exit 0' TERM INT

    CERT=/run/servicedns.podcert.ate.dev/credential-bundle.pem
    CA=/run/postgres.podcert.ate.dev/trust-bundle.pem

    # Comfortably inside the 30m headroom (notAfter - beginRefreshAt) that
    # cmd/podcertcontroller/internal/servicednssigner/servicednssigner.go
    # leaves; hashing two small files costs nothing.
    INTERVAL=60

    reloaded=""
    while true; do
      current="$(sha256sum "${CERT}" "${CA}" /etc/postgresql/pg_hba.conf)"
      # Reloading fails until the server is accepting connections, which is
      # where every pod starts out, so only record a hash once it has worked.
      # Starting empty also means a restart of this container costs one
      # redundant reload rather than a missed one.
      if [ "${current}" != "${reloaded}" ] \
        && psql -U "${POSTGRES_USER}" -d postgres -Atc 'SELECT pg_reload_conf()' >/dev/null 2>&1; then
        reloaded="${current}"
        echo "$(date -u +%FT%TZ) reloaded TLS configuration"
      fi
      sleep "${INTERVAL}" &
      wait $!
    done
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ate-system
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ate-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Group ownership of the projected certificate below, and of the data
      # volume so that a freshly provisioned one is writable. OnRootMismatch
      # keeps the kubelet from walking the data directory on every start,
      # which would leave PGDATA group-writable and postgres refusing to run.
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        {{- include "agent-substrate.nodeSelector" (dict "root" $ "overrides" .Values.postgres.nodeSelector) | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # PostgreSQL re-reads its TLS files only on SIGHUP, so this sidecar
      # reloads the server whenever the kubelet rotates the projected pod
      # certificate. fsGroup is also what makes that projection readable: the
      # kubelet writes it root-owned for as long as the pod's containers do not
      # all agree on one non-root user, and grants the fsGroup group access,
      # landing the key at root:postgres 0640, the only shared mode PostgreSQL
      # accepts. Pinning runAsUser on the postgres container would make the key
      # postgres-owned and group-readable, which it rejects.
      # See https://www.postgresql.org/docs/current/ssl-tcp.html#SSL-SETUP
      initContainers:
      - name: tls-reloader
        restartPolicy: Always
        image: {{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}
        securityContext:
          runAsUser: 70
        env:
        - name: POSTGRES_USER
          value: postgres
        command:
        - /bin/sh
        - /etc/postgresql/reload-tls.sh
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: postgres-ca
          mountPath: /run/postgres.podcert.ate.dev
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
      containers:
      - name: postgres
        image: {{ .Values.images.postgres.repository }}:{{ .Values.images.postgres.tag }}
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -ec
              - |
                until psql -U "${POSTGRES_USER}" -d postgres -Atc 'SELECT 1' >/dev/null 2>&1; do
                  sleep 1
                done
                if ! psql -U "${POSTGRES_USER}" -d postgres -Atc \
                  "SELECT 1 FROM pg_database WHERE datname = 'atepg'" | grep -qx 1; then
                  createdb -U "${POSTGRES_USER}" atepg
                fi
                # --single-transaction matches postgressetup.Script() (BEGIN + script
                # + COMMIT): setup.sql's set_config(..., is_local=true) locals
                # must stay visible when the DO block reads them.
                psql --no-psqlrc --single-transaction --set=ON_ERROR_STOP=1 -U "${POSTGRES_USER}" -d atepg \
                  --set=substrate_schema=substrate \
                  --set=substrate_owner_role=substrate_owner \
                  --set=substrate_owner_user=substrate_owner_user \
                  --set=substrate_owner_password= \
                  --set=substrate_readwrite_role=substrate_readwrite \
                  --set=substrate_readwrite_user=substrate_readwrite_user \
                  --set=substrate_readwrite_password= \
                  --file /etc/postgresql/setup.sql
        env:
        - name: POSTGRES_DB
          value: atepg
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            # The image's temporary initialization server is socket-only.
            - nc -z 127.0.0.1 5432
          initialDelaySeconds: 2
          periodSeconds: 2
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - pg_isready -U "${POSTGRES_USER}" -d postgres
          initialDelaySeconds: 10
          periodSeconds: 10
        args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        volumeMounts:
        - name: config
          mountPath: /etc/postgresql
        - name: servicedns
          mountPath: /run/servicedns.podcert.ate.dev
          readOnly: true
        - name: postgres-ca
          mountPath: /run/postgres.podcert.ate.dev
          readOnly: true
        - name: socket
          mountPath: /var/run/postgresql
        - name: data
          mountPath: /var/lib/postgresql/data
        {{- with .Values.postgres.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      volumes:
      - name: config
        configMap:
          name: postgres-config
      - name: servicedns
        projected:
          # 0600 plus the group read that fsGroup adds is the 0640 above.
          defaultMode: 0600
          sources:
          - podCertificate:
              signerName: servicedns.podcert.ate.dev/identity
              keyType: ECDSAP256
              credentialBundlePath: credential-bundle.pem
      # The unix socket directory, shared so the sidecar can ask the running
      # server to reload. The image defaults both the server and its clients to
      # this path, so nothing else has to know about it.
      - name: socket
        emptyDir: {}
      - name: postgres-ca
        projected:
          sources:
          - clusterTrustBundle:
              signerName: postgres.podcert.ate.dev/identity
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          # Headroom so WAL churn cannot fill the volume: a full pg_wal is a
          # PANIC that drops every connection. Size also scales provisioned
          # IOPS/throughput on PD-backed storage classes.
          storage: {{ .Values.postgres.storage }}
{{- end }}
