{{- if .Values.sandbox.gvisor.enabled }}
# Cluster-wide SandboxConfig for the gVisor (runsc) sandbox class so gVisor
# ActorTemplates can name it via sandboxConfig.configName. atelet fetches the
# gVisor release tarball matching the worker node's architecture and extracts
# it locally (anonymous fetch of the public gs:// bucket).
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  name: gvisor-default
  namespace: ate-system
  annotations:
    # Required: WorkerPools without configRef resolve the default for their
    # sandbox class via this annotation.
    sandboxconfig.ate.dev/is-class-default: "true"
spec:
  sandboxClass: gvisor
  # 16ccb13 groups the runtime pieces into named versions; the default names
  # the one actors boot. pauseImage is required per gvisor version (with a
  # digest) and forbidden for other classes.
  defaultVersion: default
  versions:
    - name: default
      pauseImage: {{ .Values.sandbox.gvisor.pauseImage | quote }}
      assets:
{{ toYaml .Values.sandbox.gvisor.assets | indent 8 }}
{{- end }}
