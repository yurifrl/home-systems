apiVersion: v1
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.exporterOtlpEndpoint | quote }}
  {{- range $key, $value := .Values.otel.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
kind: ConfigMap
metadata:
  name: ate-otel-config
  namespace: ate-system

---
apiVersion: v1
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    frontendPolicies:
      connect:
        mode: tunnel
      accessLog:
        add:
          substrate.connect.authority: source.connectHeaders["host"]
      substrateEgressActorResolution:
        host: api.ate-system.svc:443
        policies:
          backendTLS:
            cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
            root: /run/servicedns-ca/trust-bundle.pem

    # Keep the outer egress gateway on 8443, but bind it to this pod's
    # address. Numeric CONNECT re-entry must select the wildcard
    # internal bind instead of selecting this front door again.
    gateways:
      egress:
        port: 8443
        bindAddress: $POD_IP
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          root: /run/actor-id-ca-certs/ca.crt

    binds:
    - mode: internal
      protocol: AUTO
      listeners:
      - protocol: HTTPS
        tls:
          mode: dynamicCa
          cert: /run/egress-mitm/tls.crt
          key: /run/egress-mitm/tls.key
        routes:
        - name: reject-websocket-upgrade
          matches:
          - headers:
            - name: Connection
              value:
                regex: '(?i)(^|,)\s*upgrade\s*(,|$)'
            - name: Upgrade
              value:
                regex: '(?i)(^|,)\s*websocket\s*(,|$)'
          policies:
            directResponse:
              status: 403
              body: WebSocket egress is not supported
        - backends:
          - dynamic: {}
            policies:
              backendTLS:
                root: /etc/ssl/certs/ca-certificates.crt
          policies:
            substrateEgress: &egressPolicy
              #ATE_AGENTGATEWAY_CREDENTIAL_PROVIDERS
              host: api.ate-system.svc:443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns-ca/trust-bundle.pem
      - protocol: HTTP
        routes:
        - name: reject-websocket-upgrade
          matches:
          - headers:
            - name: Connection
              value:
                regex: '(?i)(^|,)\s*upgrade\s*(,|$)'
            - name: Upgrade
              value:
                regex: '(?i)(^|,)\s*websocket\s*(,|$)'
          policies:
            directResponse:
              status: 403
              body: WebSocket egress is not supported
        - backends:
          - dynamic:
              target: source.connectHeaders["host"]
          policies:
            substrateEgress: *egressPolicy
      - protocol: TLS
        tcpRoutes:
        - backends:
          - dynamic: {}
kind: ConfigMap
metadata:
  name: atenet-egress-agentgateway-substrate-config
  namespace: ate-system

---
apiVersion: v1
data:
  config.yaml: |
    # yaml-language-server: $schema=https://agentgateway.dev/schema/config
    config:
      statsAddr: 0.0.0.0:15020
      backend:
        # Guest process services live at the actor sandbox's link-local
        # address (169.254.17.2). agentgateway v1.7+ refuses dynamic backends
        # resolving to loopback/link-local unless this is set.
        allowDynamicLoopback: true

    frontendPolicies:
      tracing:
        host: $AGENTGATEWAY_OTLP_ADDRESS
        protocol: grpc
        # Keep in sync with the router's dataPlaneTraceRatio.
        randomSampling: 0.01

    gateways:
      http:
        port: 8080
        protocol: HTTP
      https:
        port: 8443
        protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem

    backends:
    - name: dynamic
      dynamic: {}
      policies:
        # All actor traffic reaches atunnel over mTLS CONNECT.
        backendTunnel:
          proxy:
            backend: /dynamic
          mode: connect
          policies:
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/podidentity.podcert.ate.dev/trust-bundle.pem
              insecureHost: true

    routes:
    - name: substrate-actors
      gateways:
      - http
      - https
      matches:
      - path:
          pathPrefix: /
      policies:
        substrateIngress:
          host: api.ate-system.svc:443
          # AgentGateway only uses atunnel's CONNECT listener.
          connectTargetPort: 8443
          policies:
            backendTLS:
              cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
              root: /run/servicedns-ca/trust-bundle.pem
      backends:
      - backend: /dynamic

    # Terminate client CONNECT before internal HTTP routing.
    binds:
    - port: 8081
      tunnelProtocol: connect
      listeners:
      - protocol: HTTP
        routes: []
    - port: 8444
      tunnelProtocol: connect
      listeners:
      - protocol: HTTPS
        tls:
          cert: /run/servicedns.podcert.ate.dev/credential-bundle.pem
          key: /run/servicedns.podcert.ate.dev/credential-bundle.pem
        routes: []
    - mode: internal
      listeners:
      - protocol: HTTP
        routes:
        - name: substrate-actors-tunneled
          matches:
          - path:
              pathPrefix: /
          policies:
            substrateIngress:
              host: api.ate-system.svc:443
              connectTargetPort: 8443
              policies:
                backendTLS:
                  cert: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  key: /run/podidentity.podcert.ate.dev/credential-bundle.pem
                  root: /run/servicedns-ca/trust-bundle.pem
          backends:
          - backend: /dynamic
kind: ConfigMap
metadata:
  name: atenet-router-agentgateway-config
  namespace: ate-system

---
# ate-api-server non-secret env, injected via the optional
# ate-api-server-envvars envFrom source (matches ate-setup's
# steps/apienv.go: ATE_API_POSTGRES_READ_WRITE_ROLE, ATE_API_POSTGRES_OWNER_ROLE,
# ATE_API_ACTOR_JWT_ISSUER). Actor JWTs are minted by MintActorJWT and signed
# from the actor-id-jwt-pool secret; the issuer is the iss claim that relying
# parties discover via <issuer>/.well-known/openid-configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-server-envvars
  namespace: ate-system
data:
  ATE_API_POSTGRES_READ_WRITE_ROLE: {{ .Values.postgres.readWriteRole | quote }}
  ATE_API_POSTGRES_OWNER_ROLE: {{ .Values.postgres.ownerRole | quote }}
  ATE_API_ACTOR_JWT_ISSUER: {{ .Values.ateapi.actorJwtIssuer | quote }}

---
# ate-api-server OIDC authentication config (ate-setup's
# `create api-authentication-config` step, ported to the chart).
# In-cluster issuer (talos, kind, self-hosted): not publicly discoverable, so
# discovery completes with the pod's own projected service-account CA+token.
# A GKE/external issuer (ateapi.authentication.issuer override) needs neither.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-authentication
  namespace: ate-system
data:
  authentication.yaml: |
    actorIdentityJWTProvider: kubernetes
    jwtProviders:
    - name: kubernetes
      issuer: {{ .Values.ateapi.authentication.issuer }}
      audiences: [api.ate-system.svc]
      {{- if or (eq .Values.ateapi.authentication.issuer "https://kubernetes.default.svc") .Values.ateapi.authentication.inClusterDiscovery }}
      certificateAuthorityFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      discoveryTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      {{- end }}
