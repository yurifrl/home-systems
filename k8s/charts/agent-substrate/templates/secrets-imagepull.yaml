# Pull credentials for nodes that need auth to a private registry (kind has
# no node IAM): a dockerconfigjson Secret in every namespace that runs
# mirrored images. Created only when registry.password is set (pass a registry
# token at install time; never persist it in values). With the default public
# ghcr images none of this is used.
{{- if .Values.registry.password }}
{{- $auth := printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc }}
{{- $cfg := dict "auths" (dict .Values.registry.server (dict "auth" $auth)) }}
apiVersion: v1
kind: Secret
metadata:
  name: ate-registry
  namespace: ate-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | toJson | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ate-registry
  namespace: otel-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | toJson | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ate-registry
  namespace: podcertificate-controller-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | toJson | b64enc }}
{{- end }}
