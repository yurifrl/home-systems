# Private-registry pull credentials for the kind profile: kind nodes have no
# node IAM role, so ECR pulls need a dockerconfigjson Secret in every
# namespace that runs mirrored images. Created only when registry.password is
# set (pass a 12h ECR token at install time; never persist it in values).
# EKS ignores all of this: node IAM authenticates and imagePullSecrets is [].
{{- if .Values.registry.password }}
{{- $auth := printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc }}
{{- $cfg := dict "auths" (dict .Values.registry.server (dict "auth" $auth)) }}
apiVersion: v1
kind: Secret
metadata:
  name: ate-registry
  namespace: ate-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | toJson | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ate-registry
  namespace: otel-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | toJson | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ate-registry
  namespace: podcertificate-controller-system
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $cfg | toJson | b64enc }}
{{- end }}
