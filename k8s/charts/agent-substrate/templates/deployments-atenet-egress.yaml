# atenet-egress: the substrate egress gateway. atenet-router forwards actor
# CONNECT traffic here (--default-egress-gateway-address=
# atenet-egress.ate-system.svc:443); the gateway terminates atunnel CONNECT
# (client certs from actor-id-ca-certs) and dials destinations, resolving
# actors via api.ate-system.svc with its own podidentity cert.
#
# Pairs with the 16ccb13 agentgateway digest: the internal dynamicCa bind
# mints MITM leaves signed by the egress-mitm-ca-pool secret (created once
# per cluster, like actor-id-ca-pool), while the front door serves TLS with
# the pod's servicedns certificate and trusts actor clients from
# actor-id-ca-certs.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: atenet-egress
  name: atenet-egress
  namespace: ate-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: atenet-egress
  name: atenet-egress
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-egress
  template:
    metadata:
      labels:
        app: atenet-egress
    spec:
      containers:
      - args:
        - -f
        - /etc/agentgateway/config.yaml
        env:
        - name: RUST_LOG
          value: debug
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: "{{ .Values.images.agentgatewayEgress.repository }}:{{ .Values.images.agentgatewayEgress.tag }}"
        name: agentgateway
        ports:
        - containerPort: 8443
          name: https
        - containerPort: 15021
          name: readiness
        - containerPort: 15020
          name: stats
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: readiness
          periodSeconds: 10
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz/ready
            port: readiness
          periodSeconds: 1
        volumeMounts:
        - mountPath: /etc/agentgateway
          name: config
          readOnly: true
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/actor-id-ca-certs
          name: actor-id-ca-certs
          readOnly: true
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
          readOnly: true
        - mountPath: /run/servicedns-ca
          name: servicedns-ca
          readOnly: true
        - mountPath: /run/egress-mitm
          name: egress-mitm
          readOnly: true
      securityContext:
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      serviceAccountName: atenet-egress
      nodeSelector:
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      volumes:
      - configMap:
          name: atenet-egress-agentgateway-substrate-config
        name: config
      - emptyDir: {}
        name: drain-signal
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
      - name: actor-id-ca-certs
        secret:
          secretName: actor-id-ca-certs
      - name: servicedns-ca
        projected:
          sources:
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: egress-mitm
        secret:
          secretName: egress-mitm-ca-pool
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
