{{- if .Values.storage.rustfs.enabled }}
# In-cluster S3-compatible object store (rustfs) with a static-credential
# bootstrap Job, ported from substrate's kind overlay. Enable only for local
# clusters; on AWS the node/pod IAM identity provides S3 access instead.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: ate-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.rustfs.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: ate-system
spec:
  selector:
    app: rustfs
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      nodeSelector:
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: rustfs
        image: {{ .Values.images.rustfs.repository }}:{{ .Values.images.rustfs.tag }}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: RUSTFS_ADDRESS
          value: ":9000"
        - name: RUSTFS_CONSOLE_ADDRESS
          value: ":9001"
        - name: RUSTFS_CONSOLE_ENABLE
          value: "true"
        - name: RUSTFS_VOLUMES
          value: "/data"
        - name: RUSTFS_ACCESS_KEY
          value: {{ .Values.storage.rustfs.accessKey | quote }}
        - name: RUSTFS_SECRET_KEY
          value: {{ .Values.storage.rustfs.secretKey | quote }}
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: rustfs-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  namespace: ate-system
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: create-bucket
        image: {{ .Values.images.awscli.repository }}:{{ .Values.images.awscli.tag }}
        env:
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.storage.rustfs.accessKey | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.storage.rustfs.secretKey | quote }}
        - name: AWS_REGION
          value: {{ .Values.storage.rustfs.region | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ .Values.storage.rustfs.endpoint | quote }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          for i in $(seq 1 60); do
            if aws s3api head-bucket --bucket ate-snapshots 2>/dev/null; then
              echo "bucket ate-snapshots already exists"
              exit 0
            fi
            if aws s3api create-bucket --bucket ate-snapshots 2>/dev/null; then
              echo "bucket ate-snapshots created"
              exit 0
            fi
            echo "waiting for rustfs to become available... ($i/60)"
            sleep 2
          done
          echo "timed out waiting for rustfs"
          exit 1
{{- end }}
