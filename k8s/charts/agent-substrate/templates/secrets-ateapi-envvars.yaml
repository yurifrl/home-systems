{{- if .Values.postgres.bundled }}
# ate-api-server's PostgreSQL config, injected via the optional
# ate-api-server-secret-envvars envFrom source (matches ate-setup's
# steps/apienv.go buildAPIServerEnvVars). The DSN is upstream's
# DefaultPostgresConnectionString: mutual TLS against the podcert projected
# volumes the deployment already mounts (server hba is hostssl ...
# clientcert=verify-ca, so sslmode=disable cannot connect).
{{- $dsn := .Values.postgres.connectionString -}}
{{- if not $dsn }}
{{- $dsn = "postgresql://postgres@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/podidentity.podcert.ate.dev/credential-bundle.pem&sslkey=/run/podidentity.podcert.ate.dev/credential-bundle.pem" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ate-api-server-secret-envvars
  namespace: ate-system
type: Opaque
stringData:
  ATE_API_POSTGRES_CONNECTION_STRING: {{ $dsn | quote }}
  ATE_API_POSTGRES_SCHEMA: {{ .Values.postgres.schema | quote }}
{{- end }}
