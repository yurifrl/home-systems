{{- if .Values.postgres.bundled }}
# ate-api-server's PostgreSQL config, injected via the optional
# ate-api-server-secret-envvars envFrom source (matches ate-setup's
# steps/apienv.go buildAPIServerEnvVars at 16ccb13). Bundled installs use
# passwordless per-user mTLS: each DSN authenticates as its certificate's CN
# (the bundled server's hba maps hostssl cert logins by CN). The login
# certificates come from the deployment's postgres projected volume; the
# sslrootcert is the servicedns signer's cluster trust bundle, matching
# ate-setup's bundledPostgresDSN.
{{- $readWriteDSN := .Values.postgres.connectionString -}}
{{- $ownerDSN := .Values.postgres.connectionString -}}
{{- if not $readWriteDSN }}
{{- $readWriteDSN = "postgresql://substrate_readwrite_user@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem&sslkey=/run/postgres.podcert.ate.dev/substrate_readwrite_user.pem" -}}
{{- $ownerDSN = "postgresql://substrate_owner_user@postgres.ate-system.svc:5432/atepg?sslmode=verify-full&sslrootcert=/run/servicedns.podcert.ate.dev/trust-bundle.pem&sslcert=/run/postgres.podcert.ate.dev/substrate_owner_user.pem&sslkey=/run/postgres.podcert.ate.dev/substrate_owner_user.pem" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: ate-api-server-secret-envvars
  namespace: ate-system
type: Opaque
stringData:
  ATE_API_POSTGRES_READ_WRITE_CONNECTION_STRING: {{ $readWriteDSN | quote }}
  ATE_API_POSTGRES_OWNER_CONNECTION_STRING: {{ $ownerDSN | quote }}
  ATE_API_POSTGRES_SCHEMA: {{ .Values.postgres.schema | quote }}
{{- end }}
