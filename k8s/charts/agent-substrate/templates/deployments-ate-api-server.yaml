apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ate-api-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: ate-api-server
    spec:
      initContainers:
      # 16ccb13: the control snapshot plugin deletes and copies external
      # snapshots for ate-api-server over a Unix socket in a pod-local
      # emptyDir. A native sidecar starts before ate-api-server and stops
      # after it; ate-api-server starts only once the startup probe sees the
      # plugin serving (the image has no shell, so the binary checks itself).
      - name: snapshot-plugin
        image: {{ .Values.images.snapshotPlugin.repository }}:{{ .Values.images.snapshotPlugin.tag }}
        restartPolicy: Always
        args:
        - control
        - --socket=/run/snapshot-plugin/control.sock
        {{- if .Values.storage.rustfs.enabled }}
        # Local-cluster object store (see rustfs.yaml): static creds instead of IRSA.
        env:
        - name: ATE_STORAGE_BACKEND
          value: {{ .Values.storage.backend }}
        - name: AWS_ACCESS_KEY_ID
          value: {{ .Values.storage.rustfs.accessKey | quote }}
        - name: AWS_SECRET_ACCESS_KEY
          value: {{ .Values.storage.rustfs.secretKey | quote }}
        - name: AWS_REGION
          value: {{ .Values.storage.rustfs.region | quote }}
        - name: AWS_ENDPOINT_URL
          value: {{ .Values.storage.rustfs.endpoint | quote }}
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        {{- end }}
        startupProbe:
          exec:
            command:
            - /ko-app/snapshot-plugin
            - healthcheck
            - --socket=/run/snapshot-plugin/control.sock
          failureThreshold: 60
          periodSeconds: 5
        volumeMounts:
        - name: snapshot-plugin
          mountPath: /run/snapshot-plugin
      containers:
      - args:
        - --grpc-server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --authentication-config=/etc/ateapi/authentication/authentication.yaml
        - --postgres-read-write-connection-string=@env
        - --postgres-owner-connection-string=@env
        - --postgres-read-write-role=@env
        - --postgres-owner-role=@env
        - --postgres-schema=@env
        - --actor-jwt-issuer=@env
        - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
        - --actor-id-ca-pool=/run/actor-id-ca-pool/pool.json
        - --atelet-client-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --pod-identity-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --default-egress-gateway-address=atenet-egress.ate-system.svc:443
        - --snapshot-plugin-socket=/run/snapshot-plugin/control.sock
        - --drain-delay=13s
        - --drain-timeout=15s
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        - configMapRef:
            name: ate-api-server-envvars
            optional: true
        - secretRef:
            name: ate-api-server-secret-envvars
            optional: true
        image: {{ .Values.images.ateapi.repository }}:{{ .Values.images.ateapi.tag }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 10
        name: ate-api-server
        ports:
        - containerPort: 443
        - containerPort: 9090
          name: prometheus
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 2
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /healthz
            port: 9090
          periodSeconds: 5
        volumeMounts:
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        # 16ccb13: separate owner and read/write login certificates; each
        # login is its certificate's CN, matching the bundled server's hba.
        - mountPath: /run/postgres.podcert.ate.dev
          name: postgres
          readOnly: true
        - mountPath: /run/actor-id-jwt-pool
          name: actor-id-jwt-pool
        - mountPath: /run/actor-id-ca-pool
          name: actor-id-ca-pool
          readOnly: true
        - mountPath: /run/snapshot-plugin
          name: snapshot-plugin
        - mountPath: /etc/ateapi/authentication
          name: authentication-config
          readOnly: true
        - mountPath: /run/postgres-server-ca
          name: postgres-server-ca
          readOnly: true
      serviceAccountName: ate-api-server
      nodeSelector:
        {{- include "agent-substrate.nodeSelector" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 40
      volumes:
      # Pod-local socket dir the control snapshot-plugin sidecar serves and
      # ate-api-server dials (snapshot-plugin-socket).
      - name: snapshot-plugin
        emptyDir: {}
      - name: postgres
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: substrate_owner_user.pem
              keyType: ECDSAP256
              signerName: postgres.podcert.ate.dev/identity
              userAnnotations:
                postgres.podcert.ate.dev/username: substrate_owner_user
          - podCertificate:
              credentialBundlePath: substrate_readwrite_user.pem
              keyType: ECDSAP256
              signerName: postgres.podcert.ate.dev/identity
              userAnnotations:
                postgres.podcert.ate.dev/username: substrate_readwrite_user
      - name: servicedns
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: servicedns.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: servicedns.podcert.ate.dev/identity
      - name: podidentity
        projected:
          sources:
          - podCertificate:
              credentialBundlePath: credential-bundle.pem
              keyType: ECDSAP256
              signerName: podidentity.podcert.ate.dev/identity
          - clusterTrustBundle:
              labelSelector:
                matchLabels:
                  podcert.ate.dev/canarying: live
              path: trust-bundle.pem
              signerName: podidentity.podcert.ate.dev/identity
      - name: actor-id-jwt-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-jwt-pool
      - name: actor-id-ca-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-ca-pool
      - configMap:
          name: ate-api-authentication
        name: authentication-config
      - name: postgres-server-ca
        secret:
          optional: true
          secretName: postgres-server-ca
