{{- if .Values.workloadIdentity.enabled }}
{{- $pc := .Values.providerConfig.name }}
{{- $dp := .Values.deletionPolicy }}
{{- $wi := .Values.workloadIdentity }}
apiVersion: iam.gcp.upbound.io/v1beta1
kind: WorkloadIdentityPool
metadata:
  name: {{ $wi.poolId }}
  annotations:
    crossplane.io/external-name: {{ required "workloadIdentity.poolId required" $wi.poolId | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    {{- with $wi.poolDisplayName }}
    displayName: {{ . | quote }}
    {{- end }}
    {{- with $wi.poolDescription }}
    description: {{ . | quote }}
    {{- end }}
{{- if $wi.providerId }}
---
{{- /* Storage version is v1beta1, whose schema types `oidc` as an array.
       The upbound conversion webhook cannot reshape the v1beta2 map into
       that array, so any v1beta2 render is rejected on dry-run apply
       ("expected list, got &{}"). Render v1beta1 with oidc as a one-element
       list instead. */ -}}
apiVersion: iam.gcp.upbound.io/v1beta1
kind: WorkloadIdentityPoolProvider
metadata:
  name: {{ $wi.providerId }}
  annotations:
    crossplane.io/external-name: {{ $wi.providerId | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    workloadIdentityPoolIdRef:
      name: {{ $wi.poolId }}
    {{- with $wi.attributeMapping }}
    attributeMapping:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $wi.attributeCondition }}
    attributeCondition: {{ . | quote }}
    {{- end }}
    {{- with $wi.oidc }}
    oidc:
      {{- toYaml (list .) | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
