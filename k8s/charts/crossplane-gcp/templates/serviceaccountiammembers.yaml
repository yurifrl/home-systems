{{- $pc := .Values.providerConfig.name }}
{{- $dp := .Values.deletionPolicy }}
{{- range .Values.serviceAccountIAMMembers }}
---
# Grants `member` a role ON a service account (resource-level IAM), e.g. letting
# a GitHub Workload Identity principalSet impersonate a deployer SA.
apiVersion: cloudplatform.gcp.upbound.io/v1beta2
kind: ServiceAccountIAMMember
metadata:
  name: {{ .name }}
spec:
  deletionPolicy: {{ .deletionPolicy | default $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    {{- if .serviceAccountRef }}
    serviceAccountIdRef:
      name: {{ .serviceAccountRef }}
    {{- else }}
    serviceAccountId: {{ required "serviceAccountIAMMembers[].serviceAccountId or serviceAccountRef required" .serviceAccountId | quote }}
    {{- end }}
    role: {{ required "serviceAccountIAMMembers[].role required" .role | quote }}
    member: {{ required "serviceAccountIAMMembers[].member required" .member | quote }}
{{- end }}
