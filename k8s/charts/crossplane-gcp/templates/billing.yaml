{{- /*
  Spot spending system for the GCP billing account.

  Flow:
    Budget (per bucket, label-filtered, alert-only) --thresholds-->
      Pub/Sub topic  --> Cloud Function billing-discord --> Discord   [notify]
                     --> Cloud Function billing-killswitch --> detach billing [HARD STOP]
                     --> Subscription --> in-cluster exporter --> Prometheus

  NOTE: the upbound GCP provider has NO native Budget resource, so Budgets are
  gated behind billing.budgetsEnabled (off) pending provider-terraform. The topic,
  functions, Secret Manager and IAM below are native v1beta2 managed resources.
  Kill switch DETACHES billing project-wide (destructive); dryRun guards it.
*/ -}}
{{- if .Values.billing.enabled }}
{{- $pc := .Values.providerConfig.name }}
{{- $dp := .Values.deletionPolicy }}
{{- $b := .Values.billing }}
{{- $proj := $b.projectNumber }}
{{- $topicPath := printf "projects/%s/topics/%s" .Values.providerConfig.projectID $b.topic }}
---
apiVersion: pubsub.gcp.upbound.io/v1beta2
kind: Topic
metadata:
  name: {{ $b.topic }}
  annotations:
    crossplane.io/external-name: {{ $b.topic | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ .Values.providerConfig.projectID | quote }}
{{- with $b.budgetServiceAgent }}
---
# Cloud Billing budgets service agent must publish to the topic or notifications
# silently fail to deliver.
apiVersion: pubsub.gcp.upbound.io/v1beta2
kind: TopicIAMMember
metadata:
  name: {{ $b.topic }}-budgets-publisher
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    topicRef:
      name: {{ $b.topic }}
    role: roles/pubsub.publisher
    member: "serviceAccount:{{ . }}"
{{- end }}
{{- range $b.budgets }}
{{- if $b.budgetsEnabled }}
---
# Budget requires provider-terraform (no native CRD). Rendered only when enabled.
apiVersion: billingbudgets.gcp.upbound.io/v1beta1
kind: Budget
metadata:
  name: budget-{{ .name }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    billingAccount: {{ $b.billingAccount | quote }}
    displayName: {{ printf "%s (%s %v)" .name $b.currency .amount | quote }}
    amount:
      - specifiedAmount:
          - currencyCode: {{ $b.currency | quote }}
            units: {{ .amount | quote }}
    budgetFilter:
      - projects:
          - {{ printf "projects/%s" $proj | quote }}
        labels:
          budget: {{ .label | quote }}
    thresholdRules:
      {{- range (.thresholds | default (list 0.5 0.9 1.0)) }}
      - thresholdPercent: {{ . }}
      {{- end }}
    allUpdatesRule:
      - pubsubTopic: {{ $topicPath | quote }}
        schemaVersion: "1.0"
{{- end }}
{{- end }}
{{- with $b.discordSecret }}
---
# Discord webhook synced from 1Password into a k8s Secret, which feeds the
# SecretVersion below (so the URL never lands in git).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .k8sSecretName }}
  namespace: {{ .k8sSecretNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .k8sSecretName }}
  data:
    - secretKey: {{ .k8sSecretKey }}
      remoteRef:
        key: {{ required "discordSecret.onepasswordKey required" .onepasswordKey }}
        property: {{ .k8sSecretKey }}
---
apiVersion: secretmanager.gcp.upbound.io/v1beta2
kind: Secret
metadata:
  name: {{ .name }}
  annotations:
    crossplane.io/external-name: {{ .name | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    replication:
      auto: {}
---
apiVersion: secretmanager.gcp.upbound.io/v1beta1
kind: SecretVersion
metadata:
  name: {{ .name }}-version
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    secretRef:
      name: {{ .name }}
    secretDataSecretRef:
      namespace: {{ .k8sSecretNamespace }}
      name: {{ .k8sSecretName }}
      key: {{ .k8sSecretKey }}
{{- end }}
{{- if $b.function.enabled }}
{{- $f := $b.function }}
---
# Independent Discord alerter: Gen2 Cloud Function triggered by the topic. Runs
# in GCP, so it fires even when the cluster is down.
apiVersion: cloudfunctions2.gcp.upbound.io/v1beta2
kind: Function
metadata:
  name: {{ $f.name }}
  annotations:
    crossplane.io/external-name: {{ $f.name | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    location: {{ $f.region | quote }}
    buildConfig:
      runtime: {{ $f.runtime | quote }}
      entryPoint: {{ $f.entryPoint | quote }}
      source:
        storageSource:
          bucket: {{ required "billing.function.sourceBucket required" $f.sourceBucket | quote }}
          object: {{ $f.sourceObject | quote }}
    serviceConfig:
      availableMemory: 256M
      timeoutSeconds: 60
      serviceAccountEmail: {{ required "billing.function.runtimeServiceAccount required" $f.runtimeServiceAccount | quote }}
      secretEnvironmentVariables:
        - key: DISCORD_WEBHOOK_URL
          projectId: {{ $.Values.providerConfig.projectID | quote }}
          secret: {{ $b.discordSecret.name | quote }}
          version: latest
    eventTrigger:
      eventType: google.cloud.pubsub.topic.v1.messagePublished
      pubsubTopic: {{ $topicPath | quote }}
      triggerRegion: {{ $f.region | quote }}
      retryPolicy: RETRY_POLICY_RETRY
---
apiVersion: secretmanager.gcp.upbound.io/v1beta2
kind: SecretIAMMember
metadata:
  name: {{ $b.discordSecret.name }}-fn-accessor
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    secretIdRef:
      name: {{ $b.discordSecret.name }}
    role: roles/secretmanager.secretAccessor
    member: "serviceAccount:{{ $f.runtimeServiceAccount }}"
{{- end }}
{{- if $b.killSwitch.enabled }}
{{- $k := $b.killSwitch }}
---
# KILL SWITCH: same topic trigger, at KILL_RATIO it DETACHES billing from the
# whole project (GCP's only hard stop). dryRun=true alerts without detaching.
apiVersion: cloudfunctions2.gcp.upbound.io/v1beta2
kind: Function
metadata:
  name: {{ $k.name }}
  annotations:
    crossplane.io/external-name: {{ $k.name | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    location: {{ $k.region | quote }}
    buildConfig:
      runtime: {{ $k.runtime | quote }}
      entryPoint: {{ $k.entryPoint | quote }}
      source:
        storageSource:
          bucket: {{ required "billing.killSwitch.sourceBucket required" $k.sourceBucket | quote }}
          object: {{ $k.sourceObject | quote }}
    serviceConfig:
      availableMemory: 256M
      timeoutSeconds: 120
      serviceAccountEmail: {{ required "billing.killSwitch.runtimeServiceAccount required" $k.runtimeServiceAccount | quote }}
      environmentVariables:
        PROJECT_ID: {{ $.Values.providerConfig.projectID | quote }}
        KILL_RATIO: {{ $k.ratio | default 1.0 | quote }}
        KILL_DRY_RUN: {{ $k.dryRun | default true | quote }}
      secretEnvironmentVariables:
        - key: DISCORD_WEBHOOK_URL
          projectId: {{ $.Values.providerConfig.projectID | quote }}
          secret: {{ $b.discordSecret.name | quote }}
          version: latest
    eventTrigger:
      eventType: google.cloud.pubsub.topic.v1.messagePublished
      pubsubTopic: {{ $topicPath | quote }}
      triggerRegion: {{ $k.region | quote }}
      retryPolicy: RETRY_POLICY_DO_NOT_RETRY
---
apiVersion: secretmanager.gcp.upbound.io/v1beta2
kind: SecretIAMMember
metadata:
  name: {{ $b.discordSecret.name }}-killswitch-accessor
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    secretIdRef:
      name: {{ $b.discordSecret.name }}
    role: roles/secretmanager.secretAccessor
    member: "serviceAccount:{{ $k.runtimeServiceAccount }}"
---
# Lets the kill switch detach the project's billing account.
apiVersion: cloudplatform.gcp.upbound.io/v1beta2
kind: ProjectIAMMember
metadata:
  name: billing-killswitch-project-manager
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    role: roles/billing.projectManager
    member: "serviceAccount:{{ $k.runtimeServiceAccount }}"
{{- end }}
{{- if $b.exporter.enabled }}
---
# Pull subscription the in-cluster exporter consumes to expose cost as a
# Prometheus gauge (see support-cluster monitoring/billing.yaml).
apiVersion: pubsub.gcp.upbound.io/v1beta2
kind: Subscription
metadata:
  name: {{ $b.exporter.subscription }}
  annotations:
    crossplane.io/external-name: {{ $b.exporter.subscription | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ .Values.providerConfig.projectID | quote }}
    topicRef:
      name: {{ $b.topic }}
    ackDeadlineSeconds: 20
    expirationPolicy:
      ttl: ""
{{- with $b.exporter.subscriberServiceAccount }}
---
apiVersion: pubsub.gcp.upbound.io/v1beta2
kind: SubscriptionIAMMember
metadata:
  name: {{ $b.exporter.subscription }}-subscriber
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    subscriptionRef:
      name: {{ $b.exporter.subscription }}
    role: roles/pubsub.subscriber
    member: "serviceAccount:{{ . }}"
{{- end }}
{{- end }}
{{- end }}
