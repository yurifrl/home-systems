{{- /*
  Spot spending system for the GCP billing account.

  Flow:
    Budget (per bucket, label-filtered, alert-only) --thresholds-->
      Pub/Sub topic  --> Cloud Function (Gen2) --> Discord webhook   [independent]
                     --> Subscription --> in-cluster exporter        [Prometheus]

  IMPORTANT / honest caveats:
  - GCP budgets NEVER hard-cap spend. They only publish threshold notifications.
  - A label-scoped budget only counts spend from resources carrying that label
    (buckets get labels.budget via templates/buckets.yaml).
  - Upjet singleton blocks are rendered as single-item lists (amount,
    budgetFilter, allUpdatesRule, specifiedAmount). Validate field shapes and
    CRD plurals against the INSTALLED CRDs before trusting reconciliation:
      kubectl get mrds | grep -E 'billingbudgets|pubsub|cloudfunctions2|secretmanager'
  - The crossplane SA needs roles/billing.costsManager on the billing account,
    and the billing-budgets service agent needs pubsub.publisher on the topic
    (granted below). These are billing-account-level and enabled out of band.
*/ -}}
{{- if .Values.billing.enabled }}
{{- $pc := .Values.providerConfig.name }}
{{- $dp := .Values.deletionPolicy }}
{{- $b := .Values.billing }}
{{- $proj := $b.projectNumber }}
{{- $topicPath := printf "projects/%s/topics/%s" .Values.providerConfig.projectID $b.topic }}
---
# Pub/Sub topic every budget publishes threshold updates to.
apiVersion: pubsub.gcp.upbound.io/v1beta1
kind: Topic
metadata:
  name: {{ $b.topic }}
  annotations:
    crossplane.io/external-name: {{ $b.topic | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ .Values.providerConfig.projectID | quote }}
{{- with $b.budgetServiceAgent }}
---
# Allow the Cloud Billing Budgets service agent to publish to the topic. Without
# this the budget silently fails to deliver notifications.
apiVersion: pubsub.gcp.upbound.io/v1beta1
kind: TopicIAMMember
metadata:
  name: {{ $b.topic }}-budgets-publisher
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    topicRef:
      name: {{ $b.topic }}
    role: roles/pubsub.publisher
    member: "serviceAccount:{{ . }}"
{{- end }}
{{- range $b.budgets }}
{{- if $b.budgetsEnabled }}
---
# {{ .name }}: {{ $b.currency }} {{ .amount }} alert-only budget, scoped to
# resources labelled budget={{ .label }}.
apiVersion: billingbudgets.gcp.upbound.io/v1beta1
kind: Budget
metadata:
  name: budget-{{ .name }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    billingAccount: {{ required "billing.billingAccount required" $b.billingAccount | quote }}
    displayName: {{ printf "%s (%s %v)" .name $b.currency .amount | quote }}
    amount:
      - specifiedAmount:
          - currencyCode: {{ $b.currency | quote }}
            units: {{ .amount | quote }}
    budgetFilter:
      - projects:
          - {{ printf "projects/%s" $proj | quote }}
        labels:
          budget: {{ .label | quote }}
    thresholdRules:
      {{- range (.thresholds | default (list 0.5 0.9 1.0)) }}
      - thresholdPercent: {{ . }}
      {{- end }}
    allUpdatesRule:
      - pubsubTopic: {{ $topicPath | quote }}
        schemaVersion: "1.0"
{{- end }}
{{- end }}
{{- with $b.discordSecret }}
---
# Discord webhook synced from 1Password into a k8s Secret, which feeds the
# SecretManagerSecretVersion below (so the URL never lands in git).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .k8sSecretName }}
  namespace: {{ .k8sSecretNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .k8sSecretName }}
  data:
    - secretKey: {{ .k8sSecretKey }}
      remoteRef:
        key: {{ required "discordSecret.onepasswordKey required" .onepasswordKey }}
        property: {{ .k8sSecretKey }}
---
# Discord webhook in Secret Manager, sourced from the k8s Secret above.
apiVersion: secretmanager.gcp.upbound.io/v1beta1
kind: SecretManagerSecret
metadata:
  name: {{ .name }}
  annotations:
    crossplane.io/external-name: {{ .name | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    replication:
      - auto:
          - {}
---
apiVersion: secretmanager.gcp.upbound.io/v1beta1
kind: SecretManagerSecretVersion
metadata:
  name: {{ .name }}-version
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    secretRef:
      name: {{ .name }}
    secretDataSecretRef:
      namespace: {{ .k8sSecretNamespace }}
      name: {{ .k8sSecretName }}
      key: {{ .k8sSecretKey }}
{{- end }}
{{- if $b.function.enabled }}
{{- $f := $b.function }}
---
# Independent Discord alerter: Gen2 Cloud Function triggered by the topic. Lives
# entirely in GCP, so it fires even when the cluster is down.
apiVersion: cloudfunctions2.gcp.upbound.io/v1beta1
kind: Function
metadata:
  name: {{ $f.name }}
  annotations:
    crossplane.io/external-name: {{ $f.name | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    location: {{ $f.region | quote }}
    buildConfig:
      - runtime: {{ $f.runtime | quote }}
        entryPoint: {{ $f.entryPoint | quote }}
        source:
          - storageSource:
              - bucket: {{ required "billing.function.sourceBucket required" $f.sourceBucket | quote }}
                object: {{ $f.sourceObject | quote }}
    serviceConfig:
      - availableMemory: 256M
        timeoutSeconds: 60
        serviceAccountEmail: {{ required "billing.function.runtimeServiceAccount required" $f.runtimeServiceAccount | quote }}
        secretEnvironmentVariables:
          - key: DISCORD_WEBHOOK_URL
            projectId: {{ $.Values.providerConfig.projectID | quote }}
            secret: {{ $b.discordSecret.name | quote }}
            version: latest
    eventTrigger:
      - eventType: google.cloud.pubsub.topic.v1.messagePublished
        pubsubTopic: {{ $topicPath | quote }}
        triggerRegion: {{ $f.region | quote }}
        retryPolicy: RETRY_POLICY_RETRY
---
# Let the function's runtime SA read the Discord webhook secret.
apiVersion: secretmanager.gcp.upbound.io/v1beta1
kind: SecretManagerSecretIAMMember
metadata:
  name: {{ $b.discordSecret.name }}-fn-accessor
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    secretIdRef:
      name: {{ $b.discordSecret.name }}
    role: roles/secretmanager.secretAccessor
    member: "serviceAccount:{{ $f.runtimeServiceAccount }}"
{{- end }}
{{- if $b.killSwitch.enabled }}
{{- $k := $b.killSwitch }}
---
# KILL SWITCH: same topic trigger, but at KILL_RATIO it DETACHES billing from the
# whole project (GCP's only hard stop). dryRun=true alerts without detaching.
apiVersion: cloudfunctions2.gcp.upbound.io/v1beta1
kind: Function
metadata:
  name: {{ $k.name }}
  annotations:
    crossplane.io/external-name: {{ $k.name | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    location: {{ $k.region | quote }}
    buildConfig:
      - runtime: {{ $k.runtime | quote }}
        entryPoint: {{ $k.entryPoint | quote }}
        source:
          - storageSource:
              - bucket: {{ required "billing.killSwitch.sourceBucket required" $k.sourceBucket | quote }}
                object: {{ $k.sourceObject | quote }}
    serviceConfig:
      - availableMemory: 256M
        timeoutSeconds: 120
        serviceAccountEmail: {{ required "billing.killSwitch.runtimeServiceAccount required" $k.runtimeServiceAccount | quote }}
        environmentVariables:
          PROJECT_ID: {{ $.Values.providerConfig.projectID | quote }}
          KILL_RATIO: {{ $k.ratio | default 1.0 | quote }}
          KILL_DRY_RUN: {{ $k.dryRun | default true | quote }}
        secretEnvironmentVariables:
          - key: DISCORD_WEBHOOK_URL
            projectId: {{ $.Values.providerConfig.projectID | quote }}
            secret: {{ $b.discordSecret.name | quote }}
            version: latest
    eventTrigger:
      - eventType: google.cloud.pubsub.topic.v1.messagePublished
        pubsubTopic: {{ $topicPath | quote }}
        triggerRegion: {{ $k.region | quote }}
        retryPolicy: RETRY_POLICY_DO_NOT_RETRY
---
apiVersion: secretmanager.gcp.upbound.io/v1beta1
kind: SecretManagerSecretIAMMember
metadata:
  name: {{ $b.discordSecret.name }}-killswitch-accessor
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    secretIdRef:
      name: {{ $b.discordSecret.name }}
    role: roles/secretmanager.secretAccessor
    member: "serviceAccount:{{ $k.runtimeServiceAccount }}"
---
# Lets the kill switch detach the project's billing account.
apiVersion: cloudplatform.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: billing-killswitch-project-manager
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    role: roles/billing.projectManager
    member: "serviceAccount:{{ $k.runtimeServiceAccount }}"
{{- end }}
{{- if $b.exporter.enabled }}
---
# Pull subscription the in-cluster exporter consumes to expose cost as a
# Prometheus gauge (see support-cluster monitoring/billing.yaml).
apiVersion: pubsub.gcp.upbound.io/v1beta1
kind: Subscription
metadata:
  name: {{ $b.exporter.subscription }}
  annotations:
    crossplane.io/external-name: {{ $b.exporter.subscription | quote }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ .Values.providerConfig.projectID | quote }}
    topicRef:
      name: {{ $b.topic }}
    ackDeadlineSeconds: 20
    expirationPolicy:
      - ttl: ""
{{- with $b.exporter.subscriberServiceAccount }}
---
# Let the in-cluster exporter SA pull from the subscription.
apiVersion: pubsub.gcp.upbound.io/v1beta1
kind: SubscriptionIAMMember
metadata:
  name: {{ $b.exporter.subscription }}-subscriber
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef:
    name: {{ $pc }}
  forProvider:
    project: {{ $.Values.providerConfig.projectID | quote }}
    subscriptionRef:
      name: {{ $b.exporter.subscription }}
    role: roles/pubsub.subscriber
    member: "serviceAccount:{{ . }}"
{{- end }}
{{- end }}
{{- end }}
