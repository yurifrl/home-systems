{{- /*
  Cloudflare records/rules for the assets CDN, reconciled once the API token is
  in the cloudflare-creds secret (ProviderConfig in crossplane-providers).
  Gated on assetsCdn.enabled + a cloudflareZoneId. The DNS record points the
  proxied hostname at the LB's global IP.
*/ -}}
{{- with .Values.assetsCdn }}
{{- if and .enabled .cloudflareZoneId .lbIp }}
{{- $dp := $.Values.deletionPolicy }}
apiVersion: dns.upjet-cloudflare.upbound.io/v1alpha1
kind: Record
metadata:
  name: {{ .name }}
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef: { name: default }
  forProvider:
    zoneId: {{ .cloudflareZoneId | quote }}
    name: {{ .domain | quote }}
    type: A
    content: {{ .lbIp | quote }}
    proxied: true
    ttl: 1
{{- /*
  CAA: assets-bg.syscd.live must authorize the CAs that issue for this exact
  host — pki.goog (Google Trust Services, the LB's Certificate Manager cert) and
  letsencrypt.org (Cloudflare edge). Without a definitive CAA, Google's issuance
  failed with failureReason=CAA (indeterminate lookup => refuse, RFC 8659).

  These are NOT rendered as crossplane Records: provider-cloudflare-dns v0.2.6
  cannot reconcile CAA — upjet mis-serializes Terraform's Dynamic-typed
  data.flags (observe fails "allowed Float64Type/StringType, Received
  ObjectType"). They are created directly against the Cloudflare API instead
  (stable, set-once, survives cert auto-renewal). Reproduce with:

    for CA in pki.goog letsencrypt.org; do
      curl -s -X POST \
        "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
        -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
        --data "{\"type\":\"CAA\",\"name\":\"assets-bg.syscd.live\",\"data\":{\"flags\":0,\"tag\":\"issue\",\"value\":\"$CA\"},\"ttl\":1}"
    done

  Revisit as crossplane Records once the provider fixes Dynamic-field handling.
*/ -}}
{{- if .dnsAuthCname }}
---
# Certificate Manager DNS-authorization validation record. Its target is
# generated by GCP when the DNSAuthorization first reconciles; read it with
#   kubectl get dnsauthorization.certificatemanager.gcp.upbound.io {{ .name }} -o jsonpath='{.status.atProvider.dnsResourceRecord[0].data}'
# then set assetsCdn.dnsAuthCname to that value. Must NOT be proxied.
apiVersion: dns.upjet-cloudflare.upbound.io/v1alpha1
kind: Record
metadata:
  name: {{ .name }}-dns-auth
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef: { name: default }
  forProvider:
    zoneId: {{ .cloudflareZoneId | quote }}
    name: {{ printf "_acme-challenge.%s" .domain | quote }}
    type: CNAME
    content: {{ .dnsAuthCname | quote }}
    proxied: false
    ttl: 1
{{- end }}
{{- if .manageCloudflareRules }}
{{- /*
  Edge protection rulesets, each scoped to `domain` so the rest of the zone is
  untouched. Every phase's zone entrypoint is otherwise empty (only Cloudflare's
  default managed WAF/DDoS rulesets exist). Requires the cloudflare-creds token
  to hold Cache Settings / Zone WAF / Config Settings edit scopes.
*/ -}}
{{- $host := printf "(http.host eq \"%s\")" .domain }}
{{- $countries := list }}{{- range .geoAllowCountries }}{{ $countries = append $countries (printf "\"%s\"" .) }}{{- end }}
---
# Cache the covers at the edge, overriding the origin's `private, max-age=0` so
# repeat views hit Cloudflare's free edge instead of billable GCP CDN egress.
apiVersion: cloudflare.upjet-cloudflare.upbound.io/v1alpha1
kind: Ruleset
metadata:
  name: {{ .name }}-cache
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef: { name: default }
  forProvider:
    zoneId: {{ .cloudflareZoneId | quote }}
    name: {{ printf "%s cache" .name | quote }}
    kind: zone
    phase: http_request_cache_settings
    rules:
      - action: set_cache_settings
        enabled: true
        description: cache assets at edge, override origin private
        expression: {{ $host | quote }}
        actionParameters:
          cache: true
          edgeTtl:
            mode: override_origin
            default: {{ .cacheEdgeTtlSeconds }}
          browserTtl:
            mode: override_origin
            default: {{ .cacheEdgeTtlSeconds }}
---
# Per-IP rate limit (flood protection). cf.colo.id is required for zone rules.
apiVersion: cloudflare.upjet-cloudflare.upbound.io/v1alpha1
kind: Ruleset
metadata:
  name: {{ .name }}-ratelimit
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef: { name: default }
  forProvider:
    zoneId: {{ .cloudflareZoneId | quote }}
    name: {{ printf "%s ratelimit" .name | quote }}
    kind: zone
    phase: http_ratelimit
    rules:
      - action: block
        enabled: true
        description: per-IP rate limit for assets
        expression: {{ $host | quote }}
        ratelimit:
          characteristics: ["ip.src", "cf.colo.id"]
          period: {{ .rateLimit.periodSeconds }}
          requestsPerPeriod: {{ .rateLimit.requestsPerPeriod }}
          mitigationTimeout: {{ .rateLimit.mitigationTimeoutSeconds }}
---
# Geo restriction (allow-list) + high-threat-score block. Uses block, never
# challenge, so non-browser clients (e.g. Obsidian image fetch) still load.
apiVersion: cloudflare.upjet-cloudflare.upbound.io/v1alpha1
kind: Ruleset
metadata:
  name: {{ .name }}-firewall
spec:
  deletionPolicy: {{ $dp }}
  providerConfigRef: { name: default }
  forProvider:
    zoneId: {{ .cloudflareZoneId | quote }}
    name: {{ printf "%s firewall" .name | quote }}
    kind: zone
    phase: http_request_firewall_custom
    rules:
{{- if .geoAllowCountries }}
      - action: block
        enabled: true
        description: geo allow-list for assets
        expression: {{ printf "%s and not ip.geoip.country in {%s}" $host (join " " $countries) | quote }}
{{- end }}
{{- if .threatScoreBlock }}
      - action: block
        enabled: true
        description: block high threat score for assets
        expression: {{ printf "%s and cf.threat_score gt %v" $host .threatScoreBlock | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
