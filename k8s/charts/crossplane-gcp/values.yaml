# --- Billing spend system (budgets -> Pub/Sub -> Cloud Function -> Discord) ---
# Alert-only spot-spending: one budget per bucket, filtered by the bucket's
# `budget` label. Real values (billing account, project number, budgets, SA
# emails) live in the PRIVATE values repo. See templates/billing.yaml for the
# honest caveats (no hard cap; validate upjet field shapes post-install).
billing:
  enabled: false
  billingAccount: ""        # e.g. 000000-XXXXXX-XXXXXX  (secret -> private)
  projectNumber: ""         # e.g. 555680140769           (secret -> private)
  currency: BRL
  # Native Budget CRD does not exist in the upbound GCP provider; keep budgets
  # off until provider-terraform (or another mechanism) is wired in.
  budgetsEnabled: false
  topic: billing-budget-alerts
  # Cloud Billing Budgets service agent, granted pubsub.publisher on the topic.
  budgetServiceAgent: ""    # e.g. billing-budgets@system.gserviceaccount.com
  budgets: []
  #  - name: longhorn
  #    label: longhorn        # must match buckets[].labels.budget
  #    amount: 100
  #    thresholds: [0.5, 0.9, 1.0]
  # Discord webhook stored in Secret Manager, fed from a k8s Secret (ESO).
  discordSecret:
    name: billing-discord-webhook
    k8sSecretName: billing-discord-webhook
    k8sSecretNamespace: crossplane-system
    k8sSecretKey: webhook-url
    onepasswordKey: ""       # 1Password item key holding webhook-url (-> private)
  # Independent Discord alerter (GCP-native, survives cluster outage).
  function:
    enabled: false
    name: billing-discord
    region: us-east1
    runtime: nodejs20
    entryPoint: notify
    sourceBucket: ""         # functions-src bucket externalName (-> private)
    sourceObject: billing-discord/latest.zip
    runtimeServiceAccount: ""
  # In-cluster Prometheus exporter pull subscription.
  exporter:
    enabled: false
    subscription: billing-budget-alerts-exporter
    subscriberServiceAccount: ""   # exporter SA email (-> private)
  # KILL SWITCH: at `ratio` of a budget, detaches billing from the WHOLE project
  # (destructive, project-wide). dryRun=true alerts without detaching.
  killSwitch:
    enabled: false
    name: billing-killswitch
    region: us-east1
    runtime: nodejs20
    entryPoint: killswitch
    sourceBucket: ""
    sourceObject: billing-killswitch/latest.zip
    runtimeServiceAccount: ""
    ratio: 1.0
    dryRun: true

# --- Project services (API enablement) -------------------------------------
projectServices: []
#  - name: iam
#    service: iam.googleapis.com

# --- Workload Identity (GitHub OIDC) ---------------------------------------
workloadIdentity:
  enabled: false
  poolId: ""            # e.g. github-pool   (secret -> private)
  providerId: ""        # e.g. github-provider
