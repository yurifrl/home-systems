name: Mirror ATE images to ghcr

# Build the agent-substrate + ax component images from pinned source commits
# (public repos) with ko, pushing to public ghcr for the home talos cluster.
# Bundled infra images are official upstream references in the charts —
# nothing to copy for them.
# The workflow's own GITHUB_TOKEN (packages: write) is the only credential.
#
# Charts reference the results:
#   ghcr.io/yurifrl/ate/<name>:<short-sha>   (agent-substrate)
#   ghcr.io/yurifrl/ax/<name>:<short-sha>    (ax)
# ko's default namer publishes intermediates as <base>/<name>-<md5(import
# path)>:<tag>; crane copy renames them to the canonical tags. First push creates each package PRIVATE — flip to public
# once (UI) or the cluster needs a pull secret.

on:
  workflow_dispatch:
    inputs:
      substrate_version:
        description: agent-substrate/substrate commit (full SHA; short tag derived)
        required: true
        default: a0b680d72e10e38c55657d9809a1998dfcf6500c
      ax_version:
        description: google/ax commit (full SHA; short tag derived)
        required: true
        default: c5c1ac5b3d66f4b4747825fa4ddb5880b5e1177b

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GHCR: ghcr.io/${{ github.repository_owner }}
      # ax/go.mod requires go >= 1.27.1; setup-ko exports GOTOOLCHAIN=local
      # (overriding this), so the ax build step re-exports auto itself.
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout substrate
        uses: actions/checkout@v7
        with:
          repository: agent-substrate/substrate
          ref: ${{ inputs.substrate_version }}
          path: substrate

      - name: Checkout ax
        uses: actions/checkout@v7
        with:
          repository: google/ax
          ref: ${{ inputs.ax_version }}
          path: ax

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: substrate/go.mod

      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@latest

      - name: Install ko
        uses: ko-build/setup-ko@v0.9

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build substrate images
        env:
          SUBSTRATE_REF: ${{ inputs.substrate_version }}
        run: |
          set -euo pipefail
          ATE="${GHCR}/ate"
          MOD=github.com/agent-substrate/substrate
          TAG="${SUBSTRATE_REF:0:7}"
          for name in ateapi atecontroller atelet podcertcontroller ateom-gvisor snapshot-plugin; do
            (cd substrate && KO_DOCKER_REPO="$ATE" ko build --sbom=none -t "$TAG" "./cmd/$name")
            crane copy "$ATE/$name-$(printf '%s' "$MOD/cmd/$name" | md5sum | cut -d' ' -f1):$TAG" "$ATE/$name:$TAG"
          done

      - name: Build ax images
        env:
          AX_REF: ${{ inputs.ax_version }}
        run: |
          set -euo pipefail
          # setup-ko exports GOTOOLCHAIN=local via GITHUB_ENV, which breaks ax
          # (go.mod requires go >= 1.27.1). A script-level export overrides it.
          export GOTOOLCHAIN=auto
          AX="${GHCR}/ax"
          MOD=github.com/google/ax
          TAG="${AX_REF:0:7}"
          # Upstream ax ships exactly these two binaries (.ko.yaml); the
          # Redis-streams controller was removed on 2026-09-26 (direct
          # execution from ax-server).
          for name in ax-server ax-task-runner; do
            (cd ax && KO_DOCKER_REPO="$AX" ko build --sbom=none -t "$TAG" "./cmd/$name")
            crane copy "$AX/$name-$(printf '%s' "$MOD/cmd/$name" | md5sum | cut -d' ' -f1):$TAG" "$AX/$name:$TAG"
          done

      - name: Verify published images
        env:
          SUBSTRATE_REF: ${{ inputs.substrate_version }}
          AX_REF: ${{ inputs.ax_version }}
        run: |
          set -euo pipefail
          fail=0
          for ref in \
            "ate/ateapi:${SUBSTRATE_REF:0:7}" "ate/atecontroller:${SUBSTRATE_REF:0:7}" \
            "ate/atelet:${SUBSTRATE_REF:0:7}" "ate/podcertcontroller:${SUBSTRATE_REF:0:7}" \
            "ate/ateom-gvisor:${SUBSTRATE_REF:0:7}" \
            "ate/snapshot-plugin:${SUBSTRATE_REF:0:7}" \
            "ax/ax-server:${AX_REF:0:7}" \
            "ax/ax-task-runner:${AX_REF:0:7}"; do
            img="$GHCR/$ref"
            # Index manifests: arch per entry in .manifests[].platform.
            # Single manifests (ko output): arch lives in the config blob.
            archs=$(crane manifest "$img" | jq -r 'if .manifests then [.manifests[].platform.architecture] | unique | join(",") else "" end')
            if [ -z "$archs" ]; then archs=$(crane config "$img" | jq -r .architecture); fi
            case "$archs" in *amd64*) : ;; *) echo "MISSING amd64: $img (archs=$archs)"; fail=1 ;; esac
            echo "ok $img ($archs)"
          done
          exit $fail
