name: Build upstream images to ghcr

# Build the agent-substrate + ax component images from upstream RELEASE TAGS
# (unmodified public sources) with ko, publishing to public ghcr for the home
# talos cluster. This mirrors upstream's own install path: there is no
# official substrate/ax image registry — `ate-setup publish release-images
# --ko-docker-repo REPO` and `make deploy AX_IMAGE_REPO=...` both expect the
# operator to build from a checkout and push to their own registry
# (agent-substrate/substrate#79: publishing builds is deferred upstream).
#
# The workflow's own GITHUB_TOKEN (packages: write) is the only credential.
#
# Charts reference the results (official naming: <registry>/<repo>/<component>):
#   ghcr.io/yurifrl/substrate/<name>:vX.Y.Z   (agent-substrate, substrate's
#                                              `ate-setup publish` layout)
#   ghcr.io/yurifrl/ax/<name>:vX.Y.Z          (ax, `make deploy` layout)
# ko's default namer publishes intermediates as <base>/<name>-<md5(import
# path)>:<tag>; crane copy renames them to the canonical tags. Packages are
# public (flipped once after the first push).
#
# Bump inputs when a new upstream release lands; do not pin raw main commits.

on:
  workflow_dispatch:
    inputs:
      substrate_version:
        description: agent-substrate/substrate release tag (full SHA resolved at checkout)
        required: true
        default: v0.5.0
      ax_version:
        description: google/ax release tag
        required: true
        default: v0.3.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHCR: ghcr.io/${{ github.repository_owner }}
      # ax/go.mod requires go >= 1.27.1; setup-ko exports GOTOOLCHAIN=local
      # (overriding this), so the ax build step re-exports auto itself.
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout substrate
        uses: actions/checkout@v7
        with:
          repository: agent-substrate/substrate
          ref: ${{ inputs.substrate_version }}
          path: substrate

      - name: Checkout ax
        uses: actions/checkout@v7
        with:
          repository: google/ax
          ref: ${{ inputs.ax_version }}
          path: ax

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: substrate/go.mod

      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@latest

      - name: Install ko
        uses: ko-build/setup-ko@v0.9

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Component set = cmd/ate-setup/internal/images/images.go Components at
      # the pinned tag, pruned to what the chart deploys. Naming follows
      # ImageName() = path.Base(pkg): ghcr.io/yurifrl/ate/<name>:<tag>.
      # --platform=linux/amd64: the old proven build produced single-arch
      # images; ko defaults now also build the base image's other platforms,
      # and their digest-tagged index PUTs are what ghcr DENIED (both prior
      # runs failed exactly there). Chart pins arch: amd64 anyway.
      - name: Build substrate images
        env:
          SUBSTRATE_REF: ${{ inputs.substrate_version }}
        run: |
          set -euo pipefail
          SUB="${GHCR}/ate"
          TAG="${SUBSTRATE_REF}"
          for name in ateapi atecontroller atelet atenet podcertcontroller ateom-gvisor objectstore-plugin; do
            (cd substrate && KO_DOCKER_REPO="$SUB" ko build --sbom=none --platform=linux/amd64 -t "$TAG" "./cmd/$name")
          done

      - name: Build ax images
        env:
          AX_REF: ${{ inputs.ax_version }}
        run: |
          set -euo pipefail
          # setup-ko exports GOTOOLCHAIN=local via GITHUB_ENV, which breaks ax
          # (go.mod requires go >= 1.27.1). A script-level export overrides it.
          export GOTOOLCHAIN=auto
          AX="${GHCR}/ax"
          TAG="${AX_REF}"
          # ax-server is a plain ko binary image. The task-runner is NOT:
          # ax's guest command is /usr/local/bin/ax-task-runner (not ko's
          # /ko-app/<name>), and the runner needs git/curl/ssh plus the
          # antigravity agent SDK at runtime — upstream's Dockerfile.task-runner
          # + Makefile build-task-runner assemble exactly that.
          (cd ax && KO_DOCKER_REPO="$AX" ko build --sbom=none --platform=linux/amd64 -t "$TAG" ./cmd/ax-server)
          (cd ax && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/linux_amd64/ax-task-runner ./cmd/ax-task-runner)
          (cd ax && docker build --platform linux/amd64 -t "$AX/ax-task-runner:$TAG" -f Dockerfile.task-runner .)
          docker push "$AX/ax-task-runner:$TAG"

      - name: Verify published images
        env:
          SUBSTRATE_REF: ${{ inputs.substrate_version }}
          AX_REF: ${{ inputs.ax_version }}
        run: |
          set -euo pipefail
          fail=0
          for ref in \
            "ate/ateapi:$SUBSTRATE_REF" "ate/atecontroller:$SUBSTRATE_REF" \
            "ate/atelet:$SUBSTRATE_REF" "ate/atenet:$SUBSTRATE_REF" \
            "ate/podcertcontroller:$SUBSTRATE_REF" \
            "ate/ateom-gvisor:$SUBSTRATE_REF" \
            "ate/objectstore-plugin:$SUBSTRATE_REF" \
            "ax/ax-server:$AX_REF" \
            "ax/ax-task-runner:$AX_REF"; do
            img="$GHCR/$ref"
            # Index manifests: arch per entry in .manifests[].platform.
            # Single manifests (ko output): arch lives in the config blob.
            archs=$(crane manifest "$img" | jq -r 'if .manifests then [.manifests[].platform.architecture] | unique | join(",") else "" end')
            if [ -z "$archs" ]; then archs=$(crane config "$img" | jq -r .architecture); fi
            case "$archs" in *amd64*) : ;; *) echo "MISSING amd64: $img (archs=$archs)"; fail=1 ;; esac
            echo "ok $img ($archs)"
          done
          exit $fail
