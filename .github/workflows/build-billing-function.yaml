name: Build Billing Functions

# Zips each Gen2 Cloud Function under functions/ and uploads it to the
# functions-src GCS bucket. Crossplane's cloudfunctions2.Function resources
# reference these objects (billing.function.sourceObject /
# billing.killSwitch.sourceObject). Auth is Workload Identity Federation — the
# WIF pool's attributeCondition must allow this repo (see gcp/values.yaml).
#
# NOTE: the Functions reference stable object names (latest.zip), so a code
# change re-uploads the object but does NOT auto-redeploy (the Crossplane spec
# string is unchanged). Bump the sourceObject to a versioned key to force one.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/build-billing-function.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
  SRC_BUCKET: ${{ vars.GCP_FUNCTIONS_SRC_BUCKET }}

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Zip and upload each function
        run: |
          for dir in functions/*/; do
            fn=$(basename "$dir")
            (cd "$dir" && zip -r "/tmp/$fn.zip" . -x '*.git*')
            gcloud storage cp "/tmp/$fn.zip" "gs://${SRC_BUCKET}/$fn/latest.zip"
          done
