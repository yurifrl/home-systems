# to apply this, you need to be on argo machine, make sure this is in the correct path, git pull

# and run
# sudo systemctl restart secret-loader
# sudo systemctl status secret-loader
# sudo journalctl -u secret-loader -f 
#
# sudo systemctl status argo-setup
# sudo systemctl restart argo-setup & sudo journalctl -u argo-setup.service -f 
#
# helm repo add argo-cd https://argoproj.github.io/argo-helm; helm repo update
# helm upgrade -n argocd --install argocd argo-cd/argo-cd -f k8s/values/argo.yaml --wait
global:
  addPrometheusAnnotations: true
  priorityClassName: platform-critical

controller:
  replicas: 1
  # controller<->repo gRPC over a flaky cross-node hop drops mid-stream and
  # aborts cluster sync (see pc01 VXLAN + 2026-07-05 postmortems). The controller
  # schedules freely; repoServer co-locates onto its node via podAffinity so the
  # gRPC stays on loopback -- no hardcoded node, so a node outage can't strand
  # ArgoCD (2026-08-01: macintel01 down stranded the whole control plane).
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  # Default readinessProbe (timeoutSeconds: 1) causes the application-controller
  # to be marked NotReady when reconciling many apps at once. Combined with
  # frequent SandboxChanged events, the pod CrashLoopBackOffs and silently
  # blocks every cluster sync. Relaxed values prevent that.
  # See: 2026-06-04 incident where this masked the longhorn upgrade for 22h.
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5

dex:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

redis:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

server:
  ingress:
    enabled: false
  insecure: true
  # HPA targets memory utilization; without a memory request it can't compute
  # replicas and Argo marks the HPA (and the app) Degraded.
  resources:
    requests:
      memory: 128Mi
  configs:
    params:
      server.insecure: true
      exec.enabled: true
      server.disable.auth: true
  autoscaling:
    enabled: true
    minReplicas: 1
  extraArgs:
    - --insecure
    - --disable-auth
   
  admin:
    enabled: true
    passwordSecret:
      name: argocd-secret
      key: admin.password

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

repoServer:
  replicas: 1
  # HPA targets memory utilization; without a memory request it can't compute
  # replicas and Argo marks the HPA (and the app) Degraded.
  resources:
    requests:
      memory: 256Mi
  # Co-locate with the application-controller (loopback gRPC) without pinning to
  # a specific node, so the scheduler keeps them together wherever the
  # controller lands.
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-application-controller
          topologyKey: kubernetes.io/hostname
  # Default probes (timeoutSeconds: 1) trip while repo-server renders large Helm
  # charts: crossplane provider CRDs balloon the --api-versions list and a single
  # `helm template` can take ~60s, so /healthz can't answer in 1s -> liveness
  # kills the pod -> CrashLoopBackOff blocks EVERY app sync (crossplane looked
  # "down" 2026-07-15). Relaxed like the controller readinessProbe above.
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 5
  autoscaling:
    enabled: true
    minReplicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

applicationSet:
  replicas: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

configs:
  params:
    # Private/local-only submodules are not manifest sources. Disabling recursive
    # checkout prevents them from blocking repository generation.
    reposerver.enable.git.submodule: false
  cm:
    # Passwordless UI: --disable-auth only opens the API; the web UI still shows
    # a login page without a session. Anonymous access gives the UI a session.
    users.anonymous.enabled: "true"

    # -- Enable exec feature in Argo UI
    ## Ref: https://argo-cd.readthedocs.io/en/latest/operator-manual/rbac/#exec-resource
    exec.enabled: true

    # -- Timeout to discover if a new manifests version got published to the repository
    timeout.reconciliation: 10s

    # -- Timeout to refresh application data as well as target manifests cache
    timeout.hard.reconciliation: 0s

    # Crossplane health for EnvironmentVM: reconcile is deliberately paused
    # (crossplane.io/paused: "true") on these VMs, which Crossplane reports as
    # Synced=False / ReconcilePaused; the builtin *.crossplane.io lua maps any
    # Synced=False to Degraded. Skip that branch when paused so an intentionally
    # paused, Ready MR is not reported Degraded.
    resource.customizations.health.virtualenvironmentvm.proxmoxbpg.crossplane.io_EnvironmentVM: |
      -- Copy of argo-cd builtin resource_customizations/_.crossplane.io/_/health.lua
      -- with one change: Synced=False does not degrade a paused resource.
      health_status = {
        status = "Progressing",
        message = "Provisioning ..."
      }

      local function contains (table, val)
        for i, v in ipairs(table) do
          if v == val then
            return true
          end
        end
        return false
      end

      local has_no_status = {
        "Composition",
        "CompositionRevision",
        "DeploymentRuntimeConfig",
        "ClusterProviderConfig",
        "ProviderConfig",
        "ProviderConfigUsage",
        "ControllerConfig"
      }
      if obj.status == nil or next(obj.status) == nil and contains(has_no_status, obj.kind) then
        health_status.status = "Healthy"
        health_status.message = "Resource is up-to-date."
        return health_status
      end

      if obj.status == nil or next(obj.status) == nil or obj.status.conditions == nil then
        if (obj.kind == "ProviderConfig" or obj.kind == "ClusterProviderConfig") and obj.status.users ~= nil then
          health_status.status = "Healthy"
          health_status.message = "Resource is in use."
          return health_status
        end
        return health_status
      end

      local paused = obj.metadata ~= nil
        and obj.metadata.annotations ~= nil
        and obj.metadata.annotations["crossplane.io/paused"] == "true"

      for i, condition in ipairs(obj.status.conditions) do
        if condition.type == "LastAsyncOperation" then
          if condition.status == "False" then
            health_status.status = "Degraded"
            health_status.message = condition.message
            return health_status
          end
        end

        if condition.type == "Synced" then
          if condition.status == "False" and not paused then
            health_status.status = "Degraded"
            health_status.message = condition.message
            return health_status
          end
        end

        if contains({"Ready", "Healthy", "Offered", "Established", "ValidPipeline", "RevisionHealthy"}, condition.type) then
          if condition.status == "True" then
            health_status.status = "Healthy"
            health_status.message = "Resource is up-to-date."
          end
        end
      end

      return health_status

  rbac:
    # Anonymous user needs a role, otherwise the passwordless UI has no access.
    policy.default: role:admin
