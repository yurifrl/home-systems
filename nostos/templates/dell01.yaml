# Talos machineconfig TEMPLATE for dell01 (OptiPlex 3080M, amd64)
# Role: WORKER at 192.168.68.100
#
# DEMOTED controlplane->worker on 2026-08-05. The control plane moved to
# macintel01 (32GB) because dell01's 8GB repeatedly OOM-wedged etcd/apiserver.
# In-place demotion via `nostos apply dell01 --mode reboot` after dell01 was
# removed from etcd (`talosctl etcd remove-member`). As a worker Talos runs no
# etcd; the stale /var/lib/etcd is ignored.
#
# Secrets are the shared cluster secrets (1Password "kubernetes" vault).
version: v1alpha1
debug: false
persist: true

machine:
  type: worker
  token: "op://kubernetes/talos/MACHINE_TOKEN"
  ca:
    crt: "op://kubernetes/talos/MACHINE_CA_CRT"
    key: ""
  certSANs:
    - 192.168.68.100
    - 100.82.148.37
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.32.1
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    # Keep node-protection reservations: dell01 is only 8GB, so guard the OS +
    # kubelet against a workload spike OOMing the node.
    extraConfig:
      systemReserved:
        cpu: 150m
        memory: 512Mi
      kubeReserved:
        cpu: 150m
        memory: 512Mi
      evictionHard:
        memory.available: "500Mi"
        nodefs.available: "10%"
        imagefs.available: "10%"
    nodeIP:
      validSubnets:
        - 100.64.0.0/10
  network:
    hostname: dell01
    interfaces:
      - interface: enp2s0
        dhcp: false
        addresses:
          - 192.168.68.100/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.68.1
    nameservers:
      - 192.168.68.1
      - 8.8.8.8
  install:
    disk: /dev/nvme0n1
    image: {{ .InstallImage }}
    wipe: true
    extraKernelArgs:
      - talos.dashboard.disabled=0
  features:
    rbac: true
    stableHostname: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
  nodeLabels:
    node.kubernetes.io/exclude-from-external-load-balancers: ""
    node.longhorn.io/create-default-disk: "false"
  registries:
    config:
      ghcr.io:
        auth:
          username: "op://kubernetes/ghcr-image-pull-secret/username"
          password: "op://kubernetes/ghcr-image-pull-secret/password"

cluster:
  id: "op://kubernetes/talos/CLUSTER_ID"
  secret: "op://kubernetes/talos/CLUSTER_SECRET"
  # Worker: controlPlane.endpoint + extraHostEntries injected by nostos (now
  # pointing at macintel01, the sole control plane).
  clusterName: talos-default
  network:
    dnsDomain: cluster.local
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
  token: "op://kubernetes/talos/CLUSTER_TOKEN"
  ca:
    crt: "op://kubernetes/talos/CLUSTER_CA_CRT"
    key: ""
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service: {}
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: tailscale
environment:
  - TS_AUTHKEY=tailscale://authkey?description=dell01
  - TS_ROUTES=192.168.68.0/24
  - TS_EXTRA_ARGS=--reset
