# Talos machineconfig TEMPLATE for macarm01 (UTM/QEMU VM, arm64, Apple Silicon)
# Role: worker. Boot the Talos arm64 ISO in UTM (virtio-scsi disk, RNG device,
# bridged network), then: nostos apply macarm01 (insecure first-apply).
version: v1alpha1
debug: false
persist: true

machine:
  type: worker
  token: "op://kubernetes/talos/MACHINE_TOKEN"
  ca:
    crt: "op://kubernetes/talos/MACHINE_CA_CRT"
    key: ""
  certSANs: []
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.37.1
    defaultRuntimeSeccompProfileEnabled: true
    disableManifestsDirectory: true
    extraMounts:
      # Longhorn data disk mount (same pattern as tp1's template). Required for
      # the kubelet to see /var/mnt/storage, which machine.disks partitions and
      # mounts and Longhorn then uses as this node's storage disk.
      - destination: /var/mnt/storage
        type: bind
        source: /var/mnt/storage
        options:
          - bind
          - rshared
          - rw
  # Labels/annotations land on the Node object. The create-default-disk
  # "config" label (chart already sets createDefaultDiskLabeledNodes: true)
  # makes Longhorn create disks ONLY from the default-disks-config annotation
  # below — instead of auto-adopting every blank disk — and we tag the disk
  # `backup` so the longhorn-backup StorageClass (diskSelector: backup) binds
  # here and nowhere else.
  nodeLabels:
    node.longhorn.io/create-default-disk: "config"
  nodeAnnotations:
    node.longhorn.io/default-disks-config: '[{"path":"/var/mnt/storage","allowScheduling":true,"tags":["backup"]}]'
  network:
    hostname: macarm01
    interfaces:
      - interface: enp0s1
        dhcp: false
        addresses:
          - 192.168.68.90/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.68.1
    nameservers:
      - 192.168.68.1
      - 8.8.8.8
  install:
    disk: /dev/nvme0n1
    image: {{ .InstallImage }}
    wipe: true
  # Dedicated Longhorn data disk: a SECOND virtual disk attached in UTM
  # (virtio). The system NVMe stays Talos-owned (EPHEMERAL takes the rest —
  # do NOT carve storage out of it). A new virtio disk shows up as /dev/vda;
  # confirm with `talosctl -n 192.168.68.90 get disks` after attaching and
  # adjust the device below if it lands elsewhere (e.g. /dev/nvme1n1).
  disks:
    - device: /dev/vda
      partitions:
        - mountpoint: /var/mnt/storage
          size: 0 # use all available space
  features:
    rbac: true
    stableHostname: true
    apidCheckExtKeyUsage: true
    diskQuotaSupport: true
    kubePrism:
      enabled: true
      port: 7445
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
  registries:
    config:
      ghcr.io:
        auth:
          username: "op://kubernetes/ghcr-image-pull-secret/username"
          password: "op://kubernetes/ghcr-image-pull-secret/password"

cluster:
  id: "op://kubernetes/talos/CLUSTER_ID"
  secret: "op://kubernetes/talos/CLUSTER_SECRET"
  # controlPlane.endpoint + extraHostEntries are injected by nostos from
  # cluster.endpoint and the controlplane node set. Do not hardcode here.
  clusterName: talos-default
  network:
    cni:
      name: none
    dnsDomain: cluster.local
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
  token: "op://kubernetes/talos/CLUSTER_TOKEN"
  ca:
    crt: "op://kubernetes/talos/CLUSTER_CA_CRT"
    key: ""
---
apiVersion: v1alpha1
kind: ExtensionServiceConfig
name: tailscale
environment:
  - TS_AUTHKEY=tailscale://authkey?description=macarm01
  - TS_DEBUG_OMIT_LOCAL_ADDRS=true
  # On-LAN node (like dell01): NEVER --accept-routes (it hijacks the pod CIDR
  # and kills cluster DNS). --reset so `tailscale up` accepts the flag set.
  - TS_ROUTES=192.168.68.0/24
  - TS_EXTRA_ARGS=--reset
